## Settings file was created by plugin Alternative Damage Model v1.0.0
## Plugin GUID: com.rgreat.seapower.alternativedamagemodel

[DamageControlTeams]

## Damage control teams of a surface warship by displacement: tons=teams, from that many tons up. NumberOfDCTeams in a ship's ini still sets its own number.
# Setting type: String
# Default value: 0=1, 500=2, 1500=3, 5000=4, 20000=5
WarshipTeams = 0=1, 500=2, 1500=3, 5000=4, 20000=5

## Damage control teams of a submarine by displacement: tons=teams.
# Setting type: String
# Default value: 0=1, 1000=2, 5000=3, 8000=4
SubmarineTeams = 0=1, 1000=2, 5000=3, 8000=4

## Damage control teams of a civilian ship by displacement: tons=teams.
# Setting type: String
# Default value: 0=1, 20000=2
CivilianTeams = 0=1, 20000=2

## How much one team gets done (plugging, fire fighting, pumping, hull and system repairs) compared with the game. 1.0 = as in the game.
# Setting type: Factor
# Default value: 0.5
DCTeamEffectiveness = 0.5

## How fast a team moves through the ship, metres per minute. A transfer = MusterTime + the distance between the section and the middle of the ship (by its length) at this speed, rounded to 10 s. A team on the move cannot be given orders. 0 = no walking time. With TransferSpeed and MusterTime both 0 teams move at once, as in the game. While transfers take time, Auto DC keeps the walking down: one team per job (two where it is bad), the nearest free team is sent, idle teams wait where they are.
# Setting type: Factor
# Default value: 50.0
TransferSpeed = 50.0

## Seconds a team needs to get ready before every transfer.
# Setting type: Factor
# Default value: 60.0
MusterTime = 60.0

## Seconds a knocked-out team needs to recover; its walk from the section back to the middle of the ship is added.
# Setting type: Factor
# Default value: 90.0
HealTime = 180.0

## Random spread of the recovery time, seconds either way: HealTime 90 with 30 = 60 to 120 s, as in the game. 0 = always HealTime.
# Setting type: Factor
# Default value: 0.0
HealTimeSpread = 0.0

## A team knocked out this many times is dead and does not come back. 0 = never (as in the game).
# Setting type: Int32
# Default value: 2
KnockoutsToDeath = 2

[FireAndFlooding]

## How fast fires grow by themselves, between hits. 1.0 = as in the game, 2.0 = twice as fast, 0.5 = half as fast.
# Setting type: Factor
# Default value: 1.0
FlameUpSpeed = 0.2

## How fast a fire eats the hull of its section (integrity of both its compartments). 1.0 = as in the game. Damage to the systems in the section is not changed.
# Setting type: Factor
# Default value: 1.0
FireHullDamageSpeed = 0.1

## How fast damage control teams put fires out. 1.0 = as in the game.
# Setting type: Factor
# Default value: 1.0
ExtinguishSpeed = 1.0

## How fast water comes in through the holes of a compartment. 1.0 = as in the game.
# Setting type: Factor
# Default value: 1.0
FloodingSpeed = 0.5

## How fast damage control teams pump water out. 1.0 = as in the game.
# Setting type: Factor
# Default value: 1.0
PumpOutSpeed = 1.0

[General]

## Settings profile, chosen in the game: Unit Status -> Damage Control -> the gear next to (i). Base Game and Advanced come with the mod (Profiles folder of the mod, read-only); your own are in BepInEx/config/AlternativeDamageModel/Profiles. When the values below no longer match the chosen built-in profile (edited here or in the game), the profile becomes Custom.
# Setting type: String
# Default value: Advanced
Profile = Custom

## Enables verbose logging and BepInEx/AlternativeDamageModel.trace.txt.
# Setting type: Boolean
# Default value: false
Debug = true

## Diagnostics: writes every fire started by a hit and every change of a fire's stage to the BepInEx log (ship, compartment, mission time, severity and growth in % of the compartment's maximum, damage control teams there). Works also while the mod is off in the Mods menu, to compare with the game.
# Setting type: Boolean
# Default value: false
LogFires = true

## Writes a line to the BepInEx log for every ship that enters a mission: its hull integrity in the game and with the mod.
# Setting type: Boolean
# Default value: false
LogShipIntegrity = true

[HullIntegrity]

## How many times stronger the hull of surface warships is than in the game. 1.0 = as in the game, 2.0 = twice as strong. Single ships get their own value in section [HullIntegrityPerShip], one line per ship: ini file name = multiplier (e.g. usn_bb_iowa = 3.0).
# Setting type: Factor
# Default value: 2.0
Warships = 5.0

## How many times stronger the hull of civilian ships (ini files civ_*) is than in the game. 1.0 = as in the game.
# Setting type: Factor
# Default value: 2.0
CivilianShips = 2.0

## How many times stronger the hull of submarines is than in the game. 1.0 = as in the game.
# Setting type: Factor
# Default value: 1.0
Submarines = 1.0

[SideEffects]

## Vulnerability of the hull to gun shells (missiles, torpedoes and bombs are not affected). Gun shells take a share of a ship's sinking limit that depends on the size of the hull. 1.0 = each shell takes as much as in the game; the stronger hull just survives more hits. 2.0 = shells hit as if the hull were half as big; 0.5 = as if it were twice as big (medium shells may stop hurting big ships).
# Setting type: Factor
# Default value: 1.0
HullShellVulnerability = 1.0

## Vulnerability of the ship to fires started by hits (all weapon types). The stronger hull also holds fires back in the same proportion: with Warships = 5.0 a hit starts a fire 5 times weaker (relative to the compartment) than in the game. 1.0 = this normal behaviour of the mod. 2.0 = fires twice as strong and grow twice as fast; 0.5 = half as strong. 1.0 with every hull multiplier 1.0 = as in the game.
# Setting type: Factor
# Default value: 1.0
HullFireVulnerability = 1.0

## Vulnerability of the hull to flooding through holes made by hits (all weapon types). 1.0 = each hole lets in as much water as in the game, and holes above the waterline start leaking after the same damage as in the game (the stronger hull does not hold the water back). 2.0 = twice as much water; 0.5 = half.
# Setting type: Factor
# Default value: 1.0
HullFloodingVulnerability = 1.0

[Sinking]

## List, degrees, from which water comes over the deck edge and floods the low side fast (game: 45; it does not sink the ship by itself - capsizing at 70 does). Also the full scale of the LIST gauge.
# Setting type: Factor
# Default value: 31.5
ListLimit = 33.0

## Trim, degrees, for a ship TrimReferenceLength long. Past it the end that goes down floods fast (its section; the next one too past 1.5 x) - the ship does not sink at once as in the game (8 with a flooded section). Also the full scale of the TRIM gauge.
# Setting type: Factor
# Default value: 5.2
TrimLimit = 4.5

## Metres. The trim limit depends on the ship's length: the longer the ship, the sooner its bow or stern goes under at the same angle (tan limit = tan TrimLimit x (TrimReferenceLength / length)^0.442; with 5.2 at 100: 30 m 8.8, 60 m 6.5, 150 m 4.4, 300 m 3.2 degrees). 0 = TrimLimit for every ship (as in the game).
# Setting type: Factor
# Default value: 100.0
TrimReferenceLength = 150.0

## Water in the whole ship, %, from which it sinks (game: 40; submarines keep the game's 50). Also the full scale of the LEVEL gauge.
# Setting type: Factor
# Default value: 40.0
FloodLimit = 40.0

[UI]

## Unit Status -> Damage Control: integrity of each section's port / starboard compartment next to its name, one icon per damage control team showing what it is doing, water and fire in % with arrows for their trend.
# Setting type: Boolean
# Default value: true
DetailedDamageControl = true

## Flooding row: one arrow when the water level changes faster than this, in % of the compartment per second.
# Setting type: Factor
# Default value: 0.02
FloodingOneArrowAt = 0.02

## Flooding row: two arrows when the water level changes faster than this, in % of the compartment per second.
# Setting type: Factor
# Default value: 0.25
FloodingTwoArrowsAt = 0.25

## Fire row: one arrow when the fire changes faster than this, in % of its maximum per second.
# Setting type: Factor
# Default value: 0.05
FireOneArrowAt = 0.05

## Fire row: two arrows up when the fire grows faster than this, in % of its maximum per second.
# Setting type: Factor
# Default value: 1.0
FireTwoArrowsUpAt = 1.0

## Fire row: two arrows down when the fire is put out faster than this, in % of its maximum per second.
# Setting type: Factor
# Default value: 0.25
FireTwoArrowsDownAt = 0.25

[HullIntegrityPerShip]

## Own hull multiplier for single ships, one line per ship: ini file name = multiplier.
## How many times stronger the hull is than in the game; replaces the value from [HullIntegrity]
## (it is not multiplied by it). Ini file names: Sea Power_Data/StreamingAssets/original/vessels.
## Example:
## usn_bb_iowa = 3.0
## wp_pt_libelle = 1.0


