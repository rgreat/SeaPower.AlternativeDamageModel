[Language_en]
Name=Alternative Damage Model
Description=Alternative damage model: stronger hulls, damage control teams as people (they walk between sections, get knocked out, recover or die), a smarter Auto DC with DC Priority (Auto / Fire / Flooding) and orders to single teams, heavy list or trim floods the low end instead of sinking the ship at once, a detailed Damage Control tab (hull per side, one icon per team, water and fire with trend arrows and tooltips that explain them, LIST / TRIM / LEVEL gauges, flooding plan) and an in-game settings window with profiles: Base Game (as close to the game as possible) and Advanced, or your own. Requires BepInEx 5 and Anchor Chain. Settings: the gear next to (i) on the Damage Control tab, or BepInEx/config/com.rgreat.seapower.alternativedamagemodel.cfg.

[Language_ru]
Name=Альтернативная модель повреждений
Description=Альтернативная модель повреждений: прочнее корпуса, команды борьбы за живучесть как люди (переходят между отсеками, выбывают, выздоравливают или гибнут), умный Auto DC с приоритетом DC Priority (Auto / Fire / Flooding) и приказами отдельным командам, сильный крен или дифферент заливает опущенную сторону, а не топит корабль сразу, подробная вкладка Damage Control (прочность корпуса по бортам, значок на каждую команду, вода и пожары со стрелками динамики и подсказками о причинах, приборы LIST / TRIM / LEVEL, схема затоплений) и окно настроек в игре с профилями: Base Game (максимально близко к игре) и Advanced или свои. Нужны BepInEx 5 и Anchor Chain. Настройки: шестерёнка рядом с (i) на вкладке Damage Control или BepInEx/config/com.rgreat.seapower.alternativedamagemodel.cfg.

