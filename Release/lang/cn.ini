the_hull_armour_classes_of_the_world_war.c6a232 = 二战MOD的船体装甲等级：LightCruiser、HeavyCruiser、BattleCruiser、BattleCruiser2 和 SuperHeavy（不区分大小写）。游戏只认识 none / minor / moderate / heavy，其他等级一律当作 none：所有炮弹都会穿透装甲。开启后这五个等级生效，各自使用MOD中的穿透表（damage.ini）；船体装甲见日志中的 Hull 行。
