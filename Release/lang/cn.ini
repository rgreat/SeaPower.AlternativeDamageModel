the_chance_that_a_gun_shell_sets_a_compa.18f958 = 炮弹引燃舱室的概率取决于其战斗部威力。游戏中无论何种炮弹，被击中的舱室固定为20%（相邻舱室为12–18%，且仅当炮弹穿透装甲时）。启用此项后：100毫米及以上炮弹为90%，更小的按比例降低（37毫米=17%，76毫米=43%）；若炮弹被装甲挡住，则再乘以“被装甲挡住的命中引发火灾”选项（BlockedHitFireChance）。相邻舱室保留其中的0.6–0.9。燃烧弹仍由游戏处理。
90_from_100_mm_less_below.35975c = 100毫米起90%，更小则更低
fires_from_gun_shells_stopped_by_the_mai.3a8091 = 被主装甲挡住的炮弹引发的火灾。游戏中,未击穿装甲的炮弹不会在命中舱室相邻的舱室引发火灾。启用本选项后,这类炮弹仍可能在那里引发火灾(不损伤船体,不进水):概率为游戏中击穿炮弹的概率乘以此数值。0 = 关闭(与游戏一致),1 = 与击穿炮弹相同的概率,0.5 = 一半。
