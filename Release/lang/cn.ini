the_armour_classes_of_the_world_war_ii_m.e5dd05 = 二战MOD的装甲等级（LightCruiser、HeavyCruiser、BattleCruiser、BattleCruiser2、SuperHeavy；不区分大小写），适用于船体和模块。游戏把它们当作无装甲：所有炮弹都会穿透。开启后每个等级介于游戏自带等级之间（从最硬到最软：SuperHeavy、heavy、BattleCruiser2、BattleCruiser、HeavyCruiser、moderate、LightCruiser、minor），并有各自的船体完整度加成。[General] 中没有 ArmorType 的船体会从 [TaskForce] 读取。
