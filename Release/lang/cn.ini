; Alternative Damage Model - texts, language: cn
; key = text   (\n = line break; keep {0} {1} ...)
; Machine translation, not checked by a native speaker: corrections are welcome.

a_burning_section_opens_its_plugged_leak.20b488 = 燃烧的区段会重新打开已堵住的漏洞:火势100%时每秒为该区段最大漏洞的百分之几(火势较小时更少)。0 = 关闭。
a_fire_does_not_spread_into_a_compartmen.6e664b = 火灾不会蔓延到有损管小组的舱室(小组在门口挡住火势)。关闭 = 与游戏相同。
a_fire_no_damage_control_team_has_fought.5e3fa0 = 一段时间内没有损管小组扑救的火灾会越长越快:每次火灾检查(FireCheckTime,10秒),其增长率都会上升,就像该区段再次被击中一样。关闭 = 与游戏相同(火灾只因命中而增长)。
a_fully_flooded_section_water_above_75_i.aaedbd = 完全进水的区段(水量超过75%):其系统会被降为严重损坏、无法运作,并且在进水期间无法修理。
a_hit_on_a_compartment_that_is_already_d.364c92 = 对已被摧毁舱室的命中不会浪费:一半伤害转给相邻舱室(同一舷,朝舰中部方向);若该舱室也已被摧毁,四分之一转给再下一个。摧毁舱室那一击的多余伤害也按同样方式传递。
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = 对区段的命中可能在任何完整度下使小组受伤。关闭 = 与游戏相同:只有完整度低于50%的受击区段才会让小组失去战斗力,概率为 伤害 x (1 - 完整度),最高20%。开启 = 对有小组的区段的每次命中都会进行受伤判定(见 Wound chance);受伤的小组前往预备队。
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = 被火重新打开的漏洞会重新扩大,最多到该区段曾有的最大漏洞的这个百分比。
a_section_under_the_sea_puts_its_fire_ou.3d1565 = 位于海面以下的区段会扑灭自己的火:甲板边缘每沉入水下1米,火每秒损失其最大值的这个百分比(1 = 每米每秒1%)。仅当区段左右两个甲板点都在水下时才生效,深度取两者平均值。需要舰船的甲板点(与甲板进水相同)。0 = 关闭。
a_team_cannot_plug_holes_while_the_ship.f5f08f = 舰速高于此值(节)时,小组无法堵漏。0 = 无限制。
a_team_in_a_burning_section_loses_this_m.ecb388 = 处于燃烧区段的小组,在该区段没有任何小组扑救时,火势100%下每秒损失这么多的满额生命值(火势较小时更少)。
a_team_in_the_reserve_recovers_this_much.2dd530 = 预备队中的小组每秒恢复这么多的满额生命值。
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = 短于50米的AI舰船(不含玩家自己的)不会因进水而减速:游戏因漏洞和水量造成的速度削减对它们关闭(它们继续前进,像神风一样)。你自己舰船的“Limit Speed”按钮是独立的。
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = 严重火灾(达到最大值的50%以上)蔓延到相邻区段的概率,每次火灾检查的百分比:游戏每FireCheckTime(10秒)以0.0133%的概率检查一次——几乎不会发生。0.0133 = 与游戏相同;1.0 = 每次检查1%(严重火灾大约每17分钟一次),0 = 永不。
colours_the_weapon_buttons_of_the_select.a41d7b = 根据武器系统状态为所选单位底部面板的武器按钮着色:全部正常 - 游戏颜色,该类型部分失效 - 黄色,全部失效 - 红色。
concussion_a_team_wounded_by_a_weapon_a.2d37ab = 脑震荡:被武器击伤的小组(在受击区段或预备队)进入预备队后会震荡这么多秒;震荡结束前Auto DC不会让其回去工作。它与小组生命值并行,后者有自己的恢复。0 = 无脑震荡。
counterflooding_lets_water_into_one_side.8d3f44 = 反向进水只会向舱室的一舷放水,直到这个百分比(游戏自身的舱室上限同样有效)。
damage_control_efficiency_while_the_ship.d761c8 = 舰船发动机(使用中的Engine模块,而非推进器)失效时的损管效率:小组效率百分比(火灾、漏洞、水、船体;系统修理不受影响)。显示在小组提示和Damage Control标签的Forecast行中。100 = 关闭。
damage_control_teams_in_a_section_with_a.e2dc23 = 在起火区段中不扑救火灾的损管小组,以其效率的这个百分比工作。100 = 关闭。
damage_control_teams_of_a_civilian_ship.630d69 = 按排水量决定的民用船只损管小组:吨=小组。
damage_control_teams_of_a_submarine_by_d.556a4a = 按排水量决定的潜艇损管小组:吨=小组。
damage_control_teams_of_a_surface_warshi.2960b3 = 按排水量决定的水面战舰损管小组:吨=小组,从该吨位起。舰船ini中的NumberOfDCTeams仍会设定其自身的数量。
debug_draws_the_selected_ship_s_hull_onl.f6f266 = 调试:将所选舰船仅船体的碰撞体网格(coll_hull*)绘制为半透明叠加层,并以明亮线框显示其实际三角形,便于与可见的3D模型直接对比。
debug_for_the_ship_currently_selected_in.50880e = 调试:对在Unit Status面板中选中的舰船,画出从当前海浪到估计甲板高度的线,位于船体艏艉中线,以及每个损伤模型区段的左舷/右舷一对点(其自身的纵向中心点)——仅船体碰撞体,不含炮塔、桅杆或其他子模型。绿色:该点高于海浪;红色:海浪淹没了它。
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = 调试:所选舰船自身3D模型(含子模型)的绘制方式,以便查看ShowDeckCorners/ShowHullCollider:Show(与游戏相同)、Translucent(70%透明)或Hide。
diagnostics_while_a_ship_lists_or_trims.7ab078 = 诊断:当舰船明显横倾或纵倾时,每2秒向BepInEx日志写入:横倾、纵倾、高度、浮力与重量、浸没体积、舰内水量,以及是否正在下沉/倾覆。
diagnostics_writes_every_fire_started_by.c267ad = 诊断:将每次由命中引起的火灾以及火灾阶段的每次变化写入BepInEx日志(舰船、舱室、任务时间、占舱室最大值百分比的强度与增长、该处的损管小组)。即使在Mods菜单中关闭了模组也能工作,便于与游戏对比。
enables_verbose_logging_and_bepinex_alte.5d311f = 启用详细日志和BepInEx/AlternativeDamageModel.trace.txt。
fire_row_one_arrow_when_the_fire_changes.2c03b0 = 火灾行:火灾变化快于此值时显示一个箭头,单位为每秒占最大值的百分比。
fire_row_two_arrows_down_when_the_fire_i.cfce19 = 火灾行:火灾被扑灭的速度快于此值时显示两个向下箭头,单位为每秒占最大值的百分比。
fire_row_two_arrows_up_when_the_fire_gro.8de955 = 火灾行:火灾增长快于此值时显示两个向上箭头,单位为每秒占最大值的百分比。
fixes_an_error_of_the_game_itself_above.638bbb = 修复游戏自身的一个错误:时间压缩高于10x时,舰船的纵倾会随时间压缩而增大(25米艇以47节:10x以内2.6度,100x时9度)——足以让短小、快速、完好的舰船沉没。游戏每个物理刻将舰船移动一步,高于10x时该步长被拉长,而浮力力矩仍以步前的重心计算。开启:去掉这多出的一步,使纵倾在任何时间压缩下都保持10x时的值;10x以内不变。仅水面舰船。关闭:游戏自身行为。
flooding_row_and_flooding_plan_one_arrow.802936 = 进水行和进水计划:水位变化快于此值时显示一个箭头,单位为每秒占舱室的百分比。
flooding_row_and_flooding_plan_two_arrow.129e17 = 进水行和进水计划:水位变化快于此值时显示两个箭头,单位为每秒占舱室的百分比。
four_small_icons_under_a_ship_s_icon_on.001776 = 地图上舰船图标下方的四个小图标(包括你自己的):火灾(火灾总强度)、水、船体(按Damage Control面板分类)和发动机;按严重程度显示黄/橙/红,舰船即将沉没时(按进水/船体趋势20分钟内)地图图标会更灰。接触:火灾、水、船体和发动机仅在直接目视时;声纳——仅发动机(黄:部分丧失,红:全部不工作);雷达——对过去10分钟内被击中的舰船的估计,标有“?”(黄:10节或更低,红:低于3);ESM或无接触时没有,已沉没的舰船也没有。Damage Control标签的Fires行使用相同的总强度。接触目标的Unit Status显示一个Damage State标签,以文字呈现相同信息。
health_of_a_damage_control_team_a_multip.330f74 = 损管小组的生命值,为其最大值的倍数,最大值按舰船排水量为1..100点(100 = 1000人以上的乘员,约100000吨;1000 吨 = 10,10000 吨 = 32)。在小组提示中显示为满额的一部分。降到0的小组死亡。受伤的小组工作更慢(与其生命值成比例,不低于25%)。0 = 小组永不受伤(命中仍会使小组离开其区段)。
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = 火灾侵蚀其区段船体(两个舱室的完整度)的速度。1.0 = 与游戏相同。区段内系统所受伤害不变。
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = 预备队中的小组消除疲劳的速度,占其工作时积累速度的百分比。100 = 同样快;50 = 休息时间是工作的两倍。
how_fast_a_team_walks_through_the_ship_m.440ac9 = 小组在舰内行走的速度,米每分钟(预备队在中部)。一次转移 = MusterTime + 行走时间,取整到10秒。0 = 无行走时间;MusterTime也为0时,小组瞬间移动,Auto DC即游戏自带的。
how_fast_damage_control_teams_pump_water.daadca = 损管小组排水的速度。1.0 = 与游戏相同。
how_fast_damage_control_teams_put_fires.5d5eaf = 损管小组灭火的速度。1.0 = 与游戏相同。
how_fast_fires_grow_by_themselves_betwee.e757ca = 火灾在两次命中之间自行增长的速度。1.0 = 与游戏相同,2.0 = 两倍快,0.5 = 一半。
how_fast_water_comes_in_through_the_hole.cad705 = 水通过舱室漏洞涌入的速度。1.0 = 与游戏相同。
how_many_times_stronger_the_hull_of_civi.706453 = 民用船只(ini文件 civ_*)的船体比游戏中强多少倍。1.0 = 与游戏相同。
how_many_times_stronger_the_hull_of_subm.d3d1a9 = 潜艇的船体比游戏中强多少倍。1.0 = 与游戏相同。
how_many_times_stronger_the_hull_of_surf.32130e = 水面战舰的船体比游戏中强多少倍。1.0 = 与游戏相同,2.0 = 强两倍。个别舰船在[HullIntegrityPerShip]段中获得自己的值,每艘一行:ini文件名 = 倍数(例如 usn_bb_iowa = 3.0)。
how_much_one_team_gets_done_plugging_fir.8ecb35 = 一个小组完成的工作量(堵漏、灭火、排水、船体和系统修理)与游戏相比。1.0 = 与游戏相同。
how_strongly_the_list_follows_uneven_flo.541fe4 = 横倾跟随不均匀进水的程度。区段左右舷之间的水量差(使舰船横倾)乘以此值;区段平均值保持不变,因此吃水和纵倾不受影响。1 = 与游戏相同,2 = 同样差值下横倾加倍。
how_the_ship_s_speed_changes_the_growth.6d2cf6 = 舰速如何改变火灾增长和进水(通过漏洞和甲板边缘):节=进水/火灾倍数,经过各点的折线。速度取绝对值;低于第一个点和高于最后一个点时采用两端的倍数。
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = 模组文本的语言:en、ru、cn、de、es、fr、ko、ja 或 vn。留空 = 游戏的语言。文本位于模组的lang文件夹(lang/<代码>.ini);缺少的文本以英语显示。
list_degrees_the_full_scale_of_the_list.a220dc = 横倾,度:LIST仪表的满刻度。从其红区(其75%)起,水会越过甲板边缘,迅速淹没低舷的所有舱室(游戏:45)。它本身不会使舰船沉没;70度倾覆则会,与游戏相同。
metres_the_trim_limit_depends_on_the_shi.be80af = 米。纵倾极限取决于舰长:舰越长,同样角度下艏或艉越早入水(tan极限 = tan TrimLimit x (TrimReferenceLength / 长度)^0.442;100处为5.2时:30米 8.8,60米 6.5,150米 4.4,300米 3.2度)。0 = 所有舰船使用TrimLimit(与游戏相同)。
minutes_of_work_in_a_section_until_a_tea.abe7fb = 小组在区段中工作到疲劳(第一级)的分钟数;其速度按Speed设置下降。预备队消除疲劳的速度与工作积累的速度相同。显示在小组提示中;疲劳小组的图标会高亮。0 = 无疲劳。
minutes_of_work_until_a_team_is_exhauste.461264 = 小组工作到筋疲力尽(疲劳的第二级)的分钟数(最多:疲劳在此停止增长)。不高于“Tired after” = 无第二级。
multiplier_of_the_chance_that_a_hit_woun.6766c6 = 命中使小组受伤的概率倍数(0.5 = 概率减半,2 = 加倍;结果最高100%)。第1步(仅当Wounds at any hull integrity关闭时)——游戏决定命中是否使小组离开其区段(仅完整度低于50%的受击区段:伤害 x (1 - 完整度),最高20%)。第2步——模组决定受伤:概率随战斗部威力(约 威力^1.8)急剧上升,随小组生命值(约 生命值^1.2)下降——战斗部2.2对生命值2:约10%,对100:0.1%;战斗部82对100:约75%;远高于此则超过100%。再乘以此倍数,然后限制在100%(Wounds at any hull integrity关闭时,未受伤的小组仍会离开区段)。更强的战斗部提高概率。更大的舰船降低概率:其小组更耐打(生命值更多),舱室更大,命中落在小组所在位置的可能性更小。即使最弱的命中也有很小的概率。例,战斗部25:对生命值12约100%,对29约37%,对100约9%。0 = 永不受伤。
multiplier_of_the_strength_of_a_wound_at.119bcb = 受伤强度的倍数:最多为弹药的战斗部威力(0..196,游戏中一半弹药低于25)x 此值,以小组生命值点数计(按排水量1..100)。受伤的小组前往预备队。
random_spread_of_the_concussion_time_sec.c54f69 = 脑震荡时间的随机浮动,双向秒数:HealTime 90 配 30 = 60 至 120 秒,与游戏相同。0 = 始终HealTime。
resistance_to_the_horizontal_movement_of.dc8036 = 对被摧毁舰船水平运动的阻力,为游戏线性阻力的倍数(几乎所有舰船为25):残骸更快失去航速。1 = 与游戏相同。下沉(垂直运动)和转动(倾覆)不会被减慢。
seconds_game_time_so_time_compression_co.551b95 = 舱室甲板点必须连续位于海面以下多少秒(游戏时间,计入时间压缩),水才开始从甲板进入(见DeckFloodingSpeed)。浮出水面的点会重置计时器。默认3。
seconds_a_team_needs_to_get_ready_before.3b6e27 = 小组每次转移前做好准备所需的秒数。在其仍在准备时取消转移不花费时间。
settings_profile_in_use_chosen_in_the_ga.331d79 = 当前使用的设置配置文件,在游戏中选择:Unit Status -> Damage Control -> (i)旁边的齿轮。此文件只包含通用设置([General]、[UI]);损伤模型的值在配置文件的文件中:内置的在模组的Profiles文件夹(只读),你自己的在StreamingAssets/user/AlternativeDamageControl/Profiles。在游戏中更改内置配置文件会将其保存为Custom。对使用中配置文件的文件或此名称的修改会在游戏运行时被读取。
ships_ini_file_names_comma_separated_edi.c5b815 = 不获得Deck Points的舰船(ini文件名,逗号分隔;在设置窗口的Flooding标签中编辑):它们按旧的、较简单的规则进水,与没有船体碰撞体的舰船相同。
team_fatigue_on_working_builds_it_up_the.e170b3 = 小组疲劳开启:工作积累疲劳,预备队消除疲劳,疲劳的小组以一半速度工作。关闭 = 无疲劳;其设置被隐藏。
team_health_on_wounds_from_hits_and_fire.0440b7 = 小组生命值开启:命中和火灾造成受伤,在预备队中恢复,受伤的小组工作更慢。关闭 = 游戏规则(命中使小组暂时退出,无受伤);其他生命值设置被隐藏。
the_detailed_view_of_unit_status_damage.b04888 = Unit Status -> Damage Control的详细视图(模组的显示):每个区段名称旁按舷显示的船体完整度、每个损管小组一个图标(其任务;Auto DC关闭时可手动分配任务和移动)、带趋势箭头的水和火百分比、DC Priority、小组卡片、带进水计划的LIST / TRIM / LEVEL仪表、提示、图例(i)。关闭:游戏自己的视图(设置窗口的齿轮保留)。
the_mod_s_damage_model_and_damage_contro.b3b07a = 模组的损伤模型和损害管制:船体和系统强度、副作用、火灾和进水速度、火灾蔓延、损管小组(数量、效率、步行转移、失去战斗力、优化的Auto DC、移动单个小组)、横倾 / 纵倾 / 沉没极限。DC Priority和手动下达的任务属于详细视图并保留。关闭:游戏自身的损伤和损害管制(Damage Control标签视图保留)。可随时切换:海上的舰船立即跟随(船体强度和小组数量恢复为游戏或模组的值;行进中的小组到达,失去战斗力的恢复)。
the_teams_rest_in_the_central_compartmen.4ac676 = 小组在中央舱室休息:对其的命中可能使预备队中等待的小组受伤(概率是游戏对在受击区段中被击退小组的概率:伤害 x (1 - 完整度),仅在完整度低于50%时)。受伤的休息小组留在预备队。
trim_degrees_for_a_ship_trimreferencelen.8ab413 = 纵倾,度,针对长度为TrimReferenceLength的舰船:TRIM仪表的满刻度。从其红区(其75%)起,下沉的一端迅速进水:每舷最外侧的舱室,满了就下一个,依此类推。与游戏(一个区段进水即8度)不同,舰船不会立刻沉没。
unattended_fire_how_much_the_growth_rate.84fa6e = 无人看管的火灾:每次火灾检查增长率上升多少,占火灾最大增长率的百分比(普通命中增加0.1-0.8%)。
unattended_fire_its_growth_rate_is_raise.b4969b = 无人看管的火灾:其增长率只会升到此值,占火灾每秒最大值的百分比。
unattended_fire_seconds_without_a_team_f.098d15 = 无人看管的火灾:没有小组扑救的秒数(从开始起,或从小组最后一次扑救起),之后它开始更快增长。
vulnerability_of_the_hull_to_flooding_th.35677a = 船体对命中造成的漏洞进水的脆弱性(所有武器类型)。1.0 = 每个漏洞进水量与游戏相同,水线以上的漏洞在与游戏相同的伤害后开始渗漏(更强的船体并不能挡住水)。2.0 = 水量加倍;0.5 = 减半。
vulnerability_of_the_hull_to_gun_shells.c70d65 = 船体对舰炮炮弹的脆弱性(导弹、鱼雷和炸弹不受影响)。炮弹占用舰船沉没极限的一部分,取决于船体大小。1.0 = 每发炮弹占用量与游戏相同;更强的船体只是能承受更多命中。2.0 = 炮弹打击如同船体只有一半大;0.5 = 如同两倍大(中口径炮弹可能不再伤及大型舰船)。
vulnerability_of_the_ship_to_fires_start.50481c = 舰船对命中引发火灾的脆弱性(所有武器类型)。更强的船体也按同样比例压制火灾:Warships = 5.0时,一次命中引发的火灾(相对舱室)比游戏弱5倍。1.0 = 模组的这一正常行为。2.0 = 火灾强两倍且增长快两倍;0.5 = 强度减半。所有船体倍数为1.0时1.0 = 与游戏相同。
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = 区段中的水限制其火灾:火灾不能强于最大值的(100 - 该区段水量%)。更强的火灾以每秒最大值的这个百分比降至该上限。0 = 关闭。
water_in_the_whole_ship_the_average_of_i.a5b547 = 全舰水量百分比(各舱室平均值),达到后下沉,与游戏相同(游戏:40;潜艇保持游戏的50)。也是LEVEL仪表的满刻度。
water_over_the_deck_edge_a_multiplier_fo.512690 = 越过甲板边缘的水,一个倍数。对于已知甲板点的舰船(完整的船体碰撞体算法):当舱室的甲板点连续位于海面以下DeckFloodingDelay秒(游戏时间,计入时间压缩)后,该舱室会进水,损管无法阻止——1.0 = 每沉入1米每秒进水其体积的0.1%(越深越快);满舱将水传给位置最低的未满相邻舱室,沿链继续。对其他舰船:下沉的一端(纵倾超过极限)或低舷(横倾超过极限)越过甲板边缘进水的速度——模组自己的机制,游戏中没有。2.0 = 两倍快,0.5 = 一半,0 = 关闭。
when_a_ship_starts_to_sink_the_game_puts.562c7b = 舰船开始下沉时,游戏将其重心放在船体原点((0, 1, 0),若已倾覆):重心跳变,船体上的所有力矩随之改变。开启 = 重心保持原位。关闭 = 与游戏相同。
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = 小组堵住舱室漏洞时(Flooding Rate任务)同时从中排水:排水速度的这个比例(0.5 = 一半,0 = 关闭)。被命令反向进水的小组只从不会加重横倾和纵倾的一舷排水。
work_speed_of_a_rested_team_the_starting.1e64b0 = 休息好的小组的工作速度,%(疲劳曲线的起点)。速度从这里到疲劳级呈直线下降。
work_speed_of_a_team_that_has_just_becom.425925 = 刚疲劳的小组的工作速度,%。在疲劳与筋疲力尽两级之间速度呈直线下降。
work_speed_of_an_exhausted_team_it_stays.4cfc9a = 筋疲力尽的小组的工作速度,%;只要小组继续工作就保持在此值。
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = 为每艘进入任务的舰船向BepInEx日志写一行:其在游戏中和使用模组时的船体完整度。
