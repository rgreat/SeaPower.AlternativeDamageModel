the_hull_armour_classes_of_the_world_war.fbf596 = 二战MOD的装甲等级：LightCruiser、HeavyCruiser、BattleCruiser、BattleCruiser2 和 SuperHeavy（不区分大小写）。游戏只认识 none / minor / moderate / heavy，其他等级一律当作 none：所有炮弹都会穿透装甲。开启后这五个等级对船体和模块（炮塔、弹药库、机舱……）生效，各自位于游戏自带等级之间的穿透矩阵中（从最硬到最软：SuperHeavy、heavy、BattleCruiser2、BattleCruiser、HeavyCruiser, moderate、LightCruiser、minor）；船体装甲见日志中的 Hull 行。它们还会获得游戏装甲的船体完整度加成（minor ×1.2、moderate ×1.25、heavy ×1.3），在其间按等间距分配：SuperHeavy ×1.3125、BattleCruiser2 ×1.2875、BattleCruiser ×1.275、HeavyCruiser ×1.2625、LightCruiser ×1.225。[General] 中没有 ArmorType 的船体会从 [TaskForce] 读取（MOD中的 usn_bb_iowa45 和 usn_bb_missouri2 就是这样写的；游戏会给它们 minor）。
the_hull_armour_classes_of_the_world_war.e2dbf4 = 二战MOD的装甲等级：LightCruiser、HeavyCruiser、BattleCruiser、BattleCruiser2 和 SuperHeavy（不区分大小写）。游戏只认识 none / minor / moderate / heavy，其他等级一律当作 none：所有炮弹都会穿透装甲。开启后这五个等级对船体和模块（炮塔、弹药库、机舱……）生效，各自位于游戏自带等级之间的穿透矩阵中（从最硬到最软：SuperHeavy、heavy、BattleCruiser2、BattleCruiser、HeavyCruiser, moderate、LightCruiser、minor）；船体装甲见日志中的 Hull 行。它们还会获得游戏装甲的船体完整度加成（minor ×1.2、moderate ×1.25、heavy ×1.3），具体为：SuperHeavy ×1.3，BattleCruiser2、BattleCruiser 和 HeavyCruiser ×1.25，LightCruiser ×1.2。[General] 中没有 ArmorType 的船体会从 [TaskForce] 读取（MOD中的 usn_bb_iowa45 和 usn_bb_missouri2 就是这样写的；游戏会给它们 minor）。
