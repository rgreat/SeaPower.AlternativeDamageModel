the_hull_armour_classes_of_the_world_war.c6c4c0 = 二战MOD的装甲等级：LightCruiser、HeavyCruiser、BattleCruiser、BattleCruiser2 和 SuperHeavy（不区分大小写）。游戏只认识 none / minor / moderate / heavy，其他等级一律当作 none：所有炮弹都会穿透装甲。开启后这五个等级对船体和模块（炮塔、弹药库、机舱……）生效，各自使用MOD中的穿透表（damage.ini）；船体装甲见日志中的 Hull 行。[General] 中没有 ArmorType 的船体会从 [TaskForce] 读取（MOD中的 usn_bb_iowa45 和 usn_bb_missouri2 就是这样写的；游戏会给它们 minor）。
the_hull_armour_classes_of_the_world_war.0ba238 = 二战MOD的装甲等级：LightCruiser、HeavyCruiser、BattleCruiser、BattleCruiser2 和 SuperHeavy（不区分大小写）。游戏只认识 none / minor / moderate / heavy，其他等级一律当作 none：所有炮弹都会穿透装甲。开启后这五个等级对船体和模块（炮塔、弹药库、机舱……）生效，各自位于游戏自带等级之间的穿透矩阵中（从最硬到最软：SuperHeavy、heavy、BattleCruiser2、BattleCruiser、moderate = HeavyCruiser、LightCruiser、minor）；船体装甲见日志中的 Hull 行。[General] 中没有 ArmorType 的船体会从 [TaskForce] 读取（MOD中的 usn_bb_iowa45 和 usn_bb_missouri2 就是这样写的；游戏会给它们 minor）。
