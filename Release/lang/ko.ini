; Alternative Damage Model - texts, language: ko
; key = text   (\n = line break; keep {0} {1} ...)
; Machine translation, not checked by a native speaker: corrections are welcome.

a_burning_section_opens_its_plugged_leak.20b488 = 불타는 구역이 막아 둔 누수를 다시 엽니다: 화재 100%에서 초당 구역의 최대 누수 대비 % (작은 화재는 더 적게). 0 = 끔.
a_fire_does_not_spread_into_a_compartmen.6e664b = 화재는 피해 통제팀이 있는 구획으로 번지지 않습니다 (문 앞에서 막습니다). 끔 = 게임과 동일.
a_fire_no_damage_control_team_has_fought.5e3fa0 = 한동안 피해 통제팀이 진화하지 않은 화재는 점점 더 빨리 커집니다: 화재 점검(FireCheckTime, 10초)마다 구역이 다시 피격된 것처럼 성장률이 오릅니다. 끔 = 게임과 동일 (화재는 피격으로만 커집니다).
a_fully_flooded_section_water_above_75_i.aaedbd = 완전히 침수된 구역(물 75% 초과): 시스템이 심각한 손상 상태가 되어 작동 불능이 되며, 침수된 동안은 수리할 수 없습니다.
a_hit_on_a_compartment_that_is_already_d.364c92 = 이미 파괴된 구획에 대한 피격은 사라지지 않습니다: 피해의 절반은 이웃 구획(같은 현, 선체 중앙 방향)으로 가고, 그 구획도 파괴되었으면 4분의 1이 그다음 구획으로 갑니다. 구획을 파괴한 피격의 초과분도 같은 방식으로 넘어갑니다.
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = 구역에 대한 피격은 선체 무결성과 관계없이 팀을 부상시킬 수 있습니다. 끔 = 게임과 동일: 무결성 50% 미만의 피격 구역만 확률 피해 x (1 - 무결성), 최대 20%로 팀을 이탈시킵니다. 켬 = 팀이 있는 구역에 대한 모든 피격에 부상 판정(Wound chance 참조)을 적용하며, 부상당한 팀은 예비대로 이동합니다.
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = 화재로 다시 열린 누수는 구역이 가졌던 최대 누수의 이 %까지 다시 커집니다.
a_section_under_the_sea_puts_its_fire_ou.45fb26 = 바다 아래의 구역은 화재를 끕니다: 구역의 갑판 가장자리가 물에 잠긴 미터마다 화재가 초당 최대치의 이 %를 잃습니다 (1 = 미터 수만큼 초당 %). 함선의 갑판 지점이 필요합니다 (갑판 침수와 동일). 0 = 끔.
a_team_cannot_plug_holes_while_the_ship.f5f08f = 함선 속도가 이 값(노트)보다 빠르면 팀이 구멍을 막을 수 없습니다. 0 = 제한 없음.
a_team_in_a_burning_section_loses_this_m.ecb388 = 불타는 구역의 팀은 구역의 팀 중 적어도 하나가 진화하지 않는 한, 화재 100%에서 초당 전체 체력의 이만큼을 잃습니다 (작은 화재는 더 적게).
a_team_in_the_reserve_recovers_this_much.2dd530 = 예비대의 팀은 초당 전체 체력의 이만큼을 회복합니다.
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = 50 m보다 짧은 AI 함선(플레이어 함선 제외)은 침수로 느려지지 않습니다: 구멍과 물로 인한 게임의 속도 삭감이 꺼집니다 (카미카제처럼 계속 나아갑니다). 내 함선의 "Limit Speed" 버튼은 별개입니다.
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = 심한 화재(최대치의 50% 이상)가 이웃 구역으로 번질 확률, 화재 점검당 %: 게임은 FireCheckTime(10초)마다 0.0133% 확률로 판정합니다 - 거의 일어나지 않습니다. 0.0133 = 게임과 동일; 1.0 = 점검당 1% (심한 화재 17분에 약 한 번), 0 = 안 번짐.
colours_the_weapon_buttons_of_the_select.a41d7b = 선택한 유닛의 하단 패널 무기 버튼을 무기 시스템 상태에 따라 색칠합니다: 모두 작동 - 게임 색, 해당 종류 일부 작동 불능 - 노랑, 전부 작동 불능 - 빨강.
concussion_a_team_wounded_by_a_weapon_a.2d37ab = 뇌진탕: 무기에 부상당한 팀(피격 구역 또는 예비대)은 예비대에 들어간 뒤 이 초 동안 뇌진탕 상태가 되며, 뇌진탕이 끝날 때까지 Auto DC가 작업에 복귀시키지 않습니다. 자체 회복이 있는 팀 체력과 별도로 진행됩니다. 0 = 뇌진탕 없음.
counterflooding_a_team_s_task_given_by_h.9424ff = 역침수(수동으로 부여하는 팀 임무): 구획에 물을 들이는 속도, 배수 속도의 배수. 물은 기울기의 반대 현으로, 선체가 곧을 때는 물이 적은 현으로 들어갑니다.
counterflooding_lets_water_into_one_side.8d3f44 = 역침수는 구획의 한쪽에 이 %까지만 물을 들입니다 (게임의 구획 자체 한도도 적용됩니다).
damage_control_efficiency_while_the_ship.d761c8 = 함선의 엔진(추진기가 아닌 사용 중인 Engine 모듈)이 작동 불능일 때의 피해 통제 효율: 팀 효율 % (화재, 누수, 물, 선체; 시스템 수리는 영향 없음). 팀 툴팁과 Damage Control 탭의 Forecast 줄에 표시됩니다. 100 = 끔.
damage_control_teams_in_a_section_with_a.e2dc23 = 화재가 난 구역에서 진화하지 않는 피해 통제팀은 효율의 이 %로 작업합니다. 100 = 끔.
damage_control_teams_of_a_civilian_ship.630d69 = 배수량에 따른 민간 선박의 피해 통제팀: 톤=팀.
damage_control_teams_of_a_submarine_by_d.556a4a = 배수량에 따른 잠수함의 피해 통제팀: 톤=팀.
damage_control_teams_of_a_surface_warshi.2960b3 = 배수량에 따른 수상 전투함의 피해 통제팀: 톤=팀, 해당 톤 이상부터. 함선 ini의 NumberOfDCTeams는 여전히 고유 수를 지정합니다.
debug_draws_the_selected_ship_s_hull_onl.f6f266 = 디버그: 선택한 함선의 선체 전용 콜라이더 메시(coll_hull*)를 반투명 오버레이와 실제 삼각형의 밝은 와이어프레임으로 그려 보이는 3D 모델과 직접 비교합니다.
debug_for_the_ship_currently_selected_in.50880e = 디버그: Unit Status 패널에서 선택한 함선에 대해 현재 파도에서 선체 선수·선미 중심선, 그리고 피해 모델 구역별 좌현/우현 쌍(길이 방향 고유 중심점)의 추정 갑판 높이까지 선을 그립니다 - 선체 콜라이더만, 포탑·마스트 등 하위 모델은 제외. 초록: 파도 위; 빨강: 파도에 잠김.
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = 디버그: 선택한 함선의 3D 모델(하위 모델 포함) 표시 방식으로, ShowDeckCorners/ShowHullCollider를 볼 수 있게 합니다: Show(게임과 동일), Translucent(70% 투명), Hide.
diagnostics_while_a_ship_lists_or_trims.7ab078 = 진단: 함선이 눈에 띄게 기울거나 트림이 생기는 동안 2초마다 BepInEx 로그에 기울기, 트림, 높이, 부력 대 무게, 잠긴 부피, 함 내 물, 침몰/전복 여부를 기록합니다.
diagnostics_writes_every_fire_started_by.c267ad = 진단: 피격으로 시작된 모든 화재와 화재 단계 변화를 BepInEx 로그에 기록합니다 (함선, 구획, 임무 시간, 구획 최대치 대비 % 강도와 성장, 해당 위치의 피해 통제팀). Mods 메뉴에서 모드가 꺼져 있어도 작동하여 게임과 비교할 수 있습니다.
do_not_draw_in_the_3d_view_the_targets_o.f88a4e = 시각으로 관측되지 않는 타 진영의 목표(레이더·소나·데이터로만 아는 것)를 3D 화면에 그리지 않습니다. 내 유닛은 항상 그려집니다.
enables_verbose_logging_and_bepinex_alte.5d311f = 상세 로깅과 BepInEx/AlternativeDamageModel.trace.txt를 켭니다.
fire_looks_by_the_fire_s_strength_share.296366 = 화재가 게임의 단계 대신 강도(최대치 대비 비율)에 따라 보입니다: 작음, SmokeModerateFrom부터 보통, SmokeSevereFrom부터 심함 (게임: 25% / 50%); 작은 화재의 연기는 SmokeStartOpacity에서 SmokeEndOpacity로 커집니다. 겉모습만 바뀌며 피해와 확산은 게임 그대로입니다. 끔 = 게임과 동일.
fire_row_one_arrow_when_the_fire_changes.2c03b0 = 화재 줄: 화재가 이보다 빠르게 변할 때 화살표 하나, 초당 최대치의 %.
fire_row_two_arrows_down_when_the_fire_i.cfce19 = 화재 줄: 화재가 이보다 빠르게 꺼질 때 아래 화살표 둘, 초당 최대치의 %.
fire_row_two_arrows_up_when_the_fire_gro.8de955 = 화재 줄: 화재가 이보다 빠르게 커질 때 위 화살표 둘, 초당 최대치의 %.
fixes_an_error_of_the_game_itself_above.638bbb = 게임 자체의 오류를 수정합니다: 시간 압축 10x 이상에서 함선의 트림이 시간 압축에 따라 커집니다 (47노트의 25 m 보트: 10x까지 2.6도, 100x에서 9도) - 짧고 빠르며 멀쩡한 함선을 가라앉히기에 충분합니다. 게임은 물리 틱마다 한 스텝씩 함선을 움직이는데, 10x 이상에서는 이 스텝이 늘어나는 반면 부력 토크는 스텝 이전의 무게중심 기준으로 계산됩니다. 켬: 그 추가 스텝을 빼서 트림이 어떤 시간 압축에서도 10x와 같게 유지됩니다; 10x까지는 변화 없음. 수상함만. 끔: 게임 동작.
flooding_row_and_flooding_plan_one_arrow.802936 = 침수 줄과 침수 계획: 수위가 이보다 빠르게 변할 때 화살표 하나, 초당 구획의 %.
flooding_row_and_flooding_plan_two_arrow.129e17 = 침수 줄과 침수 계획: 수위가 이보다 빠르게 변할 때 화살표 둘, 초당 구획의 %.
four_small_icons_under_a_ship_s_icon_on.001776 = 지도의 함선 아이콘 아래 작은 아이콘 네 개(내 함선 포함): 화재(화재 총 강도), 물, 선체(Damage Control 패널의 분류), 엔진; 심각도에 따라 노랑/주황/빨강, 함선이 침몰할 예정이면(침수/선체 추세로 20분 이내) 지도 아이콘이 더 회색이 됩니다. 접촉: 화재, 물, 선체, 엔진은 직접 시야에서만; 소나로는 엔진만(노랑: 일부 상실, 빨강: 작동 없음); 레이더로는 최근 10분 내 피격된 함선에 대한 추정으로 '?' 표시(노랑: 10노트 이하, 빨강: 3 미만); ESM이나 접촉 없이는 없음, 침몰한 함선도 없음. Damage Control 탭의 Fires 줄도 같은 총 강도를 사용합니다. 접촉의 Unit Status에는 같은 정보를 글로 보여 주는 Damage State 탭이 있습니다.
health_of_a_damage_control_team_a_multip.330f74 = 피해 통제팀의 체력, 함선 배수량에 따라 1..100점인 최대치의 배수 (100 = 승조원 1000명 이상, 약 30000 t; 1000 t = 24, 10000 t = 101). 팀 툴팁에 전체 대비로 표시됩니다. 0인 팀은 사망입니다. 부상 팀은 느리게 작업합니다 (체력만큼, 25% 이상). 0 = 팀이 부상당하지 않음 (피격은 여전히 팀을 구역에서 이탈시킵니다).
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = 화재가 구역의 선체(두 구획의 무결성)를 얼마나 빨리 갉아먹는지. 1.0 = 게임과 동일. 구역 시스템에 대한 피해는 변하지 않습니다.
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = 예비대의 팀이 피로를 푸는 속도, 작업 중 쌓이는 속도의 %. 100 = 같은 속도; 50 = 휴식이 작업의 두 배 걸림.
how_fast_a_team_walks_through_the_ship_m.440ac9 = 팀이 함선 안을 걷는 속도, 분당 미터 (예비대는 중앙). 이동 = MusterTime + 걷는 시간, 10초 단위로 올림. 0 = 걷는 시간 없음; MusterTime도 0이면 팀이 즉시 이동하고 Auto DC는 게임의 것입니다.
how_fast_damage_control_teams_pump_water.daadca = 피해 통제팀이 물을 빼는 속도. 1.0 = 게임과 동일.
how_fast_damage_control_teams_put_fires.5d5eaf = 피해 통제팀이 불을 끄는 속도. 1.0 = 게임과 동일.
how_fast_fires_grow_by_themselves_betwee.e757ca = 피격 사이에 화재가 스스로 커지는 속도. 1.0 = 게임과 동일, 2.0 = 두 배, 0.5 = 절반.
how_fast_water_comes_in_through_the_hole.cad705 = 구획의 구멍으로 물이 들어오는 속도. 1.0 = 게임과 동일.
how_many_times_stronger_the_hull_of_civi.706453 = 민간 선박(ini 파일 civ_*)의 선체가 게임보다 몇 배 튼튼한지. 1.0 = 게임과 동일.
how_many_times_stronger_the_hull_of_subm.d3d1a9 = 잠수함의 선체가 게임보다 몇 배 튼튼한지. 1.0 = 게임과 동일.
how_many_times_stronger_the_hull_of_surf.32130e = 수상 전투함의 선체가 게임보다 몇 배 튼튼한지. 1.0 = 게임과 동일, 2.0 = 두 배. 개별 함선은 [HullIntegrityPerShip] 섹션에 함선당 한 줄로 고유 값을 가집니다: ini 파일 이름 = 배수 (예: usn_bb_iowa = 3.0).
how_much_one_team_gets_done_plugging_fir.8ecb35 = 팀 하나가 해내는 일(누수 차단, 소화, 배수, 선체 및 시스템 수리)이 게임에 비해 얼마나 되는지. 1.0 = 게임과 동일.
how_strongly_the_list_follows_uneven_flo.541fe4 = 기울기가 불균등한 침수를 얼마나 따르는지. 구역의 좌현과 우현 사이 물의 차이(함선을 기울이는 것)에 이 값을 곱하며, 구역의 평균은 유지되어 흘수와 트림은 이로 인해 변하지 않습니다. 1 = 게임과 동일, 2 = 같은 차이에서 두 배 기울기.
how_the_ship_s_speed_changes_the_growth.6d2cf6 = 함선 속도가 화재 성장과 유입되는 물(구멍과 갑판 가장자리)을 어떻게 바꾸는지: 노트=침수/화재 배수, 점을 잇는 꺾은선. 속도는 절댓값으로 취하며, 첫 점 아래와 마지막 점 위에서는 양 끝의 배수가 적용됩니다.
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = 모드 텍스트의 언어: en, ru, cn, de, es, fr, ko, ja 또는 vn. 비움 = 게임의 언어. 텍스트는 모드의 lang 폴더(lang/<코드>.ini)에 있으며, 없는 텍스트는 영어로 표시됩니다.
list_degrees_the_full_scale_of_the_list.a220dc = 기울기, 도: LIST 게이지의 전체 눈금. 빨간 영역(75%)부터 갑판 가장자리로 물이 들어와 낮은 현의 모든 구획을 빠르게 침수시킵니다 (게임: 45). 그 자체로 침몰시키지는 않으며, 70도 전복은 게임처럼 침몰시킵니다.
metres_the_trim_limit_depends_on_the_shi.be80af = 미터. 트림 한계는 함선 길이에 따라 다릅니다: 길수록 같은 각도에서 선수나 선미가 더 일찍 잠깁니다 (tan 한계 = tan TrimLimit x (TrimReferenceLength / 길이)^0.442; 100에서 5.2일 때: 30 m 8.8, 60 m 6.5, 150 m 4.4, 300 m 3.2도). 0 = 모든 함선에 TrimLimit (게임과 동일).
minutes_game_time_so_time_compression_co.f7d751 = 함선이 가라앉기 시작한 뒤 침몰 거품 효과가 방출을 멈추는 시간, 분 (게임 시간, 시간 압축 반영; 게임은 잔해가 있는 동안 멈추지 않음). 긴 임무에서 자원을 절약합니다. 0 = 안 멈춤, 게임과 동일.
minutes_of_work_in_a_section_until_a_tea.abe7fb = 팀이 지칠 때(첫 단계)까지 구역에서 일하는 시간, 분; 속도는 Speed 설정대로 떨어집니다. 예비대는 작업이 쌓는 만큼 빨리 피로를 덜어냅니다. 팀 툴팁에 표시되며 지친 팀의 아이콘이 강조됩니다. 0 = 피로 없음.
minutes_of_work_until_a_team_is_exhauste.461264 = 팀이 탈진(피로의 두 번째 단계)할 때까지의 작업 시간, 분 (최대: 피로는 거기서 더 늘지 않음). 'Tired after' 이하 = 두 번째 단계 없음.
multiplier_of_the_chance_that_a_hit_woun.6766c6 = 피격이 팀을 부상시킬 확률의 배수 (0.5 = 절반, 2 = 두 배; 결과는 최대 100%). 1단계 (Wounds at any hull integrity가 꺼진 동안만) - 게임이 피격이 팀을 구역에서 이탈시키는지 결정 (무결성 50% 미만의 피격 구역만: 피해 x (1 - 무결성), 최대 20%). 2단계 - 모드가 부상을 결정: 확률은 탄두 위력(약 위력^1.8)에 따라 가파르게 오르고 팀 체력(약 체력^1.2)에 따라 떨어집니다 - 탄두 2.2 대 체력 2: 약 10%, 대 100: 0.1%; 탄두 82 대 100: 약 75%; 그 이상은 100% 초과. 이 배수를 곱한 뒤 100%로 제한됩니다 (Wounds at any hull integrity가 꺼져 있으면 부상당하지 않은 팀도 구역을 떠납니다). 강한 탄두는 확률을 올리고, 큰 함선은 낮춥니다: 팀이 더 튼튼하고(체력 높음) 구획이 커서 팀이 있는 곳에 맞을 확률이 낮습니다. 가장 약한 피격도 작은 확률이 있습니다. 예, 탄두 25: 체력 12에 약 100%, 29에 약 37%, 100에 약 9%. 0 = 절대 부상 없음.
multiplier_of_the_strength_of_a_wound_at.119bcb = 부상 강도의 배수: 탄약 탄두 위력(0..196, 게임 탄약의 절반은 25 미만) x 이 값이 최대이며, 팀 체력(배수량에 따라 1..100)의 점수로 계산됩니다. 부상당한 팀은 예비대로 이동합니다.
number_of_fire_and_smoke_points_by_ship.4fd67c = 게임의 3개 대신 함선 길이에 따른 화재·연기 지점 수: 25 m 미만 1, 50 m 미만 2, 75 m 미만 3, 75 m 이상 5 (구역당 하나, 각각 자기 구역의 화재를 표시). 지금부터 생성되는 함선에 적용.
random_spread_of_the_concussion_time_sec.c54f69 = 뇌진탕 시간의 무작위 편차, 양방향 초: HealTime 90에 30 = 60~120초, 게임과 동일. 0 = 항상 HealTime.
resistance_to_the_horizontal_movement_of.dc8036 = 파괴된 함선의 수평 이동에 대한 저항, 게임의 선형 저항(거의 모든 함선에서 25)의 배수: 잔해가 더 빨리 속도를 잃습니다. 1 = 게임과 동일. 침강(수직 이동)과 회전(전복)은 느려지지 않습니다.
seconds_game_time_so_time_compression_co.551b95 = 구획의 갑판 지점이 연속으로 바다 아래에 있어야 갑판으로 물이 들어오기 시작하는 시간, 초 (게임 시간, 시간 압축 반영; DeckFloodingSpeed 참조). 떠오르는 지점은 타이머를 초기화합니다. 기본 3.
seconds_a_team_needs_to_get_ready_before.3b6e27 = 팀이 이동마다 준비하는 데 필요한 초. 준비 중에 이동을 취소해도 시간이 들지 않습니다.
settings_profile_in_use_chosen_in_the_ga.1bca98 = 사용 중인 설정 프로필, 게임에서 선택: Unit Status -> Damage Control -> (i) 옆의 톱니바퀴. 이 파일에는 일반 설정([General], [UI])만 있으며, 피해 모델 값은 프로필 파일에 있습니다: 내장 프로필은 모드의 Profiles 폴더(읽기 전용), 사용자 프로필은 StreamingAssets/user/AdvancedDamageControl/Profiles. 게임에서 내장 프로필을 바꾸면 Custom으로 저장됩니다. 사용 중인 프로필 파일이나 이 이름의 수정은 게임 실행 중에 반영됩니다.
ships_ini_file_names_comma_separated_edi.c5b815 = Deck Points를 받지 않는 함선 (ini 파일 이름, 쉼표로 구분; 설정 창 Flooding 탭에서 편집): 선체 콜라이더가 없는 함선처럼 오래된 단순한 규칙으로 침수됩니다.
small_fire_smoke_opacity_of_new_particle.16bc8d = 작은 화재: 화재 최대치 0%에서 새 입자의 연기 불투명도, 게임 대비 %.
small_fire_smoke_opacity_of_new_particle.75284c = 작은 화재: SmokeModerateFrom에서 새 입자의 연기 불투명도, 게임 대비 %; 그 사이는 화재 강도에 따라 고르게.
team_fatigue_on_working_builds_it_up_the.e170b3 = 팀 피로 켬: 작업이 쌓고 예비대가 덜어내며, 지친 팀은 절반 속도로 일합니다. 끔 = 피로 없음; 관련 설정 숨김.
team_health_on_wounds_from_hits_and_fire.0440b7 = 팀 체력 켬: 피격과 화재로 인한 부상, 예비대에서의 회복, 부상 팀은 느리게 작업합니다. 끔 = 게임 규칙 (피격이 팀을 잠시 이탈시키며 부상 없음); 다른 체력 설정은 숨김.
the_detailed_view_of_unit_status_damage.b04888 = Unit Status -> Damage Control의 상세 보기(모드의 화면): 구역 이름 옆 현별 선체 무결성, 피해 통제팀별 아이콘(임무; Auto DC가 꺼지면 수동 임무와 이동), 추세 화살표가 있는 물·화재 %, DC Priority, 팀 카드, 침수 계획이 있는 LIST / TRIM / LEVEL 게이지, 툴팁, 범례 (i). 끔: 게임 자체 보기 (설정 창 톱니바퀴는 유지).
the_mod_s_damage_model_and_damage_contro.b3b07a = 모드의 피해 모델과 피해 통제: 선체와 시스템 강도, 부수 효과, 화재와 침수 속도, 화재 확산, 피해 통제팀(수, 효율, 도보 이동, 이탈, 최적화된 Auto DC, 개별 팀 이동), 기울기 / 트림 / 침몰 한계. DC Priority와 수동 임무는 상세 보기에 속하며 유지됩니다. 끔: 게임 자체의 피해와 피해 통제 (Damage Control 탭 보기는 유지). 언제든 전환 가능: 바다의 함선은 즉시 따릅니다 (선체 강도와 팀 수는 게임 또는 모드 값으로; 이동 중인 팀은 도착하고 이탈한 팀은 회복).
the_moderate_fire_s_look_from_this_stren.5ec64a = 보통 화재의 모습이 시작되는 강도, 화재 최대치의 % (게임: 25%).
the_severe_fire_s_look_from_this_strengt.79bf05 = 심한 화재의 모습이 시작되는 강도, 화재 최대치의 % (게임: 50%).
the_teams_rest_in_the_central_compartmen.4ac676 = 팀은 중앙 구획에서 쉽니다: 그곳에 대한 피격은 예비대에서 대기 중인 팀을 부상시킬 수 있습니다 (확률은 피격 구역에서 이탈한 팀에 대한 게임의 것: 피해 x (1 - 무결성), 무결성 50% 미만에서만). 부상당한 휴식 팀은 예비대에 남습니다.
trim_degrees_for_a_ship_trimreferencelen.8ab413 = 트림, 도, 길이 TrimReferenceLength인 함선 기준: TRIM 게이지의 전체 눈금. 빨간 영역(75%)부터 가라앉는 쪽 끝이 빠르게 침수됩니다: 각 현에서 가장 바깥 구획, 가득 차면 다음 구획 순서로. 게임(침수 구역 하나에 8도)과 달리 함선이 바로 가라앉지는 않습니다.
unattended_fire_how_much_the_growth_rate.84fa6e = 방치된 화재: 화재 점검마다 성장률이 오르는 양, 화재 최대 성장률의 % (일반 피격은 0.1-0.8% 추가).
unattended_fire_its_growth_rate_is_raise.b4969b = 방치된 화재: 성장률이 이 값까지만 올라갑니다, 초당 화재 최대치의 %.
unattended_fire_seconds_without_a_team_f.098d15 = 방치된 화재: 팀이 진화하지 않은 초 (시작 후 또는 팀이 마지막으로 진화한 후) 이후 더 빨리 커지기 시작합니다.
vulnerability_of_the_hull_to_flooding_th.35677a = 피격으로 생긴 구멍을 통한 침수에 대한 선체 취약도 (모든 무기). 1.0 = 구멍마다 게임과 같은 양의 물이 들어오고, 수선 위 구멍도 게임과 같은 피해 후 새기 시작합니다 (튼튼한 선체도 물을 막지 못함). 2.0 = 물 두 배; 0.5 = 절반.
vulnerability_of_the_hull_to_gun_shells.c70d65 = 함포탄에 대한 선체 취약도 (미사일, 어뢰, 폭탄은 해당 없음). 함포탄은 선체 크기에 따른 함선 침몰 한계의 일부를 차지합니다. 1.0 = 포탄마다 게임과 같은 양; 튼튼한 선체는 더 많은 피격을 견딜 뿐입니다. 2.0 = 선체가 절반 크기인 것처럼 피격; 0.5 = 두 배 크기인 것처럼 (중형 포탄이 대형 함선에 피해를 못 줄 수 있음).
vulnerability_of_the_ship_to_fires_start.50481c = 피격으로 시작되는 화재에 대한 함선 취약도 (모든 무기). 튼튼한 선체는 같은 비율로 화재도 억제합니다: Warships = 5.0이면 피격이 게임보다 (구획 대비) 5배 약한 화재를 일으킵니다. 1.0 = 모드의 이 일반 동작. 2.0 = 화재가 두 배 강하고 두 배 빨리 성장; 0.5 = 절반. 모든 선체 배수 1.0에서 1.0 = 게임과 동일.
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = 구역의 물이 화재를 제한합니다: 최대치의 (100 - 구역의 물 %)보다 강할 수 없습니다. 더 강한 화재는 초당 최대치의 이 %로 그 한계까지 내려갑니다. 0 = 끔.
water_in_the_whole_ship_the_average_of_i.a5b547 = 함선 전체의 물 %(구획 평균), 이 값부터 침몰, 게임과 동일 (게임: 40; 잠수함은 게임의 50 유지). LEVEL 게이지의 전체 눈금이기도 합니다.
water_over_the_deck_edge_a_multiplier_fo.512690 = 갑판 가장자리 너머 물, 배수. 갑판 지점이 알려진 함선(전체 선체 콜라이더 알고리즘): 구획의 갑판 지점이 DeckFloodingDelay초 연속 바다 아래에 있으면(게임 시간, 시간 압축 반영) 구획이 피해 통제로 막을 수 없는 물을 받습니다 - 1.0 = 잠긴 미터당 초당 부피의 0.1% (깊을수록 빠름); 가득 찬 구획은 가장 낮은 곳의 가득 차지 않은 이웃에게 물을 넘기며 사슬을 따라 이어집니다. 다른 함선: 가라앉는 쪽 끝(트림이 한계를 넘을 때) 또는 낮은 현(기울기가 한계를 넘을 때)이 갑판 가장자리로 물을 받는 속도 - 게임에 없는 모드 고유 메커니즘. 2.0 = 두 배 빠르게, 0.5 = 절반, 0 = 끔.
when_a_ship_starts_to_sink_the_game_puts.562c7b = 함선이 가라앉기 시작하면 게임은 무게중심을 선체 원점((0, 1, 0), 전복 시)으로 옮깁니다: 무게중심이 튀고 선체의 모든 토크도 함께 바뀝니다. 켬 = 무게중심이 있던 자리에 유지. 끔 = 게임과 동일.
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = 팀이 구획의 구멍을 막는 동안(Flooding Rate 임무) 동시에 물을 빼냅니다: 배수 속도의 이 비율 (0.5 = 절반, 0 = 끔). 역침수를 명령받은 팀은 기울기와 트림이 악화되지 않는 현에서만 배수합니다.
work_speed_of_a_rested_team_the_starting.1e64b0 = 휴식한 팀의 작업 속도, % (피로 곡선의 시작점). 속도는 여기서 지친 단계까지 직선으로 떨어집니다.
work_speed_of_a_team_that_has_just_becom.425925 = 막 지친 팀의 작업 속도, %. 지침과 탈진 단계 사이에서 속도는 직선으로 떨어집니다.
work_speed_of_an_exhausted_team_it_stays.4cfc9a = 탈진한 팀의 작업 속도, %; 팀이 계속 일하는 동안 유지됩니다.
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = 임무에 들어오는 모든 함선에 대해 BepInEx 로그에 한 줄을 씁니다: 게임과 모드에서의 선체 무결성.
