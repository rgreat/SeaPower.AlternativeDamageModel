the_hull_armour_classes_of_the_world_war.c6c4c0 = 第二次世界大戦MODの装甲クラス：LightCruiser、HeavyCruiser、BattleCruiser、BattleCruiser2、SuperHeavy（大文字小文字は問いません）。ゲームは none / minor / moderate / heavy しか知らず、他のクラスは none として扱うため、すべての砲弾が装甲を貫通します。これを有効にすると5つのクラスが船体とモジュール（砲塔、弾薬庫、機関室など）で機能し、それぞれMODの貫通表（damage.ini）を使います。船体の装甲はログの Hull 行にあります。[General] に ArmorType がない船体は [TaskForce] から読みます（MODの usn_bb_iowa45 と usn_bb_missouri2 がそうなっており、ゲームでは minor になります）。
the_hull_armour_classes_of_the_world_war.0ba238 = 第二次世界大戦MODの装甲クラス：LightCruiser、HeavyCruiser、BattleCruiser、BattleCruiser2、SuperHeavy（大文字小文字は問いません）。ゲームは none / minor / moderate / heavy しか知らず、他のクラスは none として扱うため、すべての砲弾が装甲を貫通します。これを有効にすると5つのクラスが船体とモジュール（砲塔、弾薬庫、機関室など）で機能し、それぞれ貫通マトリクスでゲーム本来のクラスの間に配置されます（硬い順：SuperHeavy、heavy、BattleCruiser2、BattleCruiser、moderate = HeavyCruiser、LightCruiser、minor）。船体の装甲はログの Hull 行にあります。[General] に ArmorType がない船体は [TaskForce] から読みます（MODの usn_bb_iowa45 と usn_bb_missouri2 がそうなっており、ゲームでは minor になります）。
