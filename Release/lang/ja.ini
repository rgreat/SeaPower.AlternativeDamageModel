health_of_a_damage_control_team_a_multip.e4f712 = ダメージコントロールチームの体力、最大値の倍率で、最大値は艦の排水量により1..100点(100 = 乗員1000以上、約100000 t;1000 t = 10、10000 t = 32)。チームのヒントに満タンに対する割合で表示されます。0のチームは死亡です。負傷したチームは遅く働きます(体力に応じて、25%未満にはならない)。0 = チームは負傷しない(被弾は依然としてチームを区画から外します)。
chance_that_a_wounded_team_is_concussed.e510d4 = 負傷した班が昏倒する確率（HealTime を参照）: 負傷（班の体力に対する割合）にこの数を掛けた値で、最大 100%。2.0 = 20% の負傷は 40% の確率で昏倒、50% 以上は常に昏倒。1.0 = 20% の負傷は 20%。100 = 常に昏倒（ゲームどおり）。体力モデルなしでゲームが戦闘不能にした班は常に昏倒します。
concussion_chance.0ef45f = 脳震盪の確率
wound_100_always.0d4fec = × 負傷 · 100 = 常に
chance_that_a_wounded_team_is_concussed.cdf858 = 負傷したチームが脳震盪を起こす確率(HealTime参照):今回の負傷と、これまでにチームが失った体力の合計(どちらもチームの体力に対する割合)の平均に、この値を掛けたもの。上限100%。無傷のチームでは負傷そのものになります:2.0なら20%の負傷は40%の確率で、50%以上は必ず脳震盪になります。以前に負傷したチームはより脳震盪になりやすくなります。100 = 常に脳震盪(ゲームと同じ)。体力モデルなしでゲームが戦闘不能にしたチームは常に脳震盪になります。
multiplier_of_the_chance_that_a_wounded.d13899 = 負傷したチームが脳震盪を起こす確率の倍率(HealTime参照)。確率は、負傷にこれまでにチームが失った体力の合計(チームの体力に対する割合)を加えたもので、上限は100%です:1.0なら、無傷のチームが20%負傷すると40%の確率で、50%以上なら必ず脳震盪になり、以前に負傷したチームはより脳震盪になりやすくなります。0 = なし、100 = 常に(ゲームと同じ)。
multiplier_of_the_chance_that_a_wounded.50992e = 負傷したチームが脳震盪を起こす確率の倍率(HealTime参照)。確率は、今回の負傷と、これまでにチームが失った体力の合計(チームの体力に対する割合)の平均にこの値を掛けたもので、上限は100%です。無傷のチームでは負傷そのものになります:1.0なら20%の負傷は20%、50%の負傷は50%の確率で脳震盪になり、以前に負傷したチームはより脳震盪になりやすくなります。0 = なし、100 = 常に(ゲームと同じ)。
multiplier_of_the_chance_that_a_wounded.e66163 = 負傷したチームが脳震盪を起こす確率の倍率(HealTime参照)。確率は、負傷がチームの負傷前の体力に占める割合にこの値を掛けたもので、上限は100%です:無傷のチームが20%負傷すれば20%、体力が40%残っているチームが同じ20%(持っていた体力の半分)を負傷すれば50%の確率で脳震盪になります。0 = なし、100 = 常に(ゲームと同じ)。
multiplier_of_the_chance_that_a_wounded.a8a160 = 負傷したチームが脳震盪を起こす確率の倍率(HealTime参照)。確率は、負傷がチームの負傷前の体力に占める割合の半分にこの値を掛けたもので、上限は100%です:1.0なら、無傷のチームが20%負傷すると10%、体力が40%残っているチームが同じ20%(持っていた体力の半分)を負傷すると25%の確率で脳震盪になります。0 = なし、1000 = ほぼ常に(ゲームと同じ)。
multiplier_of_the_chance_above_shellfire.df07f6 = 上記の確率の倍率（ShellFireByPower）。1 = 説明どおり、0.5 = 半分。
the_chance_that_a_gun_shell_sets_a_compa.96a25e = 砲弾が区画に火災を起こす確率は、弾頭の威力で決まります。ゲームでは砲弾の種類にかかわらず、命中した区画は一律20%（隣接区画は12〜18%で、装甲を貫通した場合のみ）です。このオプションでは、100mm以上の砲弾で90%、小さい砲弾は比例して低くなり（37mm＝17%、76mm＝43%）、装甲に阻まれた場合は半分になります。隣接区画はその0.6〜0.9を受け継ぎます。焼夷弾はゲームの処理のままです。
