the_chance_that_a_gun_shell_sets_a_compa.18f958 = 砲弾が区画に火災を起こす確率は、弾頭の威力で決まります。ゲームでは砲弾の種類にかかわらず、命中した区画は一律20%（隣接区画は12〜18%で、装甲を貫通した場合のみ）です。このオプションでは、100mm以上の砲弾で90%、小さい砲弾は比例して低くなり（37mm＝17%、76mm＝43%）、装甲に阻まれた場合は「装甲に阻まれた命中による火災」オプション（BlockedHitFireChance）が掛かります。隣接区画はその0.6〜0.9を受け継ぎます。焼夷弾はゲームの処理のままです。
90_from_100_mm_less_below.35975c = 100mm以上で90%、それ未満は低下
fires_from_gun_shells_stopped_by_the_mai.3a8091 = 主装甲に阻止された砲弾による火災。ゲームでは、装甲を貫通しなかった砲弾は着弾区画の隣の区画に火災を起こしません。このオプションでは、そのような砲弾でも隣の区画で火災を起こすことがあります(船体ダメージも浸水もなし)。確率はゲームの貫通弾の確率にこの値を掛けたものです。0 = オフ(ゲームと同じ)、1 = 貫通弾と同じ確率、0.5 = 半分。
