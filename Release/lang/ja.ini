; Alternative Damage Model - texts, language: ja
; key = text   (\n = line break; keep {0} {1} ...)
; Machine translation, not checked by a native speaker: corrections are welcome.

a_burning_section_opens_its_plugged_leak.20b488 = 燃えている区画は塞いだ浸水箇所を再び開きます:火災100%で毎秒、区画の最大浸水箇所の何%か(小さい火災ではより少なく)。0 = オフ。
a_fire_does_not_spread_into_a_compartmen.6e664b = 火災はダメージコントロールチームがいる区画には広がりません(扉の前で食い止めます)。オフ = ゲームと同じ。
a_fire_no_damage_control_team_has_fought.5e3fa0 = しばらくダメージコントロールチームが消火していない火災は、どんどん速く成長します:火災チェック(FireCheckTime、10秒)ごとに、区画が再び被弾したかのように成長率が上がります。オフ = ゲームと同じ(火災は被弾でのみ成長)。
a_fully_flooded_section_water_above_75_i.aaedbd = 完全に浸水した区画(水が75%超):そのシステムは重度の損傷状態になり、使用不能となり、浸水している間は修理できません。
a_hit_on_a_compartment_that_is_already_d.364c92 = すでに破壊された区画への被弾は失われません:ダメージの半分は隣の区画(同じ舷、艦の中央側)へ、そこも破壊されていれば4分の1がその次へ回ります。区画を破壊した被弾の余剰も同じように回ります。
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = 区画への被弾は、船体耐久に関係なくチームを負傷させる場合があります。オフ = ゲームと同じ:耐久50%未満の被弾区画のみ、確率 ダメージ x (1 - 耐久)(最大20%)でチームが戦列を離れます。オン = チームのいる区画へのすべての被弾に負傷判定(Wound chance 参照)が行われ、負傷したチームは予備へ移動します。
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = 火災で再び開いた浸水箇所は、区画がこれまでに持った最大浸水箇所のこの%まで再び拡大します。
a_section_under_the_sea_puts_its_fire_ou.3d1565 = 海面下の区画は火災を消します:区画の甲板縁が水没している1メートルごとに、火災は毎秒最大値のこの%を失います(1 = メートル数と同じ%毎秒)。区画の左右両方の甲板ポイントが水没したときだけ有効で、深さは両者の平均です。艦の甲板ポイントが必要です(甲板からの浸水と同様)。0 = オフ。
a_team_cannot_plug_holes_while_the_ship.f5f08f = 艦の速度がこの値(ノット)を超えている間、チームは穴を塞げません。0 = 制限なし。
a_team_in_a_burning_section_loses_this_m.ecb388 = 燃えている区画のチームは、その区画のチームが1つも消火していない限り、火災100%で毎秒、満タン体力のこの分を失います(小さい火災ではより少なく)。
a_team_in_the_reserve_recovers_this_much.2dd530 = 予備のチームは毎秒、満タン体力のこの分を回復します。
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = 50 mより短いAI艦(プレイヤー艦を除く)は浸水で減速しません:穴と水によるゲームの速度低下は無効です(特攻のように進み続けます)。自艦の「Limit Speed」ボタンは別です。
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = 激しい火災(最大値の50%以上)が隣の区画へ延焼する確率、火災チェックごとの%:ゲームはFireCheckTime(10秒)ごとに0.0133%の確率で判定します - ほぼ起こりません。0.0133 = ゲームと同じ;1.0 = チェックごとに1%(激しい火災で約17分に1回)、0 = 延焼なし。
colours_the_weapon_buttons_of_the_select.a41d7b = 選択したユニットの下部パネルの武器ボタンを、武器システムの状態で色分けします:すべて稼働 - ゲームの色、その種類の一部が使用不能 - 黄、すべて使用不能 - 赤。
concussion_a_team_wounded_by_a_weapon_a.2d37ab = 脳震盪:武器で負傷したチーム(被弾区画または予備)は、予備に入ってからこの秒数のあいだ脳震盪状態になり、脳震盪が終わるまで自動ダメージコントロールは作業に戻しません。独自の回復を持つチーム体力と並行して進みます。0 = 脳震盪なし。
counterflooding_lets_water_into_one_side.8d3f44 = 逆浸水は、区画の片舷にこの%までしか水を入れません(ゲーム自体の区画の上限も適用されます)。
damage_control_efficiency_while_the_ship.d761c8 = 艦のエンジン(推進器ではなく使用中のEngineモジュール)が使用不能な間のダメージコントロール効率:チームの効率%(火災、浸水、水、船体;システムの修理は影響なし)。チームのヒントとダメージコントロールタブの Forecast 行に表示されます。100 = オフ。
damage_control_teams_in_a_section_with_a.e2dc23 = 火災のある区画で消火していないダメージコントロールチームは、効率のこの%で作業します。100 = オフ。
damage_control_teams_of_a_civilian_ship.630d69 = 排水量による民間船のダメージコントロールチーム:トン=チーム。
damage_control_teams_of_a_submarine_by_d.556a4a = 排水量による潜水艦のダメージコントロールチーム:トン=チーム。
damage_control_teams_of_a_surface_warshi.2960b3 = 排水量による水上戦闘艦のダメージコントロールチーム:トン=チーム、そのトン数以上。艦のiniのNumberOfDCTeamsは引き続き固有の数を指定します。
debug_draws_the_selected_ship_s_hull_onl.f6f266 = デバッグ:選択した艦の船体専用コライダーメッシュ(coll_hull*)を半透明のオーバーレイと実際の三角形の明るいワイヤーフレームで描画し、見えている3Dモデルと直接比較できます。
debug_for_the_ship_currently_selected_in.50880e = デバッグ:ユニット状態パネルで選択した艦について、現在の波から、船体の艦首・艦尾の中心線、およびダメージモデルの区画ごとの左舷/右舷ペア(長さ方向の固有の中心点)の推定甲板高さまで線を描きます - 船体コライダーのみで、砲塔、マスト、その他のサブモデルは対象外。緑:その点は波より上;赤:波がその上にある。
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = デバッグ:選択した艦の3Dモデル(サブモデル含む)の描画方法。ShowDeckCorners/ShowHullColliderが見えるようになります:Show(ゲームと同じ)、Translucent(70%透明)、Hide。
diagnostics_while_a_ship_lists_or_trims.7ab078 = 診断:艦が顕著に傾斜またはトリムしている間、2秒ごとにBepInExログへ傾斜、トリム、高さ、浮力と重量、没水体積、艦内の水、沈没中/転覆かどうかを書き込みます。
diagnostics_writes_every_fire_started_by.c267ad = 診断:被弾で始まったすべての火災と火災の段階変化をBepInExログへ書き込みます(艦、区画、ミッション時間、区画の最大値に対する%での強さと成長、そこのダメージコントロールチーム)。Modsメニューでモッドがオフでも動作し、ゲームと比較できます。
enables_verbose_logging_and_bepinex_alte.5d311f = 詳細なログとBepInEx/AlternativeDamageModel.trace.txtを有効にします。
fire_row_one_arrow_when_the_fire_changes.2c03b0 = 火災の行:火災がこれより速く変化するとき矢印1つ、毎秒最大値の%。
fire_row_two_arrows_down_when_the_fire_i.cfce19 = 火災の行:火災がこれより速く消えるとき下向き矢印2つ、毎秒最大値の%。
fire_row_two_arrows_up_when_the_fire_gro.8de955 = 火災の行:火災がこれより速く成長するとき上向き矢印2つ、毎秒最大値の%。
fixes_an_error_of_the_game_itself_above.638bbb = ゲーム自体のエラーを修正します:時間圧縮10x超では艦のトリムが時間圧縮とともに増大します(47ノットの25 mボート:10xまで2.6度、100xで9度) - 短くて速い無傷の艦を沈めるのに十分です。ゲームは物理ティックごとに1ステップ艦を動かしますが、10x超ではこのステップが引き伸ばされる一方、浮力トルクはステップ前の重心まわりで計算されます。オン:その余分なステップを省き、トリムはどの時間圧縮でも10xと同じに保たれます;10xまでは変化なし。水上艦のみ。オフ:ゲームの動作。
flooding_row_and_flooding_plan_one_arrow.802936 = 浸水の行と浸水計画:水位がこれより速く変化するとき矢印1つ、毎秒区画の%。
flooding_row_and_flooding_plan_two_arrow.129e17 = 浸水の行と浸水計画:水位がこれより速く変化するとき矢印2つ、毎秒区画の%。
four_small_icons_under_a_ship_s_icon_on.001776 = マップ上の艦アイコンの下に4つの小アイコン(自艦も):火災(火災の合計強度)、水、船体(ダメージコントロールパネルの分類)、エンジン;深刻度で黄/橙/赤、艦が沈む見込み(浸水/船体の傾向で20分以内)のときはマップアイコンが灰色がかります。コンタクト:火災、水、船体、エンジンは直接目視のみ;ソナーではエンジンのみ(黄:一部喪失、赤:すべて停止);レーダーでは直近10分に被弾した艦の推定で「?」付き(黄:10ノット以下、赤:3未満);ESMやコンタクトなしでは表示なし、沈没艦も表示なし。ダメージコントロールタブのFires行も同じ合計強度を使います。コンタクトのユニット状態には同じ情報を文章で示すDamage Stateタブが表示されます。
health_of_a_damage_control_team_a_multip.330f74 = ダメージコントロールチームの体力、最大値の倍率で、最大値は艦の排水量により1..100点(100 = 乗員1000以上、約100000 t;1000 t = 10、10000 t = 32)。チームのヒントに満タンに対する割合で表示されます。0のチームは死亡です。負傷したチームは遅く働きます(体力に応じて、25%未満にはならない)。0 = チームは負傷しない(被弾は依然としてチームを区画から外します)。
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = 火災が区画の船体(両方の区画の耐久)を侵食する速さ。1.0 = ゲームと同じ。区画のシステムへのダメージは変わりません。
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = 予備のチームが疲労を取り除く速さ、作業中に蓄積する速さに対する%。100 = 同じ速さ;50 = 休息は作業の2倍かかる。
how_fast_a_team_walks_through_the_ship_m.440ac9 = チームが艦内を歩く速さ、毎分メートル(予備は中央)。移動 = MusterTime + 歩行時間、10秒に切り上げ。0 = 歩行時間なし;MusterTimeも0ならチームは即座に移動し、自動ダメージコントロールはゲームのものです。
how_fast_damage_control_teams_pump_water.daadca = ダメージコントロールチームが排水する速さ。1.0 = ゲームと同じ。
how_fast_damage_control_teams_put_fires.5d5eaf = ダメージコントロールチームが消火する速さ。1.0 = ゲームと同じ。
how_fast_fires_grow_by_themselves_betwee.e757ca = 被弾の合間に火災が自然に成長する速さ。1.0 = ゲームと同じ、2.0 = 2倍、0.5 = 半分。
how_fast_water_comes_in_through_the_hole.cad705 = 区画の穴から水が入る速さ。1.0 = ゲームと同じ。
how_many_times_stronger_the_hull_of_civi.706453 = 民間船(iniファイル civ_*)の船体がゲームの何倍頑丈か。1.0 = ゲームと同じ。
how_many_times_stronger_the_hull_of_subm.d3d1a9 = 潜水艦の船体がゲームの何倍頑丈か。1.0 = ゲームと同じ。
how_many_times_stronger_the_hull_of_surf.32130e = 水上戦闘艦の船体がゲームの何倍頑丈か。1.0 = ゲームと同じ、2.0 = 2倍頑丈。個別の艦は[HullIntegrityPerShip]セクションに艦ごと1行で固有値を持ちます:iniファイル名 = 倍率(例:usn_bb_iowa = 3.0)。
how_much_one_team_gets_done_plugging_fir.8ecb35 = チーム1つがこなす量(浸水の閉塞、消火、排水、船体とシステムの修理)のゲームとの比較。1.0 = ゲームと同じ。
how_strongly_the_list_follows_uneven_flo.541fe4 = 傾斜が不均等な浸水にどれだけ追従するか。区画の左舷と右舷の水の差(艦を傾ける)にこの値を掛けます;区画の平均は保たれるので、喫水とトリムはこれで変わりません。1 = ゲームと同じ、2 = 同じ差で傾斜が2倍。
how_the_ship_s_speed_changes_the_growth.6d2cf6 = 艦の速度が火災の成長と流入する水(穴と甲板縁から)をどう変えるか:ノット=浸水/火災の倍率、点を結ぶ折れ線。速度は絶対値で扱い、最初の点より下と最後の点より上では両端の倍率が適用されます。
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = モッドのテキストの言語:en、ru、cn、de、es、fr、ko、ja、vn。空 = ゲームの言語。テキストはモッドのlangフォルダ(lang/<コード>.ini)にあり、ないテキストは英語で表示されます。
list_degrees_the_full_scale_of_the_list.a220dc = 傾斜、度:LISTゲージの全目盛。赤いゾーン(その75%)から水が甲板縁を越えて低い舷のすべての区画を急速に浸水させます(ゲーム:45)。それ自体では沈みません;70度での転覆はゲーム同様に沈めます。
metres_the_trim_limit_depends_on_the_shi.be80af = メートル。トリム限界は艦の長さに依存します:長いほど同じ角度で艦首や艦尾が早く水没します(tan限界 = tan TrimLimit x (TrimReferenceLength / 長さ)^0.442;100で5.2のとき:30 m 8.8、60 m 6.5、150 m 4.4、300 m 3.2度)。0 = すべての艦にTrimLimit(ゲームと同じ)。
minutes_of_work_in_a_section_until_a_tea.abe7fb = チームが疲れる(第1段階)までの区画での作業時間、分;速度はSpeed設定に従って低下します。予備は作業が蓄積するのと同じ速さで疲労を取ります。チームのヒントに表示され、疲れたチームのアイコンが強調されます。0 = 疲労なし。
minutes_of_work_until_a_team_is_exhauste.461264 = チームが疲弊する(疲労の第2段階)までの作業時間、分(最大:疲労はそこで増えなくなる)。「Tired after」以下 = 第2段階なし。
multiplier_of_the_chance_that_a_hit_woun.6766c6 = 被弾がチームを負傷させる確率の倍率(0.5 = 半分、2 = 2倍;結果は最大100%)。ステップ1(Wounds at any hull integrityがオフの間のみ) - ゲームが被弾でチームが区画から外れるかを決定(耐久50%未満の被弾区画のみ:ダメージ x (1 - 耐久)、最大20%)。ステップ2 - モッドが負傷を決定:確率は弾頭威力(約 威力^1.8)で急上昇し、チーム体力(約 体力^1.2)で低下します - 弾頭2.2 対 体力2:約10%、対100:0.1%;弾頭82 対 100:約75%;それ以上は100%超。この倍率を掛けた後、100%に制限されます(Wounds at any hull integrityがオフでも、負傷しなかったチームは区画を離れます)。強い弾頭は確率を上げ、大きい艦は下げます:チームが頑丈(体力が高い)で区画が大きいので、チームのいる場所に当たりにくくなります。最も弱い被弾にもわずかな確率があります。例、弾頭25:体力12に約100%、29に約37%、100に約9%。0 = 負傷しない。
multiplier_of_the_strength_of_a_wound_at.119bcb = 負傷の強さの倍率:弾薬の弾頭威力(0..196、ゲームの弾薬の半分は25未満) x この値が最大で、チーム体力(排水量により1..100)の点数で表します。負傷したチームは予備へ移動します。
random_spread_of_the_concussion_time_sec.c54f69 = 脳震盪時間のランダムな振れ幅、両方向の秒:HealTime 90で30 = 60~120秒、ゲームと同じ。0 = 常にHealTime。
resistance_to_the_horizontal_movement_of.dc8036 = 破壊された艦の水平移動への抵抗、ゲームの線形抵抗(ほぼすべての艦で25)に対する倍率:残骸は早く行き足を失います。1 = ゲームと同じ。沈下(垂直移動)と回転(転覆)は遅くなりません。
seconds_game_time_so_time_compression_co.551b95 = 甲板から水が入り始める前に、区画の甲板ポイントが連続して海面下にいなければならない秒数(ゲーム時間、時間圧縮を反映;DeckFloodingSpeed参照)。浮上した点はタイマーをリセットします。既定 3。
seconds_a_team_needs_to_get_ready_before.3b6e27 = チームが移動ごとに準備に必要な秒数。準備中に移動をキャンセルしても時間はかかりません。
settings_profile_in_use_chosen_in_the_ga.331d79 = 使用中の設定プロファイル、ゲームで選択:ユニット状態 -> ダメージコントロール -> (i)の隣の歯車。このファイルには一般設定([General]、[UI])のみがあり、ダメージモデルの値はプロファイルのファイルにあります:内蔵のものはモッドのProfilesフォルダ(読み取り専用)、自作のものはStreamingAssets/user/AlternativeDamageControl/Profiles。ゲームで内蔵プロファイルを変更するとCustomとして保存されます。使用中のプロファイルのファイルやこの名前の編集はゲーム実行中に反映されます。
ships_ini_file_names_comma_separated_edi.c5b815 = Deck Pointsを持たない艦(iniファイル名、カンマ区切り;設定ウィンドウのFloodingタブで編集):船体コライダーのない艦のように、古い簡易ルールで浸水します。
team_fatigue_on_working_builds_it_up_the.e170b3 = チーム疲労オン:作業で蓄積し、予備で解消し、疲れたチームは半分の速度で働きます。オフ = 疲労なし;関連設定は非表示。
team_health_on_wounds_from_hits_and_fire.0440b7 = チーム体力オン:被弾と火災による負傷、予備での回復、負傷したチームは遅く働きます。オフ = ゲームのルール(被弾でチームがしばらく戦列を離れる、負傷なし);他の体力設定は非表示。
the_detailed_view_of_unit_status_damage.b04888 = ユニット状態 -> ダメージコントロールの詳細ビュー(モッドの表示):各区画名の横に舷ごとの船体耐久、ダメージコントロールチームごとのアイコン(任務;自動ダメージコントロールオフ時は手動の任務と移動)、傾向矢印付きの水と火災の%、DC Priority、チームカード、浸水計画付きのLIST / TRIM / LEVELゲージ、ツールチップ、凡例(i)。オフ:ゲーム自身のビュー(設定ウィンドウの歯車は残ります)。
the_mod_s_damage_model_and_damage_contro.b3b07a = モッドのダメージモデルとダメージコントロール:船体とシステムの強度、副次効果、火災と浸水の速度、延焼、ダメージコントロールチーム(数、効率、徒歩移動、戦列離脱、最適化された自動ダメージコントロール、個別チームの移動)、傾斜 / トリム / 沈没の限界。DC Priorityと手動の任務は詳細ビューに属し残ります。オフ:ゲーム自身のダメージとダメージコントロール(ダメージコントロールタブのビューは残ります)。いつでも切り替え可能:海上の艦は即座に追従します(船体強度とチーム数はゲームまたはモッドの値に戻り、移動中のチームは到着し、戦列離脱したチームは回復)。
the_teams_rest_in_the_central_compartmen.4ac676 = チームは中央区画で休みます:そこへの被弾は予備で待機中のチームを負傷させる場合があります(確率は被弾区画で戦列を離れたチームに対するゲームのもの:ダメージ x (1 - 耐久)、耐久50%未満のみ)。負傷した休息中のチームは予備に残ります。
trim_degrees_for_a_ship_trimreferencelen.8ab413 = トリム、度、長さTrimReferenceLengthの艦について:TRIMゲージの全目盛。赤いゾーン(その75%)から、沈む側の端が急速に浸水します:各舷で最も外側の区画、それが満水なら次、という順に。ゲーム(浸水区画1つで8度)と違い、艦はすぐには沈みません。
unattended_fire_how_much_the_growth_rate.84fa6e = 放置された火災:火災チェックごとに成長率がどれだけ上がるか、火災の最大成長率の%(通常の被弾は0.1-0.8%を加える)。
unattended_fire_its_growth_rate_is_raise.b4969b = 放置された火災:成長率はこの値までしか上がりません、毎秒火災最大値の%。
unattended_fire_seconds_without_a_team_f.098d15 = 放置された火災:チームが消火していない秒数(開始時、またはチームが最後に消火した時から)、これを超えるとより速く成長し始めます。
vulnerability_of_the_hull_to_flooding_th.35677a = 被弾でできた穴からの浸水に対する船体の脆弱性(全武器種)。1.0 = 穴ごとにゲームと同じ量の水が入り、喫水線より上の穴もゲームと同じダメージで漏れ始めます(頑丈な船体でも水は止まりません)。2.0 = 水が2倍;0.5 = 半分。
vulnerability_of_the_hull_to_gun_shells.c70d65 = 砲弾に対する船体の脆弱性(ミサイル、魚雷、爆弾は対象外)。砲弾は船体の大きさに依存する艦の沈没限界の一部を奪います。1.0 = 砲弾ごとにゲームと同じ;頑丈な船体はより多くの被弾に耐えるだけです。2.0 = 船体が半分の大きさのように被弾;0.5 = 2倍の大きさのように(中口径弾が大型艦に効かなくなる場合あり)。
vulnerability_of_the_ship_to_fires_start.50481c = 被弾で始まる火災に対する艦の脆弱性(全武器種)。頑丈な船体は同じ比率で火災も抑えます:Warships = 5.0なら、被弾はゲームより(区画比で)5倍弱い火災を起こします。1.0 = モッドのこの通常の動作。2.0 = 火災が2倍強く2倍速く成長;0.5 = 半分の強さ。すべての船体倍率が1.0で1.0 = ゲームと同じ。
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = 区画の水はその火災を制限します:最大値の(100 - 区画の水%)より強くなれません。それより強い火災は毎秒最大値のこの%でその上限まで下がります。0 = オフ。
water_in_the_whole_ship_the_average_of_i.a5b547 = 艦全体の水の%(区画の平均)、これを超えると沈没、ゲームと同じ(ゲーム:40;潜水艦はゲームの50を維持)。LEVELゲージの全目盛でもあります。
water_over_the_deck_edge_a_multiplier_fo.512690 = 甲板縁越しの水、倍率。甲板ポイントが判明している艦(完全な船体コライダーアルゴリズム):区画の甲板ポイントがDeckFloodingDelay秒連続して海面下にあると(ゲーム時間、時間圧縮を反映)、区画はダメージコントロールで止められない水を受けます - 1.0 = 没水1メートルあたり毎秒容積の0.1%(深いほど速い);満水の区画は最も低い位置の満水でない隣へ水を渡し、鎖に沿って続きます。その他の艦:沈む側の端(トリムが限界超過)または低い舷(傾斜が限界超過)が甲板縁越しに水を受ける速さ - ゲームにないモッド独自の仕組み。2.0 = 2倍速、0.5 = 半分、0 = オフ。
when_a_ship_starts_to_sink_the_game_puts.562c7b = 艦が沈み始めると、ゲームは重心を船体の原点((0, 1, 0)、転覆時)に移します:重心が飛び、船体にかかるすべてのトルクも変わります。オン = 重心は元の位置に留まる。オフ = ゲームと同じ。
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = チームが区画の穴を塞いでいる間(Flooding Rate任務)、同時にそこから排水します:排水速度のこの割合(0.5 = 半分、0 = オフ)。逆浸水を命じられたチームは、傾斜とトリムを悪化させない舷からのみ排水します。
work_speed_of_a_rested_team_the_starting.1e64b0 = 休息したチームの作業速度、%(疲労曲線の開始点)。速度はここから「疲れた」段階まで直線的に低下します。
work_speed_of_a_team_that_has_just_becom.425925 = 疲れたばかりのチームの作業速度、%。「疲れた」と「疲弊」の間で速度は直線的に低下します。
work_speed_of_an_exhausted_team_it_stays.4cfc9a = 疲弊したチームの作業速度、%;チームが働き続ける間そのままです。
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = ミッションに入る艦ごとにBepInExログへ1行書き込みます:ゲームとモッドでの船体耐久。
