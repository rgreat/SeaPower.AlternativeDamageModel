damage_to_the_hull_from_a_collision_with.efa04c = 他の艦船との衝突による船体ダメージ（ゲームにはなく、艦船は互いに押し合うだけです）。衝突は一撃ではありません。体当たりした艦首は相手の艦に乗り上げ、その上を滑ることがあります。ダメージは、艦船が接触している間に物理演算がステップごとに消費するエネルギーです（衝撃、押し合い、擦れ。ただ他の艦に乗っているだけの艦は何も失いません）。各艦は質量で決まる割合を負担します。速度の二乗に (m_other / (m_self + m_other))^2 を掛け、自艦の排水量1トンあたりで計算します。1.0 = 同じ大きさの2隻が19ノットで衝突すると、それぞれ約1.25区画が破壊されます。小型ボートが大型艦に衝突すると、ボートは大破し、大型艦はかすり傷程度です。ダメージはその瞬間に艦が接している区画（接触点の位置と舷）に与えられ、被弾と同様に、受けたダメージとともに大きくなる浸水が発生します（喫水線より上の接触は、半ば破壊された区画からのみ浸水します）。0 = オフ。
