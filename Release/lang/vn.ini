; key = text   (\n = line break; keep {0} {1} ...)
; Machine translation, not checked by a native speaker: corrections are welcome.

a_burning_section_opens_its_plugged_leak.20b488 = Một khu vực đang cháy mở lại các chỗ rò đã bịt: % của chỗ rò lớn nhất của khu vực mỗi giây khi đám cháy 100% (ít hơn với đám cháy nhỏ hơn). 0 = tắt.
a_fire_does_not_spread_into_a_compartmen.6e664b = Đám cháy không lan vào khoang có đội kiểm soát thiệt hại (đội chặn lửa ở cửa). Tắt = như trong game.
a_fire_no_damage_control_team_has_fought.5e3fa0 = Đám cháy mà không đội kiểm soát thiệt hại nào chữa trong một lúc sẽ lớn ngày càng nhanh: mỗi lần kiểm tra cháy (FireCheckTime, 10 giây) tốc độ phát triển của nó tăng như thể khu vực bị bắn trúng lần nữa. Tắt = như trong game (đám cháy chỉ lớn lên do bị bắn trúng).
a_fully_flooded_section_water_above_75_i.aaedbd = Khu vực ngập hoàn toàn (nước trên 75%): các hệ thống của nó bị hư hỏng nặng, mất khả năng hoạt động và không thể sửa chữa khi còn ngập.
a_hit_on_a_compartment_that_is_already_d.364c92 = Một phát trúng vào khoang đã bị phá hủy không bị mất: một nửa sát thương chuyển sang khoang bên cạnh (cùng mạn, về phía giữa tàu); nếu khoang đó cũng bị phá hủy, một phần tư chuyển sang khoang kế tiếp. Phần dư của phát trúng phá hủy khoang cũng lan theo cách đó.
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = Phát trúng vào khu vực có thể làm bị thương các đội ở mọi độ nguyên vẹn. Tắt = như trong game: chỉ khu vực bị trúng có độ nguyên vẹn dưới 50% mới có thể loại một đội khỏi vị trí, với xác suất sát thương x (1 - độ nguyên vẹn), tối đa 20%. Bật = mọi phát trúng vào khu vực có đội đều được tung xúc xắc bị thương (xem Wound chance); đội bị thương đi về lực lượng dự bị.
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = Chỗ rò được lửa mở lại sẽ lớn trở lại tới % này của chỗ rò lớn nhất mà khu vực từng có.
a_section_under_the_sea_puts_its_fire_ou.45fb26 = Khu vực dưới mặt biển dập tắt đám cháy của nó: lửa mất % này của mức tối đa mỗi giây cho mỗi mét mép boong của khu vực nằm dưới nước (1 = số % mỗi giây bằng số mét). Cần các điểm boong của tàu (như ngập qua boong). 0 = tắt.
a_team_cannot_plug_holes_while_the_ship.f5f08f = Đội không thể bịt lỗ khi tàu chạy nhanh hơn mức này, tính bằng hải lý/giờ. 0 = không giới hạn.
a_team_in_a_burning_section_loses_this_m.ecb388 = Một đội trong khu vực đang cháy mất lượng này của máu đầy mỗi giây khi cháy 100%, trừ khi có ít nhất một đội của khu vực đang chữa cháy (ít hơn với đám cháy thấp hơn).
a_team_in_the_reserve_recovers_this_much.2dd530 = Một đội trong lực lượng dự bị hồi phục lượng này của máu đầy mỗi giây.
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = Tàu AI (không phải của người chơi) ngắn hơn 50 m không chậm đi vì ngập: mức giảm tốc độ của game do lỗ thủng và nước bị tắt với chúng (chúng tiếp tục chạy, như kamikaze). Nút "Limit Speed" của tàu bạn là riêng biệt.
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = Xác suất đám cháy nặng (từ 50% mức tối đa) lan sang các khu vực kế bên, tính bằng % mỗi lần kiểm tra cháy: game kiểm tra mỗi FireCheckTime (10 giây) với xác suất 0,0133% - hầu như không bao giờ. 0.0133 = như trong game; 1.0 = 1% mỗi lần kiểm tra (khoảng một lần mỗi 17 phút cháy nặng), 0 = không bao giờ.
colours_the_weapon_buttons_of_the_select.a41d7b = Tô màu các nút vũ khí ở bảng dưới của đơn vị đang chọn theo trạng thái hệ thống vũ khí: tất cả hoạt động - màu của game, một phần loại đó mất khả năng hoạt động - vàng, tất cả mất khả năng hoạt động - đỏ.
concussion_a_team_wounded_by_a_weapon_a.2d37ab = Chấn động: đội bị vũ khí làm bị thương (ở khu vực bị trúng hoặc ở lực lượng dự bị) bị choáng trong chừng này giây sau khi vào lực lượng dự bị; Auto DC không cho nó quay lại làm việc cho đến khi hết choáng. Nó chạy song song với máu của đội, vốn có hồi phục riêng. 0 = không chấn động.
counterflooding_a_team_s_task_given_by_h.9424ff = Làm ngập đối trọng (nhiệm vụ giao tay cho đội): tốc độ cho nước vào khoang, bằng bội số tốc độ bơm ra. Nước vào mạn đối diện với phía nghiêng, hoặc vào mạn có ít nước hơn khi tàu thẳng.
counterflooding_lets_water_into_one_side.8d3f44 = Làm ngập đối trọng chỉ cho nước vào một mạn của khoang tới % này (giới hạn riêng của khoang trong game vẫn có hiệu lực).
damage_control_efficiency_while_the_ship.d761c8 = Hiệu quả kiểm soát thiệt hại khi động cơ của tàu (mô-đun Engine đang dùng, không phải chân vịt) hỏng: hiệu quả của các đội theo % (cháy, rò, nước, thân tàu; sửa hệ thống không bị ảnh hưởng). Hiển thị trong gợi ý của đội và ở dòng Forecast của thẻ Damage Control. 100 = tắt.
damage_control_teams_in_a_section_with_a.e2dc23 = Các đội kiểm soát thiệt hại trong khu vực có cháy mà không chữa cháy làm việc ở % này hiệu quả của họ. 100 = tắt.
damage_control_teams_of_a_civilian_ship.630d69 = Các đội kiểm soát thiệt hại của tàu dân sự theo lượng giãn nước: tấn=đội.
damage_control_teams_of_a_submarine_by_d.556a4a = Các đội kiểm soát thiệt hại của tàu ngầm theo lượng giãn nước: tấn=đội.
damage_control_teams_of_a_surface_warshi.2960b3 = Các đội kiểm soát thiệt hại của tàu chiến mặt nước theo lượng giãn nước: tấn=đội, từ số tấn đó trở lên. NumberOfDCTeams trong ini của tàu vẫn đặt số riêng của nó.
debug_draws_the_selected_ship_s_hull_onl.f6f266 = Gỡ lỗi: vẽ các lưới collider chỉ có thân tàu (coll_hull*) của tàu đang chọn thành lớp phủ mờ cùng khung dây sáng của các tam giác thực của chúng, để so sánh trực tiếp với mô hình 3D nhìn thấy.
debug_for_the_ship_currently_selected_in.50880e = Gỡ lỗi: với tàu đang chọn trong bảng Unit Status, vẽ một đường từ con sóng hiện tại tới chiều cao boong ước tính ở đường tâm mũi và đuôi thân tàu, và ở một cặp mạn trái/phải cho mỗi khu vực của mô hình hư hại (điểm giữa riêng theo chiều dài) - chỉ collider thân tàu, không phải tháp pháo, cột buồm hay mô hình con khác. Xanh: điểm cao hơn sóng; đỏ: sóng ở trên nó.
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = Gỡ lỗi: cách vẽ mô hình 3D của tàu đang chọn (cả mô hình con), để có thể thấy ShowDeckCorners/ShowHullCollider: Show (như game), Translucent (trong suốt 70%) hoặc Hide.
diagnostics_while_a_ship_lists_or_trims.7ab078 = Chẩn đoán: khi tàu nghiêng hoặc chúi rõ rệt, ghi vào log BepInEx mỗi 2 giây: nghiêng, chúi, độ cao, lực nổi so với trọng lượng, thể tích chìm, nước trong tàu và tàu có đang chìm / lật không.
diagnostics_writes_every_fire_started_by.c267ad = Chẩn đoán: ghi vào log BepInEx mọi đám cháy do phát trúng gây ra và mọi thay đổi giai đoạn của đám cháy (tàu, khoang, thời gian nhiệm vụ, mức độ và tăng trưởng theo % của mức tối đa của khoang, các đội kiểm soát thiệt hại ở đó). Hoạt động cả khi mod bị tắt trong menu Mods, để so sánh với game.
do_not_draw_in_the_3d_view_the_targets_o.f88a4e = Không vẽ trong chế độ xem 3D các mục tiêu của phe khác không được quan sát bằng mắt (chỉ biết qua radar, sonar hoặc dữ liệu). Đơn vị của bạn luôn được vẽ.
enables_verbose_logging_and_bepinex_alte.5d311f = Bật ghi log chi tiết và BepInEx/AlternativeDamageModel.trace.txt.
fire_looks_by_the_fire_s_strength_share.296366 = Đám cháy trông theo cường độ của nó (phần của mức tối đa) thay vì các giai đoạn của game: nhỏ, vừa từ SmokeModerateFrom, nặng từ SmokeSevereFrom (game: 25% / 50%); khói của đám cháy nhỏ tăng từ SmokeStartOpacity đến SmokeEndOpacity. Chỉ là giao diện - sát thương và sự lan vẫn là của game. Tắt = như trong game.
fire_row_one_arrow_when_the_fire_changes.2c03b0 = Dòng cháy: một mũi tên khi đám cháy thay đổi nhanh hơn mức này, tính bằng % mức tối đa của nó mỗi giây.
fire_row_two_arrows_down_when_the_fire_i.cfce19 = Dòng cháy: hai mũi tên xuống khi đám cháy được dập nhanh hơn mức này, tính bằng % mức tối đa của nó mỗi giây.
fire_row_two_arrows_up_when_the_fire_gro.8de955 = Dòng cháy: hai mũi tên lên khi đám cháy lớn nhanh hơn mức này, tính bằng % mức tối đa của nó mỗi giây.
fixes_an_error_of_the_game_itself_above.638bbb = Sửa một lỗi của chính game: trên 10x nén thời gian, độ chúi của tàu tăng theo nén thời gian (xuồng 25 m ở 47 hải lý/giờ: 2,6 độ tới 10x, 9 ở 100x) - đủ để làm chìm một tàu ngắn, nhanh, nguyên vẹn. Game di chuyển tàu một bước mỗi tick vật lý, và trên 10x bước đó bị kéo dài trong khi mô-men lực nổi vẫn lấy quanh khối tâm từ trước bước. Bật: bước dư đó bị bỏ, nên độ chúi giữ như ở 10x với mọi mức nén thời gian; tới 10x không có gì thay đổi. Chỉ tàu mặt nước. Tắt: hành vi của game.
flooding_row_and_flooding_plan_one_arrow.802936 = Dòng ngập và kế hoạch ngập: một mũi tên khi mực nước thay đổi nhanh hơn mức này, tính bằng % của khoang mỗi giây.
flooding_row_and_flooding_plan_two_arrow.129e17 = Dòng ngập và kế hoạch ngập: hai mũi tên khi mực nước thay đổi nhanh hơn mức này, tính bằng % của khoang mỗi giây.
four_small_icons_under_a_ship_s_icon_on.001776 = Bốn biểu tượng nhỏ dưới biểu tượng tàu trên bản đồ (cả của bạn): lửa (tổng cường độ các đám cháy), nước, thân tàu (phân loại như bảng Damage Control) và động cơ; vàng / cam / đỏ theo mức nghiêm trọng, và biểu tượng bản đồ xám hơn khi tàu sắp chìm (trong 20 phút theo xu hướng ngập / thân tàu). Một mục tiêu liên lạc: lửa, nước, thân tàu và động cơ chỉ khi nhìn trực tiếp; qua sonar - chỉ động cơ (vàng: mất một phần, đỏ: không cái nào hoạt động); qua radar - ước đoán cho tàu bị trúng trong 10 phút qua, đánh dấu '?' (vàng: 10 hải lý/giờ trở xuống, đỏ: dưới 3); không có gì qua ESM hoặc khi không có liên lạc, và không có gì cho tàu đã chìm. Dòng Fires của thẻ Damage Control dùng cùng tổng cường độ. Unit Status của mục tiêu liên lạc hiển thị thẻ Damage State với cùng thông tin bằng chữ.
health_of_a_damage_control_team_a_multip.330f74 = Máu của một đội kiểm soát thiệt hại, hệ số của mức tối đa, vốn là 1..100 điểm theo lượng giãn nước của tàu (100 = thủy thủ đoàn 1000 người trở lên, khoảng 30000 t; 1000 t = 24, 10000 t = 101). Hiển thị trong gợi ý của đội dưới dạng phần của đầy. Đội ở 0 là đã chết. Đội bị thương làm việc chậm hơn (theo máu của họ, không dưới 25%). 0 = đội không bao giờ bị thương (một phát trúng vẫn loại đội khỏi khu vực).
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = Tốc độ lửa ăn mòn thân tàu của khu vực (độ nguyên vẹn của cả hai khoang). 1.0 = như trong game. Sát thương lên hệ thống trong khu vực không đổi.
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = Tốc độ đội trong lực lượng dự bị hết mệt, % tốc độ mệt tích lũy khi làm việc. 100 = nhanh bằng; 50 = nghỉ lâu gấp đôi làm việc.
how_fast_a_team_walks_through_the_ship_m.440ac9 = Tốc độ đội đi bộ trong tàu, mét mỗi phút (lực lượng dự bị ở giữa). Một lần chuyển = MusterTime + thời gian đi, làm tròn tới 10 giây. 0 = không có thời gian đi; khi MusterTime cũng 0, các đội di chuyển ngay và Auto DC là của game.
how_fast_damage_control_teams_pump_water.daadca = Tốc độ các đội kiểm soát thiệt hại bơm nước ra. 1.0 = như trong game.
how_fast_damage_control_teams_put_fires.5d5eaf = Tốc độ các đội kiểm soát thiệt hại dập lửa. 1.0 = như trong game.
how_fast_fires_grow_by_themselves_betwee.e757ca = Tốc độ các đám cháy tự lớn, giữa các phát trúng. 1.0 = như trong game, 2.0 = nhanh gấp đôi, 0.5 = chậm một nửa.
how_fast_water_comes_in_through_the_hole.cad705 = Tốc độ nước vào qua các lỗ của khoang. 1.0 = như trong game.
how_many_times_stronger_the_hull_of_civi.706453 = Thân tàu dân sự (tệp ini civ_*) chắc gấp bao nhiêu lần so với trong game. 1.0 = như trong game.
how_many_times_stronger_the_hull_of_subm.d3d1a9 = Thân tàu ngầm chắc gấp bao nhiêu lần so với trong game. 1.0 = như trong game.
how_many_times_stronger_the_hull_of_surf.32130e = Thân tàu chiến mặt nước chắc gấp bao nhiêu lần so với trong game. 1.0 = như trong game, 2.0 = chắc gấp đôi. Từng tàu riêng được giá trị riêng trong mục [HullIntegrityPerShip], mỗi tàu một dòng: tên tệp ini = hệ số (ví dụ usn_bb_iowa = 3.0).
how_much_one_team_gets_done_plugging_fir.8ecb35 = Một đội làm được bao nhiêu (bịt lỗ, chữa cháy, bơm nước, sửa thân tàu và hệ thống) so với game. 1.0 = như trong game.
how_strongly_the_list_follows_uneven_flo.541fe4 = Độ nghiêng theo ngập không đều mạnh đến đâu. Chênh lệch nước giữa mạn trái và mạn phải của một khu vực (làm tàu nghiêng) được nhân với giá trị này; trung bình của khu vực được giữ, nên mớn nước và độ chúi không đổi vì nó. 1 = như trong game, 2 = độ nghiêng gấp đôi với cùng chênh lệch.
how_the_ship_s_speed_changes_the_growth.6d2cf6 = Tốc độ tàu thay đổi sự lớn lên của đám cháy và nước vào (qua lỗ và qua mép boong) như thế nào: hải lý/giờ=hệ số ngập/cháy, một đường gấp khúc qua các điểm. Tốc độ lấy theo giá trị tuyệt đối; dưới điểm đầu và trên điểm cuối thì dùng hệ số ở hai đầu.
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = Ngôn ngữ của văn bản mod: en, ru, cn, de, es, fr, ko, ja hoặc vn. Trống = ngôn ngữ của game. Văn bản nằm trong thư mục lang của mod (lang/<mã>.ini); văn bản thiếu được hiển thị bằng tiếng Anh.
list_degrees_the_full_scale_of_the_list.a220dc = Nghiêng, độ: toàn thang của đồng hồ LIST. Từ vùng đỏ của nó (75%) nước tràn qua mép boong và nhanh chóng làm ngập mọi khoang ở mạn thấp (game: ở 45). Bản thân nó không làm chìm tàu; lật ở 70 độ thì có, như trong game.
metres_the_trim_limit_depends_on_the_shi.be80af = Mét. Giới hạn chúi phụ thuộc chiều dài tàu: tàu càng dài, mũi hoặc đuôi càng sớm chìm với cùng góc (tan giới hạn = tan TrimLimit x (TrimReferenceLength / chiều dài)^0.442; với 5.2 ở 100: 30 m 8.8, 60 m 6.5, 150 m 4.4, 300 m 3.2 độ). 0 = TrimLimit cho mọi tàu (như trong game).
minutes_game_time_so_time_compression_co.f7d751 = Số phút (thời gian game, nén thời gian được tính) sau khi tàu bắt đầu chìm, khi hiệu ứng bong bóng chìm ngừng phát (game không bao giờ dừng nó khi xác tàu còn tồn tại). Tiết kiệm tài nguyên trong nhiệm vụ dài. 0 = không bao giờ, như trong game.
minutes_of_work_in_a_section_until_a_tea.abe7fb = Số phút làm việc trong khu vực cho đến khi đội mệt (mức đầu); tốc độ của nó giảm theo các thiết lập Speed. Lực lượng dự bị xóa mệt nhanh bằng lúc công việc tích lũy. Hiển thị trong gợi ý của đội; biểu tượng của đội mệt được làm nổi bật. 0 = không mệt.
minutes_of_work_until_a_team_is_exhauste.461264 = Số phút làm việc cho đến khi đội kiệt sức, mức mệt thứ hai (tối đa: mệt không tăng thêm ở đó). Không trên 'Tired after' = không có mức thứ hai.
multiplier_of_the_chance_that_a_hit_woun.6766c6 = Hệ số của xác suất một phát trúng làm bị thương đội (0.5 = một nửa khả năng, 2 = gấp đôi; kết quả tối đa 100%). Bước 1 (chỉ khi Wounds at any hull integrity tắt) - game quyết định liệu một phát trúng có loại đội khỏi khu vực không (chỉ khu vực bị trúng có độ nguyên vẹn dưới 50%: sát thương x (1 - độ nguyên vẹn), tối đa 20%). Bước 2 - mod quyết định vết thương: xác suất tăng dốc theo sức mạnh đầu đạn (khoảng sức mạnh^1.8) và giảm theo máu của đội (khoảng máu^1.2) - đầu đạn 2.2 so với máu 2: khoảng 10%, so với 100: 0,1%; đầu đạn 82 so với 100: khoảng 75%; cao hơn nhiều thì trên 100%. Nó được nhân với hệ số này rồi giới hạn ở 100% (khi Wounds at any hull integrity tắt, đội không bị thương vẫn rời khu vực). Đầu đạn mạnh hơn làm tăng xác suất. Tàu lớn hơn làm giảm: đội của nó bền hơn (nhiều máu hơn) và khoang lớn hơn, nên phát trúng ít khả năng rơi đúng chỗ đội đứng. Ngay cả phát trúng yếu nhất cũng có xác suất nhỏ. Ví dụ, đầu đạn 25: so với máu 12 khoảng 100%, so với 29 khoảng 37%, so với 100 khoảng 9%. 0 = không bao giờ bị thương.
multiplier_of_the_strength_of_a_wound_at.119bcb = Hệ số sức mạnh vết thương: tối đa là sức mạnh đầu đạn của đạn dược (0..196, một nửa đạn dược của game dưới 25) x giá trị này, tính bằng điểm máu của đội (1..100 theo lượng giãn nước). Đội bị thương đi về lực lượng dự bị.
number_of_fire_and_smoke_points_by_ship.4fd67c = Số điểm lửa và khói theo chiều dài tàu thay cho ba điểm của game: dưới 25 m 1, dưới 50 m 2, dưới 75 m 3, từ 75 m 5 (một điểm mỗi khu vực, mỗi điểm hiển thị đám cháy của khu vực mình). Áp dụng cho tàu xuất hiện từ bây giờ.
random_spread_of_the_concussion_time_sec.c54f69 = Độ lệch ngẫu nhiên của thời gian chấn động, giây mỗi chiều: HealTime 90 với 30 = 60 đến 120 giây, như trong game. 0 = luôn HealTime.
resistance_to_the_horizontal_movement_of.dc8036 = Lực cản đối với chuyển động NGANG của tàu bị phá hủy, nhân với lực cản tuyến tính của game (25 cho gần như mọi tàu): xác tàu mất đà sớm hơn. 1 = như trong game. Chìm (chuyển động dọc) và quay (lật) không bị làm chậm.
seconds_game_time_so_time_compression_co.551b95 = Số giây (thời gian game, nén thời gian được tính) điểm boong của khoang phải liên tục nằm dưới biển trước khi nước bắt đầu tràn qua boong (xem DeckFloodingSpeed). Điểm nổi lên sẽ đặt lại bộ đếm. Mặc định 3.
seconds_a_team_needs_to_get_ready_before.3b6e27 = Số giây một đội cần để sẵn sàng trước mỗi lần chuyển. Hủy một lần chuyển khi đội còn đang chuẩn bị không tốn thời gian.
settings_profile_in_use_chosen_in_the_ga.1bca98 = Hồ sơ thiết lập đang dùng, chọn trong game: Unit Status -> Damage Control -> bánh răng cạnh (i). Tệp này chỉ chứa các thiết lập chung ([General], [UI]); giá trị của mô hình hư hại nằm trong tệp của hồ sơ: hồ sơ dựng sẵn ở thư mục Profiles của mod (chỉ đọc), hồ sơ của bạn ở StreamingAssets/user/AdvancedDamageControl/Profiles. Thay đổi hồ sơ dựng sẵn trong game sẽ lưu nó thành Custom. Chỉnh sửa tệp của hồ sơ đang dùng, hoặc tên này, được nhận khi game đang chạy.
ships_ini_file_names_comma_separated_edi.c5b815 = Các tàu (tên tệp ini, cách nhau dấu phẩy; chỉnh trong cửa sổ thiết lập, thẻ Flooding) không có Deck Points: chúng ngập theo quy tắc cũ, đơn giản hơn, như tàu không có collider thân tàu.
small_fire_smoke_opacity_of_new_particle.16bc8d = Đám cháy nhỏ: độ mờ khói của hạt mới ở 0% mức tối đa của đám cháy, % của game.
small_fire_smoke_opacity_of_new_particle.75284c = Đám cháy nhỏ: độ mờ khói của hạt mới tại SmokeModerateFrom, % của game; ở giữa - đều theo cường độ đám cháy.
team_fatigue_on_working_builds_it_up_the.e170b3 = Mệt của đội bật: làm việc tích lũy nó, lực lượng dự bị xóa nó, đội mệt làm việc với nửa tốc độ. Tắt = không mệt; các thiết lập của nó bị ẩn.
team_health_on_wounds_from_hits_and_fire.0440b7 = Máu của đội bật: vết thương từ phát trúng và đám cháy, hồi phục trong lực lượng dự bị, đội bị thương làm việc chậm hơn. Tắt = quy tắc của game (một phát trúng loại đội một lúc, không có vết thương); các thiết lập máu khác bị ẩn.
the_detailed_view_of_unit_status_damage.b04888 = Chế độ xem chi tiết của Unit Status -> Damage Control (hiển thị của mod): độ nguyên vẹn thân tàu theo mạn cạnh tên mỗi khu vực, một biểu tượng cho mỗi đội kiểm soát thiệt hại (nhiệm vụ của nó; nhiệm vụ và di chuyển bằng tay khi Auto DC tắt), nước và lửa theo % với mũi tên xu hướng, DC Priority, thẻ đội, các đồng hồ LIST / TRIM / LEVEL với kế hoạch ngập, gợi ý, chú giải (i). Tắt: chế độ xem riêng của game (bánh răng của cửa sổ thiết lập vẫn còn).
the_mod_s_damage_model_and_damage_contro.b3b07a = Mô hình hư hại và kiểm soát thiệt hại của mod: độ bền thân tàu và hệ thống, hiệu ứng phụ, tốc độ cháy và ngập, sự lan lửa, các đội kiểm soát thiệt hại (số lượng, hiệu quả, chuyển bằng đi bộ, mất khả năng chiến đấu, Auto DC tối ưu, di chuyển từng đội), giới hạn nghiêng / chúi / chìm. DC Priority và nhiệm vụ giao tay thuộc chế độ xem chi tiết và vẫn còn. Tắt: hư hại và kiểm soát thiệt hại riêng của game (chế độ xem thẻ Damage Control vẫn còn). Có thể chuyển bất cứ lúc nào: tàu ngoài biển theo ngay (độ bền thân tàu và số đội trở lại của game hoặc của mod; đội đang di chuyển đến nơi, đội bị loại hồi phục).
the_moderate_fire_s_look_from_this_stren.5ec64a = Giao diện đám cháy vừa từ cường độ này, % mức tối đa của đám cháy (game: 25%).
the_severe_fire_s_look_from_this_strengt.79bf05 = Giao diện đám cháy nặng từ cường độ này, % mức tối đa của đám cháy (game: 50%).
the_teams_rest_in_the_central_compartmen.4ac676 = Các đội nghỉ ở khoang trung tâm: một phát trúng vào đó có thể làm bị thương đội đang chờ trong lực lượng dự bị (xác suất là của game cho đội bị loại ở khu vực bị trúng: sát thương x (1 - độ nguyên vẹn), chỉ khi độ nguyên vẹn dưới 50%). Đội nghỉ bị thương vẫn ở lực lượng dự bị.
trim_degrees_for_a_ship_trimreferencelen.8ab413 = Chúi, độ, cho tàu dài TrimReferenceLength: toàn thang của đồng hồ TRIM. Từ vùng đỏ của nó (75%) đầu đang chìm xuống ngập nhanh: ở mỗi mạn khoang ngoài cùng, khi nó đầy thì khoang kế, và cứ thế. Tàu không chìm ngay, khác với game (8 độ với một khu vực ngập).
unattended_fire_how_much_the_growth_rate.84fa6e = Đám cháy không ai trông: tốc độ phát triển tăng bao nhiêu mỗi lần kiểm tra cháy, % tốc độ phát triển tối đa của đám cháy (một phát trúng thường thêm 0,1-0,8%).
unattended_fire_its_growth_rate_is_raise.b4969b = Đám cháy không ai trông: tốc độ phát triển của nó chỉ được nâng tới mức này, % mức tối đa của đám cháy mỗi giây.
unattended_fire_seconds_without_a_team_f.098d15 = Đám cháy không ai trông: số giây không có đội chữa cháy (từ lúc nó bắt đầu, hoặc lần cuối một đội chữa) trước khi nó bắt đầu lớn nhanh hơn.
vulnerability_of_the_hull_to_flooding_th.35677a = Mức dễ tổn thương của thân tàu với ngập qua các lỗ do phát trúng tạo ra (mọi loại vũ khí). 1.0 = mỗi lỗ cho vào lượng nước như trong game, và các lỗ trên mực nước bắt đầu rò sau cùng sát thương như trong game (thân tàu chắc hơn không cản được nước). 2.0 = nước gấp đôi; 0.5 = một nửa.
vulnerability_of_the_hull_to_gun_shells.c70d65 = Mức dễ tổn thương của thân tàu với đạn pháo (tên lửa, ngư lôi và bom không bị ảnh hưởng). Đạn pháo lấy một phần giới hạn chìm của tàu tùy kích thước thân tàu. 1.0 = mỗi viên lấy như trong game; thân tàu chắc hơn chỉ chịu được nhiều phát trúng hơn. 2.0 = đạn trúng như thể thân tàu nhỏ một nửa; 0.5 = như thể lớn gấp đôi (đạn cỡ vừa có thể không còn làm hại tàu lớn).
vulnerability_of_the_ship_to_fires_start.50481c = Mức dễ tổn thương của tàu với đám cháy do phát trúng gây ra (mọi loại vũ khí). Thân tàu chắc hơn cũng kìm lửa theo cùng tỷ lệ: với Warships = 5.0 một phát trúng gây đám cháy yếu hơn 5 lần (so với khoang) so với game. 1.0 = hành vi bình thường này của mod. 2.0 = đám cháy mạnh gấp đôi và lớn nhanh gấp đôi; 0.5 = yếu một nửa. 1.0 với mọi hệ số thân tàu 1.0 = như trong game.
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = Nước trong khu vực giới hạn đám cháy của nó: nó không thể mạnh hơn (100 - % nước của khu vực) của mức tối đa. Đám cháy mạnh hơn giảm xuống giới hạn đó với % này của mức tối đa mỗi giây. 0 = tắt.
water_in_the_whole_ship_the_average_of_i.a5b547 = Nước trong cả tàu, % (trung bình các khoang), từ đó nó chìm, như trong game (game: 40; tàu ngầm giữ 50 của game). Cũng là toàn thang của đồng hồ LEVEL.
water_over_the_deck_edge_a_multiplier_fo.512690 = Nước qua mép boong, một hệ số. Với tàu có điểm boong đã biết (thuật toán collider thân tàu đầy đủ): khi điểm boong của khoang nằm dưới biển DeckFloodingDelay giây liên tục (thời gian game, nén thời gian được tính), khoang nhận nước mà kiểm soát thiệt hại không ngăn được - 1.0 = 0,1% thể tích của nó mỗi giây trên mỗi mét chìm (sâu hơn = nhanh hơn); khoang đầy chuyển nước sang khoang kế bên chưa đầy nằm thấp nhất, và tiếp tục dọc chuỗi. Với tàu khác: tốc độ đầu đang chìm (do chúi quá giới hạn) hoặc mạn thấp (do nghiêng quá giới hạn) nhận nước qua mép boong - cơ chế riêng của mod, không có trong game. 2.0 = nhanh gấp đôi, 0.5 = một nửa, 0 = tắt.
when_a_ship_starts_to_sink_the_game_puts.562c7b = Khi tàu bắt đầu chìm, game đặt khối tâm của nó ở gốc thân tàu ((0, 1, 0) nếu nó đã lật): khối tâm nhảy, và mọi mô-men lên thân tàu cũng vậy. Bật = khối tâm ở nguyên chỗ cũ. Tắt = như trong game.
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = Khi một đội bịt lỗ của khoang (nhiệm vụ Flooding Rate), nó đồng thời bơm nước ra khỏi đó: phần này của tốc độ bơm ra (0.5 = một nửa, 0 = tắt). Đội được lệnh làm ngập đối trọng chỉ bơm từ mạn mà việc đó không làm xấu thêm độ nghiêng và chúi.
work_speed_of_a_rested_team_the_starting.1e64b0 = Tốc độ làm việc của đội đã nghỉ, % (điểm xuất phát của đường cong mệt). Tốc độ giảm theo đường thẳng từ đây tới mức mệt.
work_speed_of_a_team_that_has_just_becom.425925 = Tốc độ làm việc của đội vừa mệt, %. Giữa mức mệt và kiệt sức, tốc độ giảm theo đường thẳng.
work_speed_of_an_exhausted_team_it_stays.4cfc9a = Tốc độ làm việc của đội kiệt sức, %; nó giữ ở đó chừng nào đội còn làm việc.
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = Ghi một dòng vào log BepInEx cho mỗi tàu vào nhiệm vụ: độ nguyên vẹn thân tàu trong game và với mod.
