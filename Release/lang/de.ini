contacts_between_ships_at_a_relative_spe.3749a0 = Kontakte zwischen Schiffen mit einer Relativgeschwindigkeit unter diesem Wert (Knoten) richten keinen Schaden an (Schiffe, die sich im Verband berühren, Anlegen).
damage_to_the_hull_from_a_collision_with.efa04c = Rumpfschaden bei einer Kollision mit einem anderen Schiff (das Spiel kennt keinen: Schiffe schieben sich nur gegenseitig weg). Eine Kollision ist kein einzelner Schlag: ein rammender Bug kann auf das andere Schiff hinaufklettern und darüber gleiten. Der Schaden ist die Energie, die die Physik Schritt für Schritt abbaut, solange die Schiffe in Kontakt bleiben (der Schlag, das Drücken, das Schaben; ein Schiff, das nur auf einem anderen ruht, verliert nichts). Jedes Schiff trägt den Anteil, der von den Massen abhängt: das Quadrat der Geschwindigkeit mal (m_other / (m_self + m_other))^2 je Tonne der eigenen Verdrängung. 1.0 = zwei gleiche Schiffe, die mit 19 Knoten aufeinandertreffen, zerstören je etwa 1,25 Abteilungen; ein kleines Boot, das ein großes Schiff rammt, wird zerstört, das Schiff nur zerkratzt. Der Schaden trifft die Abteilungen, in denen sich die Schiffe in diesem Moment berühren (Ort und Seite der Kontaktpunkte), und öffnet Lecks wie ein Treffer, die mit dem erlittenen Schaden wachsen (ein Kontakt über der Wasserlinie leckt nur aus einer halb zerstörten Abteilung). 0 = aus.
