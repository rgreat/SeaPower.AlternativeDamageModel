the_share_of_the_sliding_along_the_conta.d54692 = Der Anteil der Gleitgeschwindigkeit (entlang des Kontakts), den ein Stoß nimmt, im Verhältnis dazu, wie stark die Schiffe aneinander drücken (ein Rammstoß in die Seite nimmt fast die ganze Gleitgeschwindigkeit, die Berührung paralleler Rümpfe nichts).
