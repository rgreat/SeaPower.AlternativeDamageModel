; Alternative Damage Model - texts, language: de
; key = text   (\n = line break; keep {0} {1} ...)
; Machine translation, not checked by a native speaker: corrections are welcome.

a_burning_section_opens_its_plugged_leak.20b488 = Ein brennender Abschnitt öffnet seine verschlossenen Lecks wieder: % des größten Lecks des Abschnitts pro Sekunde bei Brand 100% (weniger bei kleinerem Brand). 0 = aus.
a_fire_does_not_spread_into_a_compartmen.6e664b = Ein Brand breitet sich nicht in ein Abteil aus, in dem ein Schadenskontrolltrupp ist (er hält das Feuer an der Tür auf). Aus = wie im Spiel.
a_fire_no_damage_control_team_has_fought.5e3fa0 = Ein Brand, den längere Zeit kein Schadenskontrolltrupp bekämpft, wächst immer schneller: bei jeder Brandprüfung (FireCheckTime, 10 s) steigt seine Wachstumsrate, als wäre der Abschnitt erneut getroffen worden. Aus = wie im Spiel (ein Brand wächst nur durch Treffer).
a_fully_flooded_section_water_above_75_i.aaedbd = Ein voll gefluteter Abschnitt (Wasser über 75%): seine Systeme werden schwer beschädigt, fallen aus und können nicht repariert werden, solange er geflutet bleibt.
a_hit_on_a_compartment_that_is_already_d.364c92 = Ein Treffer auf ein bereits zerstörtes Abteil geht nicht verloren: die Hälfte des Schadens geht an das Nachbarabteil (dieselbe Seite, zur Schiffsmitte hin); ist es ebenfalls zerstört, geht ein Viertel an das übernächste. Der Überschuss eines Treffers, der ein Abteil zerstört, verteilt sich genauso.
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = Ein Treffer auf einen Abschnitt kann seine Trupps bei jeder Integrität verwunden. Aus = wie im Spiel: nur ein getroffener Abschnitt mit Integrität unter 50% kann einen Trupp ausschalten, mit der Chance Schaden x (1 - Integrität), höchstens 20%. An = jeder Treffer auf einen Abschnitt mit Trupps erhält den Verwundungswurf (siehe Wound chance); ein verwundeter Trupp geht in die Reserve.
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = Ein vom Feuer wieder geöffnetes Leck wächst bis zu diesem % des größten Lecks des Abschnitts zurück.
a_section_under_the_sea_puts_its_fire_ou.3d1565 = Ein Abschnitt unter Wasser löscht sein Feuer: das Feuer verliert dieses % seines Maximums pro Sekunde für jeden Meter, den die Deckskante des Abschnitts unter Wasser liegt (1 = so viele % pro Sekunde wie Meter). Nur wenn beide Deckspunkte des Abschnitts (Backbord und Steuerbord) unter Wasser liegen; die Tiefe ist der Mittelwert beider. Benötigt die Deckspunkte des Schiffs (wie beim Fluten über das Deck). 0 = aus.
a_team_cannot_plug_holes_while_the_ship.f5f08f = Ein Trupp kann keine Lecks stopfen, solange das Schiff schneller als dies ist, in Knoten. 0 = keine Grenze.
a_team_in_a_burning_section_loses_this_m.ecb388 = Ein Trupp in einem brennenden Abschnitt verliert pro Sekunde so viel seiner vollen Gesundheit bei Brand 100%, sofern nicht mindestens ein Trupp des Abschnitts das Feuer bekämpft (weniger bei geringerem Brand).
a_team_in_the_reserve_recovers_this_much.2dd530 = Ein Trupp in der Reserve erholt pro Sekunde so viel seiner vollen Gesundheit.
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = KI-Schiffe (nicht die eigenen) unter 50 m werden durch Fluten nicht langsamer: die Geschwindigkeitsbremse des Spiels durch Lecks und Wasser ist für sie aus (sie fahren weiter, wie Kamikaze). Die Schaltfläche „Limit Speed“ der eigenen Schiffe ist davon getrennt.
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = Chance eines schweren Brandes (ab 50% seines Maximums), sich auf Nachbarabschnitte auszubreiten, in % pro Brandprüfung: das Spiel prüft alle FireCheckTime (10 s) mit einer Chance von 0,0133% - praktisch nie. 0.0133 = wie im Spiel; 1.0 = 1% pro Prüfung (etwa einmal in 17 Minuten schweren Brandes), 0 = nie.
colours_the_weapon_buttons_of_the_select.a41d7b = Färbt die Waffenschaltflächen der unteren Leiste der gewählten Einheit nach dem Zustand ihrer Waffensysteme: alles funktioniert - Spielfarbe, ein Teil dieses Typs ausgefallen - gelb, alles ausgefallen - rot.
concussion_a_team_wounded_by_a_weapon_a.2d37ab = Gehirnerschütterung: ein von einer Waffe verwundeter Trupp (in einem getroffenen Abschnitt oder in der Reserve) bleibt nach Eintritt in die Reserve so viele Sekunden benommen; Auto DC schickt ihn erst nach Ablauf wieder an die Arbeit. Sie läuft neben der Gesundheit des Trupps, die ihre eigene Erholung hat. 0 = keine Gehirnerschütterung.
counterflooding_lets_water_into_one_side.8d3f44 = Gegenfluten lässt Wasser nur bis zu diesem % in eine Seite eines Abteils (die eigene Grenze des Abteils im Spiel gilt ebenfalls).
damage_control_efficiency_while_the_ship.d761c8 = Effizienz der Schadenskontrolle, solange der Motor des Schiffs (das genutzte Engine-Modul, nicht der Antrieb) ausgefallen ist: Wirksamkeit der Trupps in % (Brände, Lecks, Wasser, Rumpf; die Reparatur von Systemen bleibt unberührt). Wird in den Trupp-Hinweisen und in der Zeile Forecast des Reiters Damage Control gezeigt. 100 = aus.
damage_control_teams_in_a_section_with_a.e2dc23 = Schadenskontrolltrupps in einem Abschnitt mit Brand, die ihn nicht bekämpfen, arbeiten mit diesem % ihrer Wirksamkeit. 100 = aus.
damage_control_teams_of_a_civilian_ship.630d69 = Schadenskontrolltrupps eines Zivilschiffs nach Verdrängung: Tonnen=Trupps.
damage_control_teams_of_a_submarine_by_d.556a4a = Schadenskontrolltrupps eines U-Boots nach Verdrängung: Tonnen=Trupps.
damage_control_teams_of_a_surface_warshi.2960b3 = Schadenskontrolltrupps eines Überwasser-Kriegsschiffs nach Verdrängung: Tonnen=Trupps, ab so vielen Tonnen. NumberOfDCTeams in der ini eines Schiffs setzt weiterhin seine eigene Zahl.
debug_draws_the_selected_ship_s_hull_onl.f6f266 = Debug: zeichnet die reinen Rumpf-Collider (coll_hull*) des gewählten Schiffs als durchscheinende Überlagerung samt hellem Drahtgitter ihrer tatsächlichen Dreiecke, zum direkten Vergleich mit dem sichtbaren 3D-Modell.
debug_for_the_ship_currently_selected_in.50880e = Debug: zeichnet für das im Unit-Status-Panel gewählte Schiff eine Linie von der aktuellen Welle zur geschätzten Deckshöhe an der Mittellinie von Bug und Heck des Rumpfes sowie an einem Backbord-/Steuerbord-Paar je Abschnitt des Schadensmodells (sein eigener Mittelpunkt in der Länge) - nur Rumpf-Collider, nicht Türme, Masten oder andere Untermodelle. Grün: der Punkt liegt über der Welle; rot: die Welle steht darüber.
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = Debug: wie das 3D-Modell des gewählten Schiffs (auch Untermodelle) gezeichnet wird, damit ShowDeckCorners/ShowHullCollider sichtbar sind: Show (wie im Spiel), Translucent (70% durchsichtig) oder Hide.
diagnostics_while_a_ship_lists_or_trims.7ab078 = Diagnose: solange ein Schiff merklich Schlagseite oder Trimm hat, schreibt es alle 2 Sekunden ins BepInEx-Log: Schlagseite, Trimm, Höhe, Auftrieb gegen Gewicht, getauchtes Volumen, Wasser im Schiff und ob es sinkt / gekentert ist.
diagnostics_writes_every_fire_started_by.c267ad = Diagnose: schreibt jeden durch einen Treffer entstandenen Brand und jeden Stufenwechsel eines Brandes ins BepInEx-Log (Schiff, Abteil, Missionszeit, Stärke und Wachstum in % des Abteilmaximums, dortige Schadenskontrolltrupps). Funktioniert auch bei im Mods-Menü ausgeschaltetem Mod, zum Vergleich mit dem Spiel.
enables_verbose_logging_and_bepinex_alte.5d311f = Aktiviert ausführliche Protokollierung und BepInEx/AlternativeDamageModel.trace.txt.
fire_row_one_arrow_when_the_fire_changes.2c03b0 = Brandzeile: ein Pfeil, wenn sich der Brand schneller ändert als dies, in % seines Maximums pro Sekunde.
fire_row_two_arrows_down_when_the_fire_i.cfce19 = Brandzeile: zwei Pfeile nach unten, wenn der Brand schneller gelöscht wird als dies, in % seines Maximums pro Sekunde.
fire_row_two_arrows_up_when_the_fire_gro.8de955 = Brandzeile: zwei Pfeile nach oben, wenn der Brand schneller wächst als dies, in % seines Maximums pro Sekunde.
fixes_an_error_of_the_game_itself_above.638bbb = Behebt einen Fehler des Spiels selbst: über 10x Zeitraffer wächst der Trimm eines Schiffs mit dem Zeitraffer (ein 25-m-Boot bei 47 kn: 2,6 Grad bis 10x, 9 bei 100x) - genug, um ein kurzes, schnelles, unbeschädigtes Schiff zu versenken. Das Spiel bewegt ein Schiff um einen Schritt pro Physik-Tick, und über 10x wird dieser Schritt gedehnt, während das Auftriebsmoment weiter um den Massenschwerpunkt vor dem Schritt genommen wird. An: dieser zusätzliche Schritt entfällt, sodass der Trimm bei jedem Zeitraffer der von 10x bleibt; bis 10x ändert sich nichts. Nur Überwasserschiffe. Aus: Verhalten des Spiels.
flooding_row_and_flooding_plan_one_arrow.802936 = Flutzeile und Flutplan: ein Pfeil, wenn sich der Wasserstand schneller ändert als dies, in % des Abteils pro Sekunde.
flooding_row_and_flooding_plan_two_arrow.129e17 = Flutzeile und Flutplan: zwei Pfeile, wenn sich der Wasserstand schneller ändert als dies, in % des Abteils pro Sekunde.
four_small_icons_under_a_ship_s_icon_on.001776 = Vier kleine Symbole unter dem Schiffssymbol auf der Karte (auch Ihres): Feuer (Gesamtstärke der Brände), Wasser, Rumpf (wie im Damage-Control-Panel eingestuft) und Motor; gelb / orange / rot nach Schwere, und ein grauer werdendes Kartensymbol, wenn das Schiff sinken wird (binnen 20 Minuten nach dem Flut-/Rumpftrend). Ein Kontakt: Feuer, Wasser, Rumpf und Motor nur bei direkter Sicht; per Sonar - nur der Motor (gelb: Teil verloren, rot: nichts funktioniert); per Radar - eine Schätzung für ein in den letzten 10 Minuten getroffenes Schiff, mit '?' markiert (gelb: 10 Knoten oder weniger, rot: unter 3); nichts per ESM oder ohne Kontakt, und nichts für ein gesunkenes Schiff. Die Zeile Fires des Reiters Damage Control nutzt dieselbe Gesamtstärke. Der Unit Status eines Kontakts zeigt einen Reiter Damage State mit denselben Informationen in Worten.
health_of_a_damage_control_team_a_multip.330f74 = Gesundheit eines Schadenskontrolltrupps, ein Multiplikator seines Maximums, das je nach Verdrängung des Schiffs 1..100 Punkte beträgt (100 = Besatzung von 1000 und mehr, etwa 30000 t; 1000 t = 24, 10000 t = 101). Im Hinweis des Trupps als Teil des vollen Wertes gezeigt. Ein Trupp bei 0 ist tot. Verwundete Trupps arbeiten langsamer (so viel wie ihre Gesundheit, nicht unter 25%). 0 = Trupps werden nie verwundet (ein Treffer wirft einen Trupp dennoch aus seinem Abschnitt).
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = Wie schnell ein Brand den Rumpf seines Abschnitts zerfrisst (Integrität beider Abteile). 1.0 = wie im Spiel. Der Schaden an den Systemen des Abschnitts bleibt unverändert.
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = Wie schnell ein Trupp in der Reserve Ermüdung abbaut, in % der Geschwindigkeit, mit der sie sich bei der Arbeit aufbaut. 100 = gleich schnell; 50 = Erholung dauert doppelt so lang wie die Arbeit.
how_fast_a_team_walks_through_the_ship_m.440ac9 = Wie schnell ein Trupp durch das Schiff läuft, Meter pro Minute (die Reserve liegt in der Mitte). Eine Verlegung = MusterTime + der Weg, auf 10 s gerundet. 0 = keine Laufzeit; bei MusterTime ebenfalls 0 bewegen sich Trupps sofort und Auto DC ist das des Spiels.
how_fast_damage_control_teams_pump_water.daadca = Wie schnell Schadenskontrolltrupps Wasser auspumpen. 1.0 = wie im Spiel.
how_fast_damage_control_teams_put_fires.5d5eaf = Wie schnell Schadenskontrolltrupps Brände löschen. 1.0 = wie im Spiel.
how_fast_fires_grow_by_themselves_betwee.e757ca = Wie schnell Brände von selbst wachsen, zwischen Treffern. 1.0 = wie im Spiel, 2.0 = doppelt so schnell, 0.5 = halb so schnell.
how_fast_water_comes_in_through_the_hole.cad705 = Wie schnell Wasser durch die Lecks eines Abteils eindringt. 1.0 = wie im Spiel.
how_many_times_stronger_the_hull_of_civi.706453 = Wievielmal stärker der Rumpf ziviler Schiffe (ini-Dateien civ_*) als im Spiel ist. 1.0 = wie im Spiel.
how_many_times_stronger_the_hull_of_subm.d3d1a9 = Wievielmal stärker der Rumpf von U-Booten als im Spiel ist. 1.0 = wie im Spiel.
how_many_times_stronger_the_hull_of_surf.32130e = Wievielmal stärker der Rumpf von Überwasser-Kriegsschiffen als im Spiel ist. 1.0 = wie im Spiel, 2.0 = doppelt so stark. Einzelne Schiffe erhalten ihren eigenen Wert im Abschnitt [HullIntegrityPerShip], eine Zeile je Schiff: ini-Dateiname = Multiplikator (z. B. usn_bb_iowa = 3.0).
how_much_one_team_gets_done_plugging_fir.8ecb35 = Wie viel ein Trupp schafft (Lecks stopfen, Feuer bekämpfen, Pumpen, Rumpf- und Systemreparaturen) im Vergleich zum Spiel. 1.0 = wie im Spiel.
how_strongly_the_list_follows_uneven_flo.541fe4 = Wie stark die Schlagseite ungleichmäßigem Fluten folgt. Der Wasserunterschied zwischen Backbord- und Steuerbordseite eines Abschnitts (er neigt das Schiff) wird damit multipliziert; der Mittelwert des Abschnitts bleibt, sodass Tiefgang und Trimm sich dadurch nicht ändern. 1 = wie im Spiel, 2 = doppelte Schlagseite bei gleichem Unterschied.
how_the_ship_s_speed_changes_the_growth.6d2cf6 = Wie die Geschwindigkeit des Schiffs das Wachstum von Bränden und das eindringende Wasser (durch Lecks und über die Deckskante) ändert: Knoten=Flut-/Brand-Multiplikator, ein Streckenzug durch die Punkte. Die Geschwindigkeit wird als Betrag genommen; unter dem ersten und über dem letzten Punkt gelten die Endmultiplikatoren.
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = Sprache der Texte des Mods: en, ru, cn, de, es, fr, ko, ja oder vn. Leer = die Sprache des Spiels. Die Texte liegen im Ordner lang des Mods (lang/<Code>.ini); ein fehlender Text wird englisch angezeigt.
list_degrees_the_full_scale_of_the_list.a220dc = Schlagseite, Grad: die volle Skala der LIST-Anzeige. Ab ihrer roten Zone (75% davon) kommt Wasser über die Deckskante und flutet alle Abteile der tiefen Seite schnell (Spiel: bei 45). Das Schiff sinkt dadurch nicht von selbst; Kentern bei 70 Grad schon, wie im Spiel.
metres_the_trim_limit_depends_on_the_shi.be80af = Meter. Die Trimmgrenze hängt von der Schiffslänge ab: je länger das Schiff, desto früher geht Bug oder Heck bei gleichem Winkel unter (tan Grenze = tan TrimLimit x (TrimReferenceLength / Länge)^0.442; mit 5.2 bei 100: 30 m 8.8, 60 m 6.5, 150 m 4.4, 300 m 3.2 Grad). 0 = TrimLimit für jedes Schiff (wie im Spiel).
minutes_of_work_in_a_section_until_a_tea.abe7fb = Minuten Arbeit in einem Abschnitt, bis ein Trupp müde ist (erste Stufe); seine Geschwindigkeit sinkt gemäß den Speed-Einstellungen. Die Reserve baut Ermüdung so schnell ab, wie die Arbeit sie aufbaut. Im Hinweis des Trupps gezeigt; das Symbol eines müden Trupps ist hervorgehoben. 0 = keine Ermüdung.
minutes_of_work_until_a_team_is_exhauste.461264 = Minuten Arbeit, bis ein Trupp erschöpft ist, die zweite Stufe der Ermüdung (höchstens: dort hört die Ermüdung auf zu wachsen). Nicht über „Tired after“ = keine zweite Stufe.
multiplier_of_the_chance_that_a_hit_woun.6766c6 = Multiplikator der Chance, dass ein Treffer einen Trupp verwundet (0.5 = halb so wahrscheinlich, 2 = doppelt; das Ergebnis ist höchstens 100%). Schritt 1 (nur solange Wounds at any hull integrity aus ist) - das Spiel entscheidet, ob ein Treffer einen Trupp überhaupt aus seinem Abschnitt wirft (nur ein getroffener Abschnitt mit Integrität unter 50%: Schaden x (1 - Integrität), höchstens 20%). Schritt 2 - der Mod entscheidet die Verwundung: die Chance steigt steil mit der Gefechtskopfleistung (etwa Leistung^1.8) und fällt mit der Gesundheit des Trupps (etwa Gesundheit^1.2) - Gefechtskopf 2.2 gegen Gesundheit 2: etwa 10%, gegen 100: 0,1%; Gefechtskopf 82 gegen 100: etwa 75%; weit darüber über 100%. Sie wird mit diesem Multiplikator multipliziert und dann auf 100% begrenzt (bei ausgeschaltetem Wounds at any hull integrity verlässt ein nicht verwundeter Trupp den Abschnitt trotzdem). Ein stärkerer Gefechtskopf erhöht die Chance. Ein größeres Schiff senkt sie: seine Trupps sind zäher (mehr Gesundheit) und seine Abteile größer, ein Treffer landet seltener dort, wo der Trupp ist. Selbst der schwächste Treffer hat eine kleine Chance. Beispiel, Gefechtskopf 25: gegen Gesundheit 12 etwa 100%, gegen 29 etwa 37%, gegen 100 etwa 9%. 0 = nie verwundet.
multiplier_of_the_strength_of_a_wound_at.119bcb = Multiplikator der Stärke einer Verwundung: höchstens die Gefechtskopfleistung der Munition (0..196, die Hälfte der Munition des Spiels unter 25) x dies, in Punkten der Trupp-Gesundheit (1..100 nach Verdrängung). Ein verwundeter Trupp geht in die Reserve.
random_spread_of_the_concussion_time_sec.c54f69 = Zufällige Streuung der Betäubungszeit, Sekunden in jede Richtung: HealTime 90 mit 30 = 60 bis 120 s, wie im Spiel. 0 = immer HealTime.
resistance_to_the_horizontal_movement_of.dc8036 = Widerstand gegen die HORIZONTALE Bewegung eines zerstörten Schiffs, als Vielfaches des linearen Widerstands des Spiels (25 bei fast jedem Schiff): das Wrack verliert früher die Fahrt. 1 = wie im Spiel. Sinken (vertikale Bewegung) und Drehen (Kentern) werden nicht gebremst.
seconds_game_time_so_time_compression_co.551b95 = Sekunden (Spielzeit, Zeitraffer zählt), die der Deckspunkt eines Abteils hintereinander unter Wasser sein muss, bevor Wasser über das Deck eindringt (siehe DeckFloodingSpeed). Ein auftauchender Punkt setzt den Timer zurück. Standard 3.
seconds_a_team_needs_to_get_ready_before.3b6e27 = Sekunden, die ein Trupp vor jeder Verlegung zur Bereitschaft braucht. Das Abbrechen einer Verlegung, solange er sich noch bereit macht, kostet keine Zeit.
settings_profile_in_use_chosen_in_the_ga.331d79 = Verwendetes Einstellungsprofil, im Spiel gewählt: Unit Status -> Damage Control -> das Zahnrad neben (i). Diese Datei enthält nur die allgemeinen Einstellungen ([General], [UI]); die Werte des Schadensmodells stehen in der Datei des Profils: eingebaute im Ordner Profiles des Mods (schreibgeschützt), eigene in StreamingAssets/user/AlternativeDamageControl/Profiles. Das Ändern eines eingebauten Profils im Spiel speichert es als Custom. Änderungen an der Datei des verwendeten Profils oder an diesem Namen werden während des Spiels übernommen.
ships_ini_file_names_comma_separated_edi.c5b815 = Schiffe (ini-Dateinamen, durch Komma getrennt; im Einstellungsfenster bearbeitet, Reiter Flooding), die keine Deck Points erhalten: sie werden nach den alten, einfacheren Regeln geflutet, wie ein Schiff ohne Rumpf-Collider.
team_fatigue_on_working_builds_it_up_the.e170b3 = Trupp-Ermüdung an: Arbeit baut sie auf, die Reserve baut sie ab, ein müder Trupp arbeitet mit halber Geschwindigkeit. Aus = keine Ermüdung; ihre Einstellungen sind ausgeblendet.
team_health_on_wounds_from_hits_and_fire.0440b7 = Trupp-Gesundheit an: Verwundungen durch Treffer und Brände, Erholung in der Reserve, verwundete Trupps arbeiten langsamer. Aus = Regeln des Spiels (ein Treffer wirft einen Trupp für eine Weile aus, keine Verwundungen); die übrigen Gesundheitseinstellungen sind ausgeblendet.
the_detailed_view_of_unit_status_damage.b04888 = Die Detailansicht von Unit Status -> Damage Control (die Anzeige des Mods): Rumpfintegrität je Seite neben dem Namen jedes Abschnitts, ein Symbol je Schadenskontrolltrupp (seine Aufgabe; Aufgaben und Verlegungen von Hand bei ausgeschaltetem Auto DC), Wasser und Feuer in % mit Trendpfeilen, DC Priority, die Trupp-Karten, die Anzeigen LIST / TRIM / LEVEL mit Flutplan, Hinweise, die Legende (i). Aus: die eigene Ansicht des Spiels (das Zahnrad des Einstellungsfensters bleibt).
the_mod_s_damage_model_and_damage_contro.b3b07a = Schadensmodell und Schadenskontrolle des Mods: Rumpf- und Systemstärke, Nebeneffekte, Brand- und Fluttempo, Brandausbreitung, Schadenskontrolltrupps (Anzahl, Wirksamkeit, Laufverlegungen, Ausfälle, das optimierte Auto DC, Verschieben einzelner Trupps), Grenzen für Schlagseite / Trimm / Sinken. DC Priority und von Hand gegebene Aufgaben gehören zur Detailansicht und bleiben. Aus: Schaden und Schadenskontrolle des Spiels (die Ansicht des Reiters Damage Control bleibt). Jederzeit umschaltbar: Schiffe auf See folgen sofort (Rumpfstärke und Truppzahlen zurück zu denen des Spiels oder des Mods; Trupps unterwegs kommen an, ausgefallene erholen sich).
the_teams_rest_in_the_central_compartmen.4ac676 = Die Trupps ruhen im zentralen Abteil: ein Treffer darauf kann einen in der Reserve wartenden Trupp verwunden (die Chance ist die des Spiels für einen in einem getroffenen Abschnitt ausgeschalteten Trupp: Schaden x (1 - Integrität), nur unter 50% Integrität). Ein verwundeter ruhender Trupp bleibt in der Reserve.
trim_degrees_for_a_ship_trimreferencelen.8ab413 = Trimm, Grad, für ein TrimReferenceLength langes Schiff: die volle Skala der TRIM-Anzeige. Ab ihrer roten Zone (75% davon) flutet das absinkende Ende schnell: auf jeder Seite das äußerste Abteil, ist es voll das nächste, und so weiter. Das Schiff sinkt nicht sofort, anders als im Spiel (8 Grad bei einem gefluteten Abschnitt).
unattended_fire_how_much_the_growth_rate.84fa6e = Unbeaufsichtigter Brand: um wie viel die Wachstumsrate bei jeder Brandprüfung steigt, in % der maximalen Wachstumsrate des Brandes (ein gewöhnlicher Treffer fügt 0,1-0,8% hinzu).
unattended_fire_its_growth_rate_is_raise.b4969b = Unbeaufsichtigter Brand: seine Wachstumsrate wird nur bis hierher erhöht, in % des Brandmaximums pro Sekunde.
unattended_fire_seconds_without_a_team_f.098d15 = Unbeaufsichtigter Brand: Sekunden ohne Trupp, der das Feuer bekämpft (ab seinem Beginn oder dem letzten Einsatz eines Trupps), bevor es schneller zu wachsen beginnt.
vulnerability_of_the_hull_to_flooding_th.35677a = Verwundbarkeit des Rumpfes für Fluten durch Lecks aus Treffern (alle Waffentypen). 1.0 = jedes Leck lässt so viel Wasser ein wie im Spiel, und Lecks über der Wasserlinie beginnen nach demselben Schaden zu lecken wie im Spiel (der stärkere Rumpf hält das Wasser nicht zurück). 2.0 = doppelt so viel Wasser; 0.5 = halb so viel.
vulnerability_of_the_hull_to_gun_shells.c70d65 = Verwundbarkeit des Rumpfes für Geschützgranaten (Raketen, Torpedos und Bomben sind nicht betroffen). Geschützgranaten nehmen einen Anteil an der Sinkgrenze eines Schiffs, der von der Rumpfgröße abhängt. 1.0 = jede Granate nimmt so viel wie im Spiel; der stärkere Rumpf überlebt einfach mehr Treffer. 2.0 = Granaten treffen, als wäre der Rumpf halb so groß; 0.5 = als wäre er doppelt so groß (mittlere Granaten können großen Schiffen nicht mehr schaden).
vulnerability_of_the_ship_to_fires_start.50481c = Verwundbarkeit des Schiffs für durch Treffer entstandene Brände (alle Waffentypen). Der stärkere Rumpf hält Brände im gleichen Verhältnis zurück: bei Warships = 5.0 löst ein Treffer einen 5-mal schwächeren Brand (relativ zum Abteil) aus als im Spiel. 1.0 = dieses normale Verhalten des Mods. 2.0 = doppelt so starke Brände, die doppelt so schnell wachsen; 0.5 = halb so stark. 1.0 bei allen Rumpfmultiplikatoren 1.0 = wie im Spiel.
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = Wasser in einem Abschnitt begrenzt sein Feuer: es kann nicht stärker sein als (100 - Wasser-% des Abschnitts) des Maximums. Ein stärkeres Feuer fällt mit diesem % des Maximums pro Sekunde auf diese Grenze. 0 = aus.
water_in_the_whole_ship_the_average_of_i.a5b547 = Wasser im ganzen Schiff, % (Mittel seiner Abteile), ab dem es sinkt, wie im Spiel (Spiel: 40; U-Boote behalten die 50 des Spiels). Auch die volle Skala der LEVEL-Anzeige.
water_over_the_deck_edge_a_multiplier_fo.512690 = Wasser über die Deckskante, ein Multiplikator. Für Schiffe mit bekannten Deckspunkten (der volle Rumpf-Collider-Algorithmus): war der Deckspunkt eines Abteils DeckFloodingDelay Sekunden hintereinander unter Wasser (Spielzeit, Zeitraffer zählt), nimmt das Abteil Wasser auf, das die Schadenskontrolle nicht stoppen kann - 1.0 = 0,1% seines Volumens pro Sekunde je Meter Eintauchtiefe (tiefer = schneller); ein volles Abteil gibt das Wasser an den tiefstgelegenen nicht vollen Nachbarn weiter, und so die Kette entlang. Für andere Schiffe: wie schnell das absinkende Ende (bei Trimm über der Grenze) oder die tiefe Seite (bei Schlagseite über der Grenze) Wasser über die Deckskante aufnimmt - die eigene Mechanik des Mods, nicht im Spiel. 2.0 = doppelt so schnell, 0.5 = halb, 0 = aus.
when_a_ship_starts_to_sink_the_game_puts.562c7b = Wenn ein Schiff zu sinken beginnt, setzt das Spiel seinen Massenschwerpunkt in den Rumpfursprung ((0, 1, 0), falls es gekentert ist): der Schwerpunkt springt, und mit ihm jedes Drehmoment auf den Rumpf. An = der Schwerpunkt bleibt, wo er war. Aus = wie im Spiel.
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = Während ein Trupp die Lecks eines Abteils stopft (die Aufgabe Flooding Rate), pumpt er gleichzeitig Wasser heraus: dieser Anteil der Auspumpgeschwindigkeit (0.5 = halb, 0 = aus). Ein zum Gegenfluten befohlener Trupp pumpt nur von der Seite, auf der das Schlagseite und Trimm nicht verschlechtert.
work_speed_of_a_rested_team_the_starting.1e64b0 = Arbeitsgeschwindigkeit eines ausgeruhten Trupps, % (Startpunkt der Ermüdungskurve). Die Geschwindigkeit fällt linear von hier bis zur Stufe „müde“.
work_speed_of_a_team_that_has_just_becom.425925 = Arbeitsgeschwindigkeit eines gerade müde gewordenen Trupps, %. Zwischen den Stufen „müde“ und „erschöpft“ fällt die Geschwindigkeit linear.
work_speed_of_an_exhausted_team_it_stays.4cfc9a = Arbeitsgeschwindigkeit eines erschöpften Trupps, %; sie bleibt dort, solange der Trupp weiterarbeitet.
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = Schreibt für jedes Schiff, das in eine Mission eintritt, eine Zeile ins BepInEx-Log: seine Rumpfintegrität im Spiel und mit dem Mod.
