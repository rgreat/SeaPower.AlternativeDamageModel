collisions_affect_the_ships_of_the_ai_to.f0324c = Kollisionen wirken auch auf die Schiffe der KI (Rumpf und Geschwindigkeit). Aus: nur das von Ihnen gesteuerte Schiff ist betroffen.
ships_that_collide_are_damaged_and_slowe.8a2df6 = Kollidierende Schiffe werden beschädigt und gebremst. Aus: eine Kollision zwischen Schiffen bewirkt nichts, wie im Spiel.
