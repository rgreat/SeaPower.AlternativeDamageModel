hull_damage_from_a_collision_of_ships_th.72d875 = Rumpfschaden durch eine Kollision von Schiffen (im Spiel gibt es keinen). Der Schaden ist die Energie, die verloren geht, solange die Schiffe in Kontakt bleiben (Stoß, Schieben, Schaben), pro Tonne der eigenen Verdrängung; das leichtere Schiff leidet mehr. 1.0 = zwei gleiche Schiffe, die mit 19 Knoten zusammenstoßen, zerstören je etwa eineinviertel Abteilungen. Der Schaden trifft die Abteilungen an der Berührungsstelle und öffnet Lecks. 0 = aus.
multiplier_of_the_flooding_that_a_collis.b248fb = Multiplikator für die Flutung, die eine Kollision öffnet (die Lecks in den beschädigten Abteilungen). 1.0 = wie berechnet, 0 = Kollisionen verursachen keine Lecks.
