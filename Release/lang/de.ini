ships_of_the_ai_are_slowed_by_a_collisio.820975 = Auch Schiffe der KI werden durch eine Kollision gebremst (das von Ihnen gesteuerte Schiff immer, wenn „Abbremsen beim Stoß“ über 0 liegt).
ships_that_collide_lose_speed_the_relati.a08a6f = Kollidierende Schiffe verlieren Fahrt: die Relativgeschwindigkeit quer zum Kontakt geht fast ganz verloren (das leichtere Schiff verliert am meisten, das schwerere kaum etwas), entlang des Kontakts nur ein Teil (siehe „Bremsen beim Schaben“ und „Bremsen bei Anpressung“). Die Spielphysik bremst Schiffe nicht, das tut der Mod. Danach beschleunigt das Schiff mit eigenen Maschinen wieder. 0 = die Schiffe behalten ihre Geschwindigkeit.
