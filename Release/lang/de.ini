the_water_holds_a_ship_that_is_shoved_si.81f347 = Das Wasser hält ein Schiff, das seitlich geschoben oder gedreht wird (mitbewegtes Wasser, Widerstand): quer zum Rumpf zählt ein Schiff mehrfach schwerer als seine Verdrängung, längs kaum mehr. So wird ein Rammstoß in die Seite stärker gebremst und schiebt sein Ziel weniger. 1.0 = etwa das Fünffache der Verdrängung quer, 0 = nur die Verdrängung.
