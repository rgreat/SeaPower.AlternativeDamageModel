four_small_icons_under_a_ship_s_icon_on.e864ac = Vier kleine Symbole unter dem Schiffssymbol auf der Karte (auch Ihres): Feuer (Gesamtstärke der Brände), Wasser, Rumpf (wie im Damage-Control-Panel eingestuft) (auf dem eigenen Schiff werden Rumpfschäden, die nicht mehr geschweißt werden können, und Wasser, das nicht abgepumpt werden kann, nicht gezeigt; die Reparaturpläne eines Kontakts sind unbekannt) und Motor; gelb / orange / rot nach Schwere, und ein grauer werdendes Kartensymbol, wenn das Schiff sinken wird (binnen 20 Minuten nach dem Flut-/Rumpftrend). Ein Kontakt: Feuer, Wasser, Rumpf und Motor nur bei direkter Sicht; per Sonar - nur der Motor (gelb: Teil verloren, rot: nichts funktioniert); per Radar - eine Schätzung für ein in den letzten 10 Minuten getroffenes Schiff, mit '?' markiert (gelb: 10 Knoten oder weniger, rot: unter 3); nichts per ESM oder ohne Kontakt, und nichts für ein gesunkenes Schiff. Die Zeile Fires des Reiters Damage Control nutzt dieselbe Gesamtstärke. Der Unit Status eines Kontakts zeigt einen Reiter Damage State mit denselben Informationen in Worten.
