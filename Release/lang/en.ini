module_types_modules_ini_with_their_own.4d6409 = Module types (modules.ini) with their own Integrity, set explicitly in place of modules.ini's (the game's value is put in when a type is picked); the Integrity multiplier above does not apply to them. The game's own adjustments keep their proportion: types marked "× tonnage" (amber) grow with the ship's displacement - point at one for its final values -, and a ship's own value for a system is changed in the same ratio.
ships_that_get_no_deck_points_flooding_w.029d22 = Ships that get no Deck Points (Flooding): water over the deck edge is not calculated for them, the old simpler rules are used, as for a ship without a hull collider. Picked from the game's ships or by ini file name.
ships_with_their_own_hull_multiplier_cho.8c5c9c = Ships with their own hull multiplier, chosen from the game's ships (or by ini file name): how many times stronger than in the game; replaces the class value, is not multiplied by it.
