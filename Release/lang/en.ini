damage_to_the_hull_from_a_collision_with.efa04c = Damage to the hull from a collision with another ship (the game has none: ships only push each other). A collision is not one blow: a ramming bow may climb onto the other ship and slide over it. The damage is the energy the physics wears down while the ships stay in contact, step by step (the blow, the pushing, the scraping; a ship that just rests on another loses nothing). Each ship takes the share that depends on the masses: the speed squared times (m_other / (m_self + m_other))^2 per ton of its own displacement. 1.0 = two equal ships meeting at 19 knots ruin about one and a quarter of a compartment each; a small boat that rams a big ship is wrecked, the ship scratched. The damage goes to the compartments where the ships touch at that moment (the place and the side of the contact points) and opens leaks as a hit does, growing with the damage taken (a contact over the waterline leaks only from a half-destroyed compartment). 0 = off.
