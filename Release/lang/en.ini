; Alternative Damage Model - texts, language: en
; key = text   (\n = line break; keep {0} {1} ...)
; English: the texts of the code, nothing to translate here. Copy this file to start a new language.

a_burning_section_opens_its_plugged_leak.20b488 = A burning section opens its plugged leaks again: % of the largest leak the section has had, per second at fire 100% (less at a smaller fire). 0 = off.
a_fire_does_not_spread_into_a_compartmen.6e664b = A fire does not spread into a compartment where a damage control team is (it stops the fire at the door). Off = as in the game.
a_fire_no_damage_control_team_has_fought.5e3fa0 = A fire no damage control team has fought for a while grows faster and faster: every fire check (FireCheckTime, 10 s) its growth rate rises as if the section were hit again. Off = as in the game (a fire grows only from hits).
a_fully_flooded_section_water_above_75_i.aaedbd = A fully flooded section (water above 75%): its systems are brought down to severe damage, made inoperable and cannot be repaired while it stays flooded.
a_hit_on_a_compartment_that_is_already_d.364c92 = A hit on a compartment that is already destroyed is not lost: half of the damage goes to the neighbouring compartment (the same side, towards the middle of the ship); if that one is destroyed too, a quarter goes to the one after it. The surplus of the hit that destroys a compartment spills the same way.
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = A hit on a section can wound its teams at any integrity. Off = as in the game: only a hit section with integrity under 50% can take a team out, with the chance damage x (1 - integrity), at most 20%. On = every hit on a section with teams gets the wound roll (see Wound chance); a wounded team walks to the reserve.
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = A leak reopened by fire grows back up to this % of the largest leak the section has had.
a_section_under_the_sea_puts_its_fire_ou.3d1565 = A section under the sea puts its fire out: the fire loses this % of its maximum per second for every metre the section's deck edge is under water (1 = as many % per second as metres). Only when both deck points of the section (port and starboard) are under water; the depth is the mean of the two. Needs the ship's deck points (as flooding over the deck). 0 = off.
a_team_cannot_plug_holes_while_the_ship.f5f08f = A team cannot plug holes while the ship is faster than this, knots. 0 = no limit.
a_team_in_a_burning_section_loses_this_m.ecb388 = A team in a burning section loses this much of its full health a second at fire 100% unless at least one team of the section is fighting the fire (less at a lower fire level).
a_team_in_the_reserve_recovers_this_much.2dd530 = A team in the reserve recovers this much of its full health a second.
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = AI ships (not the player's own) shorter than 50 m do not slow down from flooding: the game's cut of speed by holes and water is off for them (they keep going, like kamikazes). The "Limit Speed" button of your own ships is separate.
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = Chance of a severe fire (from 50% of its maximum) to spread to the next sections, in % per fire check: the game checks every FireCheckTime (10 s) with a chance of 0.0133% - hardly ever. 0.0133 = as in the game; 1.0 = 1% per check (about once in 17 minutes of severe fire), 0 = never.
colours_the_weapon_buttons_of_the_select.a41d7b = Colours the weapon buttons of the selected unit's bottom panel by the state of their weapon systems: all working - the game's colour, some of that type inoperable - yellow, all of them inoperable - red.
concussion_a_team_wounded_by_a_weapon_a.2d37ab = Concussion: a team wounded by a weapon (a hit section, or the reserve) is concussed for this many seconds after it is in the reserve; Auto DC does not send it back to work until the concussion has passed. It runs next to the team's health, which has its own recovery. 0 = no concussion.
counterflooding_lets_water_into_one_side.8d3f44 = Counterflooding lets water into one side of a compartment only up to this % (the game's own limit of a compartment also holds).
damage_control_efficiency_while_the_ship.d761c8 = Damage control efficiency while the ship's engine (the Engine module in use, not the propulsion) is out of order: the teams' effectiveness in % (fires, leaks, water, hull; repair of systems is not affected). Shown in the teams' hints and in the Forecast line of the Damage Control tab. 100 = off.
damage_control_teams_in_a_section_with_a.e2dc23 = Damage control teams in a section with a fire that are not fighting it work at this % of their effectiveness. 100 = off.
damage_control_teams_of_a_civilian_ship.630d69 = Damage control teams of a civilian ship by displacement: tons=teams.
damage_control_teams_of_a_submarine_by_d.556a4a = Damage control teams of a submarine by displacement: tons=teams.
damage_control_teams_of_a_surface_warshi.2960b3 = Damage control teams of a surface warship by displacement: tons=teams, from that many tons up. NumberOfDCTeams in a ship's ini still sets its own number.
debug_draws_the_selected_ship_s_hull_onl.f6f266 = Debug: draws the selected ship's hull-only collider meshes (coll_hull*) as a translucent overlay plus a bright wireframe of their actual triangles, to compare against the visible 3D model directly.
debug_for_the_ship_currently_selected_in.50880e = Debug: for the ship currently selected in the Unit Status panel, draws a line from the current wave to the estimated deck height at the hull's bow and stern centreline, and at a port/starboard pair per damage-model section (its own centre point along the length) - hull colliders only, not turrets, masts or any other sub-model. Green: that point clears the wave; red: the wave is over it.
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = Debug: how the selected ship's own 3D model (submodels too) is drawn, so ShowDeckCorners/ShowHullCollider can be seen: Show (as in the game), Translucent (70% transparent) or Hide.
diagnostics_while_a_ship_lists_or_trims.7ab078 = Diagnostics: while a ship lists or trims noticeably, writes to the BepInEx log every 2 seconds: list, trim, height, buoyancy against weight, submerged volume, water in the ship and whether it is sinking / capsized.
diagnostics_writes_every_fire_started_by.c267ad = Diagnostics: writes every fire started by a hit and every change of a fire's stage to the BepInEx log (ship, compartment, mission time, severity and growth in % of the compartment's maximum, damage control teams there). Works also while the mod is off in the Mods menu, to compare with the game.
enables_verbose_logging_and_bepinex_alte.5d311f = Enables verbose logging and BepInEx/AlternativeDamageModel.trace.txt.
fire_row_one_arrow_when_the_fire_changes.2c03b0 = Fire row: one arrow when the fire changes faster than this, in % of its maximum per second.
fire_row_two_arrows_down_when_the_fire_i.cfce19 = Fire row: two arrows down when the fire is put out faster than this, in % of its maximum per second.
fire_row_two_arrows_up_when_the_fire_gro.8de955 = Fire row: two arrows up when the fire grows faster than this, in % of its maximum per second.
fixes_an_error_of_the_game_itself_above.638bbb = Fixes an error of the game itself: above 10x time compression a ship's trim grows with the time compression (a 25 m boat at 47 kn: 2.6 degrees up to 10x, 9 at 100x) - enough to send a short, fast, undamaged ship under. The game moves a ship by a step per physics tick, and above 10x that step is stretched while the buoyancy torque is still taken about the centre of mass from before the step. On: that extra step is left out, so the trim stays what it is at 10x at any time compression; up to 10x nothing changes. Surface ships only. Off: the game's own behaviour.
flooding_row_and_flooding_plan_one_arrow.802936 = Flooding row and flooding plan: one arrow when the water level changes faster than this, in % of the compartment per second.
flooding_row_and_flooding_plan_two_arrow.129e17 = Flooding row and flooding plan: two arrows when the water level changes faster than this, in % of the compartment per second.
four_small_icons_under_a_ship_s_icon_on.001776 = Four small icons under a ship's icon on the map (yours too): fire (the fires' total strength), water, hull (as classed on the Damage Control panel) and engine; yellow / orange / red by severity, and a greyer map icon when the ship is going to sink (within 20 minutes by the flooding / hull trend). A contact: fire, water, hull and engine only in direct sight; by sonar - the engine only (yellow: part of it lost, red: none works); by radar - a guess for a ship hit in the last 10 minutes, marked '?' (yellow: 10 knots or less, red: under 3); nothing by ESM or without a contact, and nothing for a sunk ship. The Fires line of the Damage Control tab uses the same total strength. The Unit Status of a contact shows a Damage State tab with the same information in words.
health_of_a_damage_control_team_a_multip.330f74 = Health of a damage control team, a multiplier of its maximum, which is 1..100 points by the ship's displacement (100 = a crew of 1000 and more, about 30000 t; 1000 t = 24, 10000 t = 101). Shown in the team's hint as a part of the full. A team at 0 is dead. Wounded teams work slower (as much as their health, not below 25%). 0 = teams are never wounded (a hit still takes a team out of its section).
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = How fast a fire eats the hull of its section (integrity of both its compartments). 1.0 = as in the game. Damage to the systems in the section is not changed.
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = How fast a team in the reserve gets rid of fatigue, % of the speed it builds up at while working. 100 = as fast; 50 = rest takes twice as long as the work.
how_fast_a_team_walks_through_the_ship_m.440ac9 = How fast a team walks through the ship, metres per minute (the reserve is in the middle). A transfer = MusterTime + the walk, rounded to 10 s. 0 = no walking time; with MusterTime 0 too, teams move at once and Auto DC is the game's.
how_fast_damage_control_teams_pump_water.daadca = How fast damage control teams pump water out. 1.0 = as in the game.
how_fast_damage_control_teams_put_fires.5d5eaf = How fast damage control teams put fires out. 1.0 = as in the game.
how_fast_fires_grow_by_themselves_betwee.e757ca = How fast fires grow by themselves, between hits. 1.0 = as in the game, 2.0 = twice as fast, 0.5 = half as fast.
how_fast_water_comes_in_through_the_hole.cad705 = How fast water comes in through the holes of a compartment. 1.0 = as in the game.
how_many_times_stronger_the_hull_of_civi.706453 = How many times stronger the hull of civilian ships (ini files civ_*) is than in the game. 1.0 = as in the game.
how_many_times_stronger_the_hull_of_subm.d3d1a9 = How many times stronger the hull of submarines is than in the game. 1.0 = as in the game.
how_many_times_stronger_the_hull_of_surf.32130e = How many times stronger the hull of surface warships is than in the game. 1.0 = as in the game, 2.0 = twice as strong. Single ships get their own value in section [HullIntegrityPerShip], one line per ship: ini file name = multiplier (e.g. usn_bb_iowa = 3.0).
how_much_one_team_gets_done_plugging_fir.8ecb35 = How much one team gets done (plugging, fire fighting, pumping, hull and system repairs) compared with the game. 1.0 = as in the game.
how_strongly_the_list_follows_uneven_flo.541fe4 = How strongly the list follows uneven flooding. The difference in water between a section's port and starboard sides (which heels the ship) is multiplied by this; the section's average is kept, so the draught and the trim do not change from it. 1 = as in the game, 2 = twice the heel from the same difference.
how_the_ship_s_speed_changes_the_growth.6d2cf6 = How the ship's speed changes the growth of fires and the water coming in (through holes and over the deck edge): knots=flooding/fire multiplier, a broken line through the points. The speed is taken as an absolute value; below the first point and above the last the end multipliers hold.
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = Language of the mod's texts: en, ru, cn, de, es, fr, ko, ja or vn. Empty = the language of the game. The texts are in the lang folder of the mod (lang/<code>.ini); a missing text is shown in English.
list_degrees_the_full_scale_of_the_list.a220dc = List, degrees: the full scale of the LIST gauge. From its red zone (75% of it) water comes over the deck edge and floods every compartment of the low side fast (game: at 45). It does not sink the ship by itself; capsizing at 70 degrees does, as in the game.
metres_the_trim_limit_depends_on_the_shi.be80af = Metres. The trim limit depends on the ship's length: the longer the ship, the sooner its bow or stern goes under at the same angle (tan limit = tan TrimLimit x (TrimReferenceLength / length)^0.442; with 5.2 at 100: 30 m 8.8, 60 m 6.5, 150 m 4.4, 300 m 3.2 degrees). 0 = TrimLimit for every ship (as in the game).
minutes_of_work_in_a_section_until_a_tea.abe7fb = Minutes of work in a section until a team is tired (first level); its speed falls as set by the Speed settings. The reserve takes fatigue away as fast as work builds it up. Shown in the team's hint; a tired team's icon is highlighted. 0 = no fatigue.
minutes_of_work_until_a_team_is_exhauste.461264 = Minutes of work until a team is exhausted, the second level of fatigue (at most: fatigue stops growing there). Not above 'Tired after' = no second level.
multiplier_of_the_chance_that_a_hit_woun.6766c6 = Multiplier of the chance that a hit wounds a team (0.5 = half as likely, 2 = twice; the result is at most 100%). Step 1 (only while Wounds at any hull integrity is off) - the game decides whether a hit takes a team out of its section at all (only a hit section with integrity under 50%: damage x (1 - integrity), at most 20%). Step 2 - the mod decides the wound: the chance grows steeply with the warhead power (about power^1.8) and falls with the team's health (about health^1.2) - warhead 2.2 against health 2: about 10%, against 100: 0.1%; warhead 82 against 100: about 75%; far above that over 100%. It is multiplied by this multiplier, then limited to 100% (with Wounds at any hull integrity off a team that was not wounded still leaves the section). A stronger warhead raises the chance. A bigger ship lowers it: its teams are tougher (more health), and its compartments are bigger, so a hit is less likely to land where the team is. Even the weakest hit has a small chance. Example, warhead 25: against 12 health about 100%, against 29 about 37%, against 100 about 9%. 0 = never wounded.
multiplier_of_the_strength_of_a_wound_at.119bcb = Multiplier of the strength of a wound: at most the warhead power of the ammunition (0..196, half of the game's ammunition under 25) x this, in points of the team's health (1..100 by displacement). A wounded team walks to the reserve.
random_spread_of_the_concussion_time_sec.c54f69 = Random spread of the concussion time, seconds either way: HealTime 90 with 30 = 60 to 120 s, as in the game. 0 = always HealTime.
resistance_to_the_horizontal_movement_of.dc8036 = Resistance to the HORIZONTAL movement of a destroyed ship, times the game's linear drag (25 for nearly every ship): the wreck loses its way sooner. 1 = as in the game. Sinking (vertical movement) and turning (capsizing) are not slowed.
seconds_game_time_so_time_compression_co.551b95 = Seconds (game time, so time compression counts) a compartment's deck point must stay under the sea in a row before water over the deck starts to come in (see DeckFloodingSpeed). A surfacing point resets the timer. Default 3.
seconds_a_team_needs_to_get_ready_before.3b6e27 = Seconds a team needs to get ready before every transfer. Cancelling a transfer while it is still getting ready costs no time.
settings_profile_in_use_chosen_in_the_ga.331d79 = Settings profile in use, chosen in the game: Unit Status -> Damage Control -> the gear next to (i). This file holds only the general settings ([General], [UI]); the damage model's values are in the profile's file: built-in ones in the Profiles folder of the mod (read-only), your own in StreamingAssets/user/AlternativeDamageControl/Profiles. Changing a built-in profile in the game saves it as Custom. Edits to the file of the profile in use, or to this name, are picked up while the game runs.
ships_ini_file_names_comma_separated_edi.c5b815 = Ships (ini file names, comma separated; edited in the settings window, Flooding tab) that get no Deck Points: they are flooded by the old, simpler rules, as a ship without a hull collider.
team_fatigue_on_working_builds_it_up_the.e170b3 = Team fatigue on: working builds it up, the reserve takes it away, a tired team works at half speed. Off = no fatigue; its settings are hidden.
team_health_on_wounds_from_hits_and_fire.0440b7 = Team health on: wounds from hits and fires, recovery in the reserve, wounded teams work slower. Off = the game's rules (a hit takes a team out for a while, no wounds); the other health settings are hidden.
the_detailed_view_of_unit_status_damage.b04888 = The detailed view of Unit Status -> Damage Control (the mod's display): hull integrity per side next to each section's name, an icon per damage control team (its task; tasks and moves by hand when Auto DC is off), water and fire in % with trend arrows, DC Priority, the team cards, the LIST / TRIM / LEVEL gauges with the flooding plan, tooltips, the (i) legend. Off: the game's own view (the gear of the settings window stays).
the_mod_s_damage_model_and_damage_contro.b3b07a = The mod's damage model and damage control: hull and systems strength, side effects, fire and flooding speeds, fire spread, damage control teams (numbers, effectiveness, walking transfers, knock-outs, the optimised Auto DC, moving single teams), list / trim / sinking limits. DC Priority and tasks given by hand belong to the detailed view and stay. Off: the game's own damage and damage control (the Damage Control tab view stays). Can be switched at any time: ships at sea follow at once (hull strength and team numbers back to the game's or the mod's; teams on the move arrive, knocked-out ones recover).
the_teams_rest_in_the_central_compartmen.4ac676 = The teams rest in the central compartment: a hit on it can wound a team waiting in the reserve (the chance is the game's for a team knocked out in a hit section: damage x (1 - integrity), only under 50% integrity). A wounded resting team stays in the reserve.
trim_degrees_for_a_ship_trimreferencelen.8ab413 = Trim, degrees, for a ship TrimReferenceLength long: the full scale of the TRIM gauge. From its red zone (75% of it) the end that goes down floods fast: on each side its outermost compartment, when that is full the next one, and so on. The ship does not sink at once, as it does in the game (8 degrees with a flooded section).
unattended_fire_how_much_the_growth_rate.84fa6e = Unattended fire: how much the growth rate rises every fire check, in % of the fire's maximum growth rate (an ordinary hit adds 0.1-0.8%).
unattended_fire_its_growth_rate_is_raise.b4969b = Unattended fire: its growth rate is raised only up to this, in % of the fire's maximum a second.
unattended_fire_seconds_without_a_team_f.098d15 = Unattended fire: seconds without a team fighting the fire (from the time it started, or the last time a team fought it) before it starts to grow faster.
vulnerability_of_the_hull_to_flooding_th.35677a = Vulnerability of the hull to flooding through holes made by hits (all weapon types). 1.0 = each hole lets in as much water as in the game, and holes above the waterline start leaking after the same damage as in the game (the stronger hull does not hold the water back). 2.0 = twice as much water; 0.5 = half.
vulnerability_of_the_hull_to_gun_shells.c70d65 = Vulnerability of the hull to gun shells (missiles, torpedoes and bombs are not affected). Gun shells take a share of a ship's sinking limit that depends on the size of the hull. 1.0 = each shell takes as much as in the game; the stronger hull just survives more hits. 2.0 = shells hit as if the hull were half as big; 0.5 = as if it were twice as big (medium shells may stop hurting big ships).
vulnerability_of_the_ship_to_fires_start.50481c = Vulnerability of the ship to fires started by hits (all weapon types). The stronger hull also holds fires back in the same proportion: with Warships = 5.0 a hit starts a fire 5 times weaker (relative to the compartment) than in the game. 1.0 = this normal behaviour of the mod. 2.0 = fires twice as strong and grow twice as fast; 0.5 = half as strong. 1.0 with every hull multiplier 1.0 = as in the game.
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = Water in a section limits its fire: it cannot be stronger than (100 - the section's water %) of the maximum. A stronger fire falls to that limit at this % of the maximum per second. 0 = off.
water_in_the_whole_ship_the_average_of_i.a5b547 = Water in the whole ship, % (the average of its compartments), from which it sinks, as in the game (game: 40; submarines keep the game's 50). Also the full scale of the LEVEL gauge.
water_over_the_deck_edge_a_multiplier_fo.512690 = Water over the deck edge, a multiplier. For ships whose deck points are known (the full hull-collider algorithm): when a compartment's deck point has been under the sea for DeckFloodingDelay seconds in a row (game time, so time compression counts), the compartment takes on water that damage control cannot stop - 1.0 = 0.1% of its volume per second per metre of submersion (deeper = faster); a full compartment passes the water to the lowest-lying not-full neighbour, and on along the chain. For other ships: how fast the end that goes down (from trim past its limit) or the low side (from list past its limit) takes on water over the deck edge - the mod's own mechanic, not in the game. 2.0 = twice as fast, 0.5 = half, 0 = off.
when_a_ship_starts_to_sink_the_game_puts.562c7b = When a ship starts to sink the game puts its centre of mass at the hull origin ((0, 1, 0) if it has capsized): the centre of mass jumps, and with it every torque on the hull. On = the centre of mass stays where it was. Off = as in the game.
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = While a team plugs the holes of a compartment (the Flooding Rate task) it pumps water out of it at the same time: this share of the pumping out speed (0.5 = half, 0 = off). A team ordered to counterflood pumps only from the side where that does not worsen the list and trim.
work_speed_of_a_rested_team_the_starting.1e64b0 = Work speed of a rested team, % (the starting point of the fatigue curve). The speed falls in a straight line from here to the tired level.
work_speed_of_a_team_that_has_just_becom.425925 = Work speed of a team that has just become tired, %. Between the tired and the exhausted level the speed falls in a straight line.
work_speed_of_an_exhausted_team_it_stays.4cfc9a = Work speed of an exhausted team, %; it stays there while the team keeps working.
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = Writes a line to the BepInEx log for every ship that enters a mission: its hull integrity in the game and with the mod.
