; Alternative Damage Model - texts, language: es
; key = text   (\n = line break; keep {0} {1} ...)
; Machine translation, not checked by a native speaker: corrections are welcome.

a_burning_section_opens_its_plugged_leak.20b488 = Una sección en llamas reabre sus vías de agua taponadas: % de la mayor vía de agua de la sección por segundo con fuego al 100% (menos con un fuego menor). 0 = desactivado.
a_fire_does_not_spread_into_a_compartmen.6e664b = Un fuego no se propaga a un compartimento donde hay un equipo de control de averías (lo detiene en la puerta). Desactivado = como en el juego.
a_fire_no_damage_control_team_has_fought.5e3fa0 = Un fuego que ningún equipo de control de averías combate durante un tiempo crece cada vez más rápido: en cada comprobación de fuego (FireCheckTime, 10 s) su ritmo de crecimiento sube como si la sección fuera alcanzada de nuevo. Desactivado = como en el juego (un fuego solo crece por impactos).
a_fully_flooded_section_water_above_75_i.aaedbd = Una sección totalmente inundada (agua por encima del 75%): sus sistemas pasan a daño grave, quedan inoperativos y no pueden repararse mientras siga inundada.
a_hit_on_a_compartment_that_is_already_d.364c92 = Un impacto en un compartimento ya destruido no se pierde: la mitad del daño pasa al compartimento vecino (del mismo lado, hacia el centro del barco); si también está destruido, un cuarto pasa al siguiente. El excedente de un impacto que destruye un compartimento se reparte igual.
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = Un impacto en una sección puede herir a sus equipos con cualquier integridad. Desactivado = como en el juego: solo una sección alcanzada con integridad inferior al 50% puede dejar fuera a un equipo, con probabilidad daño x (1 - integridad), como máximo 20%. Activado = cada impacto en una sección con equipos recibe la tirada de herida (véase Wound chance); un equipo herido va a la reserva.
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = Una vía de agua reabierta por el fuego vuelve a crecer hasta este % de la mayor vía de agua que ha tenido la sección.
a_section_under_the_sea_puts_its_fire_ou.3d1565 = Una sección bajo el mar apaga su fuego: el fuego pierde este % de su máximo por segundo por cada metro que el borde de cubierta de la sección esté bajo el agua (1 = tantos % por segundo como metros). Solo cuando los dos puntos de cubierta de la sección (babor y estribor) están bajo el agua; la profundidad es la media de ambos. Necesita los puntos de cubierta del barco (como la inundación por cubierta). 0 = desactivado.
a_team_cannot_plug_holes_while_the_ship.f5f08f = Un equipo no puede taponar agujeros mientras el barco vaya más rápido que esto, en nudos. 0 = sin límite.
a_team_in_a_burning_section_loses_this_m.ecb388 = Un equipo en una sección en llamas pierde esta parte de su salud completa por segundo con fuego al 100%, salvo que al menos un equipo de la sección combata el fuego (menos con un fuego menor).
a_team_in_the_reserve_recovers_this_much.2dd530 = Un equipo en la reserva recupera esta parte de su salud completa por segundo.
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = Los barcos de la IA (no los propios) de menos de 50 m no se frenan por la inundación: el recorte de velocidad del juego por agujeros y agua está desactivado para ellos (siguen adelante, como kamikazes). El botón «Limit Speed» de tus barcos es aparte.
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = Probabilidad de que un fuego grave (desde el 50% de su máximo) se propague a las secciones vecinas, en % por comprobación de fuego: el juego comprueba cada FireCheckTime (10 s) con una probabilidad del 0,0133% - casi nunca. 0.0133 = como en el juego; 1.0 = 1% por comprobación (una vez cada 17 minutos de fuego grave), 0 = nunca.
colours_the_weapon_buttons_of_the_select.a41d7b = Colorea los botones de armas del panel inferior de la unidad seleccionada según el estado de sus sistemas de armas: todo funciona - color del juego, parte de ese tipo inoperativa - amarillo, todo inoperativo - rojo.
concussion_a_team_wounded_by_a_weapon_a.2d37ab = Conmoción: un equipo herido por un arma (en una sección alcanzada o en la reserva) queda conmocionado estos segundos después de estar en la reserva; Auto DC no lo devuelve al trabajo hasta que pase la conmoción. Corre junto a la salud del equipo, que tiene su propia recuperación. 0 = sin conmoción.
counterflooding_lets_water_into_one_side.8d3f44 = La contrainundación deja entrar agua en un lado de un compartimento solo hasta este % (el límite propio del compartimento en el juego también se aplica).
damage_control_efficiency_while_the_ship.d761c8 = Eficacia del control de averías mientras el motor del barco (el módulo Engine en uso, no la propulsión) está fuera de servicio: eficacia de los equipos en % (fuegos, vías de agua, agua, casco; la reparación de sistemas no se ve afectada). Se muestra en las pistas de los equipos y en la línea Forecast de la pestaña Damage Control. 100 = desactivado.
damage_control_teams_in_a_section_with_a.e2dc23 = Los equipos de control de averías en una sección con fuego que no lo combaten trabajan a este % de su eficacia. 100 = desactivado.
damage_control_teams_of_a_civilian_ship.630d69 = Equipos de control de averías de un barco civil por desplazamiento: toneladas=equipos.
damage_control_teams_of_a_submarine_by_d.556a4a = Equipos de control de averías de un submarino por desplazamiento: toneladas=equipos.
damage_control_teams_of_a_surface_warshi.2960b3 = Equipos de control de averías de un buque de guerra de superficie por desplazamiento: toneladas=equipos, desde esas toneladas. NumberOfDCTeams en el ini de un barco sigue fijando su propio número.
debug_draws_the_selected_ship_s_hull_onl.f6f266 = Depuración: dibuja los colliders solo del casco (coll_hull*) del barco seleccionado como una superposición translúcida más una malla brillante de sus triángulos reales, para compararlos directamente con el modelo 3D visible.
debug_for_the_ship_currently_selected_in.50880e = Depuración: para el barco seleccionado en el panel Unit Status, dibuja una línea desde la ola actual hasta la altura estimada de cubierta en la línea central de proa y popa del casco, y en un par babor/estribor por sección del modelo de daños (su propio punto central en la eslora) - solo colliders del casco, no torretas, mástiles ni otros submodelos. Verde: el punto queda por encima de la ola; rojo: la ola lo cubre.
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = Depuración: cómo se dibuja el modelo 3D del barco seleccionado (submodelos incluidos), para ver ShowDeckCorners/ShowHullCollider: Show (como en el juego), Translucent (70% transparente) o Hide.
diagnostics_while_a_ship_lists_or_trims.7ab078 = Diagnóstico: mientras un barco escora o cabecea de forma notable, escribe en el log de BepInEx cada 2 segundos: escora, asiento, altura, flotabilidad frente a peso, volumen sumergido, agua en el barco y si se hunde / ha volcado.
diagnostics_writes_every_fire_started_by.c267ad = Diagnóstico: escribe en el log de BepInEx cada fuego iniciado por un impacto y cada cambio de etapa de un fuego (barco, compartimento, tiempo de misión, gravedad y crecimiento en % del máximo del compartimento, equipos de control de averías allí). Funciona también con el mod desactivado en el menú Mods, para comparar con el juego.
enables_verbose_logging_and_bepinex_alte.5d311f = Activa el registro detallado y BepInEx/AlternativeDamageModel.trace.txt.
fire_row_one_arrow_when_the_fire_changes.2c03b0 = Fila de fuego: una flecha cuando el fuego cambia más rápido que esto, en % de su máximo por segundo.
fire_row_two_arrows_down_when_the_fire_i.cfce19 = Fila de fuego: dos flechas hacia abajo cuando el fuego se apaga más rápido que esto, en % de su máximo por segundo.
fire_row_two_arrows_up_when_the_fire_gro.8de955 = Fila de fuego: dos flechas hacia arriba cuando el fuego crece más rápido que esto, en % de su máximo por segundo.
fixes_an_error_of_the_game_itself_above.638bbb = Corrige un error del propio juego: por encima de 10x de compresión de tiempo, el asiento de un barco crece con la compresión (una lancha de 25 m a 47 nudos: 2,6 grados hasta 10x, 9 a 100x), suficiente para hundir un barco corto, rápido e ileso. El juego mueve un barco un paso por tick de física, y por encima de 10x ese paso se estira mientras el par de flotabilidad se toma respecto al centro de masas de antes del paso. Activado: ese paso extra se omite, de modo que el asiento se queda como a 10x con cualquier compresión; hasta 10x no cambia nada. Solo barcos de superficie. Desactivado: el comportamiento del juego.
flooding_row_and_flooding_plan_one_arrow.802936 = Fila de inundación y plan de inundación: una flecha cuando el nivel de agua cambia más rápido que esto, en % del compartimento por segundo.
flooding_row_and_flooding_plan_two_arrow.129e17 = Fila de inundación y plan de inundación: dos flechas cuando el nivel de agua cambia más rápido que esto, en % del compartimento por segundo.
four_small_icons_under_a_ship_s_icon_on.001776 = Cuatro iconos pequeños bajo el icono de un barco en el mapa (también el tuyo): fuego (la fuerza total de los fuegos), agua, casco (clasificado como en el panel Damage Control) y motor; amarillo / naranja / rojo según la gravedad, y un icono de mapa más gris cuando el barco va a hundirse (en 20 minutos según la tendencia de inundación / casco). Un contacto: fuego, agua, casco y motor solo a la vista directa; por sonar - solo el motor (amarillo: parte perdida, rojo: nada funciona); por radar - una estimación para un barco alcanzado en los últimos 10 minutos, marcada con '?' (amarillo: 10 nudos o menos, rojo: menos de 3); nada por ESM o sin contacto, y nada para un barco hundido. La línea Fires de la pestaña Damage Control usa la misma fuerza total. El Unit Status de un contacto muestra una pestaña Damage State con la misma información en palabras.
health_of_a_damage_control_team_a_multip.330f74 = Salud de un equipo de control de averías, un multiplicador de su máximo, que es de 1..100 puntos según el desplazamiento del barco (100 = tripulación de 1000 o más, unas 100000 t; 1000 t = 10, 10000 t = 32). Se muestra en la pista del equipo como parte del total. Un equipo a 0 está muerto. Los equipos heridos trabajan más despacio (tanto como su salud, no menos del 25%). 0 = los equipos nunca resultan heridos (un impacto aún saca a un equipo de su sección).
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = Con qué rapidez un fuego devora el casco de su sección (integridad de sus dos compartimentos). 1.0 = como en el juego. El daño a los sistemas de la sección no cambia.
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = Con qué rapidez un equipo en la reserva se libra de la fatiga, % de la velocidad con que se acumula trabajando. 100 = igual de rápido; 50 = el descanso dura el doble que el trabajo.
how_fast_a_team_walks_through_the_ship_m.440ac9 = Con qué rapidez camina un equipo por el barco, metros por minuto (la reserva está en el centro). Un traslado = MusterTime + el camino, redondeado a 10 s. 0 = sin tiempo de camino; con MusterTime también 0, los equipos se mueven al instante y Auto DC es el del juego.
how_fast_damage_control_teams_pump_water.daadca = Con qué rapidez los equipos de control de averías achican agua. 1.0 = como en el juego.
how_fast_damage_control_teams_put_fires.5d5eaf = Con qué rapidez los equipos de control de averías apagan fuegos. 1.0 = como en el juego.
how_fast_fires_grow_by_themselves_betwee.e757ca = Con qué rapidez crecen los fuegos por sí solos, entre impactos. 1.0 = como en el juego, 2.0 = el doble de rápido, 0.5 = la mitad.
how_fast_water_comes_in_through_the_hole.cad705 = Con qué rapidez entra agua por los agujeros de un compartimento. 1.0 = como en el juego.
how_many_times_stronger_the_hull_of_civi.706453 = Cuántas veces más fuerte es el casco de los barcos civiles (archivos ini civ_*) que en el juego. 1.0 = como en el juego.
how_many_times_stronger_the_hull_of_subm.d3d1a9 = Cuántas veces más fuerte es el casco de los submarinos que en el juego. 1.0 = como en el juego.
how_many_times_stronger_the_hull_of_surf.32130e = Cuántas veces más fuerte es el casco de los buques de guerra de superficie que en el juego. 1.0 = como en el juego, 2.0 = el doble de fuerte. Los barcos individuales reciben su propio valor en la sección [HullIntegrityPerShip], una línea por barco: nombre del archivo ini = multiplicador (p. ej. usn_bb_iowa = 3.0).
how_much_one_team_gets_done_plugging_fir.8ecb35 = Cuánto hace un equipo (taponar, combatir fuego, achicar, reparar casco y sistemas) en comparación con el juego. 1.0 = como en el juego.
how_strongly_the_list_follows_uneven_flo.541fe4 = Cuánto sigue la escora a la inundación desigual. La diferencia de agua entre babor y estribor de una sección (que escora el barco) se multiplica por esto; se mantiene la media de la sección, de modo que el calado y el asiento no cambian por ello. 1 = como en el juego, 2 = el doble de escora con la misma diferencia.
how_the_ship_s_speed_changes_the_growth.6d2cf6 = Cómo la velocidad del barco cambia el crecimiento de los fuegos y el agua que entra (por agujeros y por el borde de cubierta): nudos=multiplicador de inundación/fuego, una línea quebrada por los puntos. La velocidad se toma en valor absoluto; por debajo del primer punto y por encima del último valen los multiplicadores de los extremos.
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = Idioma de los textos del mod: en, ru, cn, de, es, fr, ko, ja o vn. Vacío = el idioma del juego. Los textos están en la carpeta lang del mod (lang/<código>.ini); un texto que falta se muestra en inglés.
list_degrees_the_full_scale_of_the_list.a220dc = Escora, grados: la escala completa del indicador LIST. Desde su zona roja (75%) el agua pasa por el borde de cubierta e inunda rápido todos los compartimentos del lado bajo (juego: a 45). No hunde el barco por sí sola; el vuelco a 70 grados sí, como en el juego.
metres_the_trim_limit_depends_on_the_shi.be80af = Metros. El límite de asiento depende de la eslora: cuanto más largo el barco, antes se hunde la proa o la popa con el mismo ángulo (tan límite = tan TrimLimit x (TrimReferenceLength / eslora)^0.442; con 5.2 a 100: 30 m 8.8, 60 m 6.5, 150 m 4.4, 300 m 3.2 grados). 0 = TrimLimit para todos los barcos (como en el juego).
minutes_of_work_in_a_section_until_a_tea.abe7fb = Minutos de trabajo en una sección hasta que un equipo se cansa (primer nivel); su velocidad cae según los ajustes Speed. La reserva quita la fatiga tan rápido como el trabajo la acumula. Se muestra en la pista del equipo; el icono de un equipo cansado se resalta. 0 = sin fatiga.
minutes_of_work_until_a_team_is_exhauste.461264 = Minutos de trabajo hasta que un equipo se agota, el segundo nivel de fatiga (como máximo: la fatiga deja de crecer ahí). No más que «Tired after» = sin segundo nivel.
multiplier_of_the_chance_that_a_hit_woun.6766c6 = Multiplicador de la probabilidad de que un impacto hiera a un equipo (0.5 = la mitad de probable, 2 = el doble; el resultado es como máximo 100%). Paso 1 (solo mientras Wounds at any hull integrity esté desactivado) - el juego decide si un impacto saca a un equipo de su sección (solo una sección alcanzada con integridad inferior al 50%: daño x (1 - integridad), como máximo 20%). Paso 2 - el mod decide la herida: la probabilidad crece mucho con la potencia de la cabeza de guerra (aprox. potencia^1.8) y cae con la salud del equipo (aprox. salud^1.2) - cabeza 2.2 contra salud 2: cerca del 10%, contra 100: 0,1%; cabeza 82 contra 100: cerca del 75%; muy por encima, más del 100%. Se multiplica por este multiplicador y se limita a 100% (con Wounds at any hull integrity desactivado, un equipo no herido igualmente deja la sección). Una cabeza más potente sube la probabilidad. Un barco mayor la baja: sus equipos son más duros (más salud) y sus compartimentos mayores, así que un impacto cae con menos probabilidad donde está el equipo. Incluso el impacto más débil tiene una pequeña probabilidad. Ejemplo, cabeza 25: contra salud 12 cerca del 100%, contra 29 cerca del 37%, contra 100 cerca del 9%. 0 = nunca heridos.
multiplier_of_the_strength_of_a_wound_at.119bcb = Multiplicador de la fuerza de una herida: como máximo la potencia de la cabeza de guerra de la munición (0..196, la mitad de la munición del juego por debajo de 25) x esto, en puntos de la salud del equipo (1..100 según desplazamiento). Un equipo herido va a la reserva.
random_spread_of_the_concussion_time_sec.c54f69 = Dispersión aleatoria del tiempo de conmoción, segundos en cada sentido: HealTime 90 con 30 = de 60 a 120 s, como en el juego. 0 = siempre HealTime.
resistance_to_the_horizontal_movement_of.dc8036 = Resistencia al movimiento HORIZONTAL de un barco destruido, multiplicando la resistencia lineal del juego (25 para casi todos los barcos): el naufragio pierde antes el rumbo. 1 = como en el juego. El hundimiento (movimiento vertical) y el giro (vuelco) no se frenan.
seconds_game_time_so_time_compression_co.551b95 = Segundos (tiempo de juego, la compresión cuenta) que el punto de cubierta de un compartimento debe seguir bajo el mar seguidos antes de que empiece a entrar agua por la cubierta (véase DeckFloodingSpeed). Un punto que emerge reinicia el temporizador. Por defecto 3.
seconds_a_team_needs_to_get_ready_before.3b6e27 = Segundos que un equipo necesita para prepararse antes de cada traslado. Cancelar un traslado mientras aún se prepara no cuesta tiempo.
settings_profile_in_use_chosen_in_the_ga.331d79 = Perfil de ajustes en uso, elegido en el juego: Unit Status -> Damage Control -> el engranaje junto a (i). Este archivo contiene solo los ajustes generales ([General], [UI]); los valores del modelo de daños están en el archivo del perfil: los integrados en la carpeta Profiles del mod (solo lectura), los tuyos en StreamingAssets/user/AlternativeDamageControl/Profiles. Cambiar un perfil integrado en el juego lo guarda como Custom. Los cambios en el archivo del perfil en uso, o en este nombre, se recogen mientras el juego se ejecuta.
ships_ini_file_names_comma_separated_edi.c5b815 = Barcos (nombres de archivos ini, separados por comas; se editan en la ventana de ajustes, pestaña Flooding) que no reciben Deck Points: se inundan con las reglas antiguas, más simples, como un barco sin collider de casco.
team_fatigue_on_working_builds_it_up_the.e170b3 = Fatiga de equipos activada: trabajar la acumula, la reserva la quita, un equipo cansado trabaja a media velocidad. Desactivado = sin fatiga; sus ajustes se ocultan.
team_health_on_wounds_from_hits_and_fire.0440b7 = Salud de equipos activada: heridas por impactos y fuegos, recuperación en la reserva, los equipos heridos trabajan más despacio. Desactivado = reglas del juego (un impacto deja fuera a un equipo un tiempo, sin heridas); los demás ajustes de salud se ocultan.
the_detailed_view_of_unit_status_damage.b04888 = La vista detallada de Unit Status -> Damage Control (la pantalla del mod): integridad del casco por lado junto al nombre de cada sección, un icono por equipo de control de averías (su tarea; tareas y movimientos a mano con Auto DC desactivado), agua y fuego en % con flechas de tendencia, DC Priority, las tarjetas de equipo, los indicadores LIST / TRIM / LEVEL con el plan de inundación, pistas, la leyenda (i). Desactivado: la vista propia del juego (el engranaje de la ventana de ajustes permanece).
the_mod_s_damage_model_and_damage_contro.b3b07a = El modelo de daños y el control de averías del mod: resistencia del casco y de los sistemas, efectos secundarios, velocidades de fuego e inundación, propagación del fuego, equipos de control de averías (números, eficacia, traslados a pie, bajas, el Auto DC optimizado, mover equipos sueltos), límites de escora / asiento / hundimiento. DC Priority y las tareas dadas a mano pertenecen a la vista detallada y permanecen. Desactivado: el daño y el control de averías propios del juego (la vista de la pestaña Damage Control permanece). Se puede cambiar en cualquier momento: los barcos en el mar lo siguen al instante (resistencia del casco y número de equipos vuelven a los del juego o del mod; los equipos en marcha llegan, los que estaban fuera se recuperan).
the_teams_rest_in_the_central_compartmen.4ac676 = Los equipos descansan en el compartimento central: un impacto en él puede herir a un equipo que espera en la reserva (la probabilidad es la del juego para un equipo dejado fuera en una sección alcanzada: daño x (1 - integridad), solo con integridad inferior al 50%). Un equipo herido en reposo se queda en la reserva.
trim_degrees_for_a_ship_trimreferencelen.8ab413 = Asiento, grados, para un barco de TrimReferenceLength de eslora: la escala completa del indicador TRIM. Desde su zona roja (75%) el extremo que se hunde se inunda rápido: en cada lado su compartimento más externo, cuando está lleno el siguiente, y así. El barco no se hunde de inmediato, a diferencia del juego (8 grados con una sección inundada).
unattended_fire_how_much_the_growth_rate.84fa6e = Fuego desatendido: cuánto sube el ritmo de crecimiento en cada comprobación de fuego, en % del ritmo máximo de crecimiento del fuego (un impacto normal añade 0,1-0,8%).
unattended_fire_its_growth_rate_is_raise.b4969b = Fuego desatendido: su ritmo de crecimiento solo se eleva hasta esto, en % del máximo del fuego por segundo.
unattended_fire_seconds_without_a_team_f.098d15 = Fuego desatendido: segundos sin equipo que combata el fuego (desde que empezó o la última vez que un equipo lo combatió) antes de que empiece a crecer más rápido.
vulnerability_of_the_hull_to_flooding_th.35677a = Vulnerabilidad del casco a la inundación por agujeros hechos por impactos (todos los tipos de arma). 1.0 = cada agujero deja entrar tanta agua como en el juego, y los agujeros sobre la línea de flotación empiezan a gotear tras el mismo daño que en el juego (el casco más fuerte no frena el agua). 2.0 = el doble de agua; 0.5 = la mitad.
vulnerability_of_the_hull_to_gun_shells.c70d65 = Vulnerabilidad del casco a los proyectiles de cañón (misiles, torpedos y bombas no se ven afectados). Los proyectiles de cañón se llevan una parte del límite de hundimiento de un barco que depende del tamaño del casco. 1.0 = cada proyectil se lleva tanto como en el juego; el casco más fuerte simplemente sobrevive a más impactos. 2.0 = los proyectiles golpean como si el casco fuera la mitad de grande; 0.5 = como si fuera el doble (los proyectiles medios pueden dejar de dañar a barcos grandes).
vulnerability_of_the_ship_to_fires_start.50481c = Vulnerabilidad del barco a los fuegos iniciados por impactos (todos los tipos de arma). El casco más fuerte también frena los fuegos en la misma proporción: con Warships = 5.0 un impacto inicia un fuego 5 veces más débil (relativo al compartimento) que en el juego. 1.0 = este comportamiento normal del mod. 2.0 = fuegos el doble de fuertes que crecen el doble de rápido; 0.5 = la mitad de fuertes. 1.0 con todos los multiplicadores de casco 1.0 = como en el juego.
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = El agua en una sección limita su fuego: no puede ser más fuerte que (100 - % de agua de la sección) del máximo. Un fuego más fuerte baja a ese límite a este % del máximo por segundo. 0 = desactivado.
water_in_the_whole_ship_the_average_of_i.a5b547 = Agua en todo el barco, % (la media de sus compartimentos), a partir de la cual se hunde, como en el juego (juego: 40; los submarinos mantienen los 50 del juego). También la escala completa del indicador LEVEL.
water_over_the_deck_edge_a_multiplier_fo.512690 = Agua por el borde de cubierta, un multiplicador. Para barcos con puntos de cubierta conocidos (el algoritmo completo de collider de casco): cuando el punto de cubierta de un compartimento ha estado bajo el mar DeckFloodingDelay segundos seguidos (tiempo de juego, la compresión cuenta), el compartimento recibe agua que el control de averías no puede detener - 1.0 = 0,1% de su volumen por segundo por metro de inmersión (más hondo = más rápido); un compartimento lleno pasa el agua al vecino no lleno más bajo, y sigue por la cadena. Para otros barcos: con qué rapidez el extremo que se hunde (por asiento más allá de su límite) o el lado bajo (por escora más allá de su límite) recibe agua por el borde de cubierta - mecánica propia del mod, no del juego. 2.0 = el doble de rápido, 0.5 = la mitad, 0 = desactivado.
when_a_ship_starts_to_sink_the_game_puts.562c7b = Cuando un barco empieza a hundirse, el juego pone su centro de masas en el origen del casco ((0, 1, 0) si ha volcado): el centro de masas salta, y con él todo par sobre el casco. Activado = el centro de masas se queda donde estaba. Desactivado = como en el juego.
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = Mientras un equipo tapona los agujeros de un compartimento (la tarea Flooding Rate), a la vez achica agua de él: esta parte de la velocidad de achique (0.5 = la mitad, 0 = desactivado). Un equipo ordenado a contrainundar achica solo del lado donde eso no empeora la escora ni el asiento.
work_speed_of_a_rested_team_the_starting.1e64b0 = Velocidad de trabajo de un equipo descansado, % (el punto de partida de la curva de fatiga). La velocidad cae en línea recta desde aquí hasta el nivel de cansado.
work_speed_of_a_team_that_has_just_becom.425925 = Velocidad de trabajo de un equipo que acaba de cansarse, %. Entre los niveles de cansado y agotado la velocidad cae en línea recta.
work_speed_of_an_exhausted_team_it_stays.4cfc9a = Velocidad de trabajo de un equipo agotado, %; se queda ahí mientras el equipo siga trabajando.
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = Escribe una línea en el log de BepInEx por cada barco que entra en una misión: su integridad de casco en el juego y con el mod.
