the_hull_armour_classes_of_the_world_war.fbf596 = Las clases de blindaje del mod de la Segunda Guerra Mundial: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 y SuperHeavy (mayúsculas o minúsculas). El juego solo conoce none / minor / moderate / heavy y toma cualquier otra clase por none: entonces todos los proyectiles atraviesan el blindaje. Con esto las cinco clases funcionan para cascos y módulos (torres, santabárbaras, máquinas…), cada una situada entre las clases propias del juego en la matriz de penetración (de la más dura: SuperHeavy, heavy, BattleCruiser2, BattleCruiser, HeavyCruiser, moderate, LightCruiser, minor); el blindaje de un casco aparece en la línea Hull del registro. También reciben la bonificación de integridad del casco del blindaje del juego (×1,2 minor, ×1,25 moderate, ×1,3 heavy) en pasos regulares intermedios: SuperHeavy ×1,3125, BattleCruiser2 ×1,2875, BattleCruiser ×1,275, HeavyCruiser ×1,2625, LightCruiser ×1,225. Un casco sin ArmorType en [General] lo toma de [TaskForce] (así están usn_bb_iowa45 y usn_bb_missouri2 del mod; el juego les daría minor).
