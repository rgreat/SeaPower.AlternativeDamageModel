vulnerability_of_the_ship_to_fires_start.ccbde4 = Vulnerabilidad del barco a los incendios provocados por impactos (todos los tipos de arma). 1.0 = un impacto provoca un incendio tan fuerte como en el juego (en % del compartimento); el casco más fuerte no contiene los incendios. 2.0 = incendios el doble de fuertes que crecen el doble de rápido; 0.5 = la mitad.
fires_from_gun_shells_stopped_by_the_mai.af6650 = Incendios por proyectiles detenidos por el blindaje principal. En el juego, un proyectil que no atraviesa el blindaje no provoca incendio en los compartimentos contiguos al del impacto. Con esta opción puede provocarlo igualmente (sin daño al casco ni inundación): la probabilidad del juego para un proyectil que atraviesa, multiplicada por este número. 0 = desactivado (como en el juego), 1 = la misma probabilidad que un proyectil que atraviesa, 0.4 = el 40 % de ella.
started_a_fire.21ffbf = provocó un incendio
fire_from_hits_stopped_by_armour.a54dd1 = Incendio por impactos detenidos por el blindaje
the_chance_of_a_shell_that_gets_through.d13878 = × probabilidad de un proyectil que atraviesa · 0 = desact.
the_starting_size_of_a_fire_that_a_gun_s.c848c4 = El tamaño inicial de un incendio provocado por un proyectil de cañón. En el juego el incendio de un proyectil empieza en cero y solo crece; una bomba o un misil le dan además un tamaño inicial (la mitad del daño / integridad del compartimento). Con esta opción el proyectil también da a su incendio ese tamaño, multiplicado por este número. 0 = desactivado (como en el juego), 1 = como bombas y misiles, 0.5 = la mitad. Los proyectiles incendiarios conservan el suyo.
fire_of_a_gun_shell_starting_size.939f3c = Incendio de un proyectil: tamaño inicial
