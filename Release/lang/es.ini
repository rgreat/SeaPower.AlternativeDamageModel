the_hull_armour_classes_of_the_world_war.c6c4c0 = Las clases de blindaje del mod de la Segunda Guerra Mundial: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 y SuperHeavy (mayúsculas o minúsculas). El juego solo conoce none / minor / moderate / heavy y toma cualquier otra clase por none: entonces todos los proyectiles atraviesan el blindaje. Con esto las cinco clases funcionan para cascos y módulos (torres, santabárbaras, máquinas…), cada una con la tabla de penetración del mod (damage.ini); el blindaje de un casco aparece en la línea Hull del registro. Un casco sin ArmorType en [General] lo toma de [TaskForce] (así están usn_bb_iowa45 y usn_bb_missouri2 del mod; el juego les daría minor).
the_hull_armour_classes_of_the_world_war.0ba238 = Las clases de blindaje del mod de la Segunda Guerra Mundial: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 y SuperHeavy (mayúsculas o minúsculas). El juego solo conoce none / minor / moderate / heavy y toma cualquier otra clase por none: entonces todos los proyectiles atraviesan el blindaje. Con esto las cinco clases funcionan para cascos y módulos (torres, santabárbaras, máquinas…), cada una situada entre las clases propias del juego en la matriz de penetración (de la más dura: SuperHeavy, heavy, BattleCruiser2, BattleCruiser, moderate = HeavyCruiser, LightCruiser, minor); el blindaje de un casco aparece en la línea Hull del registro. Un casco sin ArmorType en [General] lo toma de [TaskForce] (así están usn_bb_iowa45 y usn_bb_missouri2 del mod; el juego les daría minor).
