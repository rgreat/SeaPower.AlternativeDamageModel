damage_to_the_hull_from_a_collision_with.efa04c = Daño al casco por colisión con otro buque (el juego no lo tiene: los buques solo se empujan entre sí). Una colisión no es un solo golpe: una proa que embiste puede subirse al otro buque y deslizarse sobre él. El daño es la energía que la física va disipando, paso a paso, mientras los buques siguen en contacto (el golpe, el empuje, el roce; un buque que solo descansa sobre otro no pierde nada). Cada buque asume la parte que depende de las masas: el cuadrado de la velocidad por (m_other / (m_self + m_other))^2 por tonelada de su propio desplazamiento. 1.0 = dos buques iguales que chocan a 19 nudos arruinan cada uno aproximadamente 1,25 compartimentos; una lancha pequeña que embiste a un buque grande queda destruida y el buque solo arañado. El daño va a los compartimentos donde los buques se tocan en ese momento (el lugar y el costado de los puntos de contacto) y abre vías de agua como un impacto, que crecen con el daño recibido (un contacto sobre la línea de flotación solo filtra desde un compartimento medio destruido). 0 = desactivado.
