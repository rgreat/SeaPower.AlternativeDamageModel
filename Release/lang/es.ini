ships_that_collide_lose_speed_the_relati.034c35 = Los buques que chocan pierden velocidad: la velocidad relativa transversal al contacto se pierde casi toda (el buque ligero pierde más, el pesado apenas), a lo largo del contacto solo una parte (véase «Pérdida de velocidad por roce» y «Pérdida de velocidad por presión»). La física del juego no frena los buques, lo hace el mod. 1.0 = la pérdida completa de velocidad que da un golpe así, 0.5 = la mitad, 0 = los buques conservan su velocidad. Luego el buque vuelve a acelerar con sus máquinas.
