a_flooded_section_75_of_water_or_more_in.916292 = Una sección inundada (75 % de agua o más en uno de sus compartimentos, o 50 % o más en la sección en conjunto): sus sistemas pasan a daño grave, quedan inoperativos y no se pueden reparar mientras siga inundada.
