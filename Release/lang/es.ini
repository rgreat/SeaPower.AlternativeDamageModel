the_hull_armour_classes_of_the_world_war.c6a232 = Las clases de blindaje de casco del mod de la Segunda Guerra Mundial: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 y SuperHeavy (mayúsculas o minúsculas). El juego solo conoce none / minor / moderate / heavy y toma cualquier otra clase por none: entonces todos los proyectiles atraviesan el blindaje. Con esto las cinco clases funcionan, cada una con la tabla de penetración del mod (damage.ini); el blindaje de un casco aparece en la línea Hull del registro.
