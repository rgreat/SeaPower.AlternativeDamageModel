ships_that_collide_lose_speed_the_relati.a08a6f = Los buques que chocan pierden velocidad: la velocidad relativa transversal al contacto se pierde casi toda (el buque ligero pierde más, el pesado apenas), a lo largo del contacto solo una parte (véase «Frenado por roce» y «Frenado por presión»). La física del juego no frena los buques, lo hace el mod. Luego el buque vuelve a acelerar con sus máquinas. 0 = los buques conservan su velocidad.
added_to_scraping_speed_loss_in_proporti.85d194 = Se suma a «Pérdida de velocidad por roce» según cuánto se aprieten los buques (un espolonazo en el costado quita casi toda la velocidad de deslizamiento, un roce apenas nada).
collisions_affect_the_ships_of_the_ai_to.f0324c = Las colisiones afectan también a los buques de la IA (casco y velocidad). Desactivado: solo afecta al buque que controlas.
