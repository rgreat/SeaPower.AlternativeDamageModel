ships_that_collide_are_damaged_hull_loss.6567ee = Los buques que chocan reciben daño: pérdida de casco y vías de agua donde se tocan los cascos. Desactivado: las colisiones no dañan (el frenado de los buques se ajusta aparte).
the_water_holds_a_ship_that_is_shoved_si.81f347 = El agua retiene a un buque que es empujado de lado o girado (el agua que se mueve con él, la resistencia): a lo ancho del casco un buque cuenta varias veces más pesado que su desplazamiento, a lo largo apenas más. Así un espolonazo en el costado se frena más y desplaza menos a su objetivo. 1.0 = unas cinco veces el desplazamiento a lo ancho, 0 = solo el desplazamiento.
water_resistance.dd4b95 = Resistencia del agua
hull_damage_from_a_collision_of_ships_th.72d875 = Daño al casco por la colisión de buques (el juego no lo tiene). El daño es la energía perdida mientras los buques siguen en contacto (golpe, empuje, roce), por tonelada de desplazamiento propio; el buque más ligero sufre más. 1.0 = dos buques iguales que chocan a 19 nudos destruyen cada uno cerca de un compartimento y cuarto. Va a los compartimentos donde se tocan y abre vías de agua. 0 = desactivado.
multiplier_of_the_flooding_that_a_collis.b248fb = Multiplicador de la inundación que abre una colisión (las vías de agua en los compartimentos dañados). 1.0 = como se calcula, 0 = las colisiones no abren vías de agua.
ships_that_collide_lose_speed_the_relati.e3d249 = Los buques que chocan pierden velocidad: la velocidad relativa transversal al contacto se pierde casi toda (el buque ligero pierde más, el pesado apenas), a lo largo del contacto solo una parte (véase «Pérdida de velocidad por presión»). La física del juego no frena los buques, lo hace el mod. 1.0 = la pérdida completa de velocidad que da un golpe así, 0.5 = la mitad, 0 = los buques conservan su velocidad. Luego el buque vuelve a acelerar con sus máquinas.
the_share_of_the_sliding_along_the_conta.d54692 = La parte de la velocidad de deslizamiento (a lo largo del contacto) que quita un golpe, en proporción a cuánto se aprietan los buques (un espolonazo en el costado quita casi toda la velocidad de deslizamiento, el roce de cascos paralelos nada).
flooding_from_collisions.6cd788 = Inundación por colisiones
small_ships_burn_and_flood_faster_the_gr.a5be2b = Los buques pequeños arden y se inundan más rápido: el crecimiento de los incendios y el agua que entra aumentan suavemente (según el logaritmo del desplazamiento) de 1 a 1000 toneladas hasta este multiplicador a 50 toneladas, y se quedan así por debajo. Los buques de 1000 toneladas o más no cambian. 1 = desactivado.
ship_size_effect_on_flooding_and_fire.4806f7 = Tamaño del buque: efecto en la inundación y el fuego
