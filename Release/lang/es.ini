four_small_icons_under_a_ship_s_icon_on.e864ac = Cuatro iconos pequeños bajo el icono de un barco en el mapa (también el tuyo): fuego (la fuerza total de los fuegos), agua, casco (clasificado como en el panel Damage Control) (en tu propio barco no se muestran los daños del casco que ya no se pueden soldar ni el agua que no se puede achicar; los planes de reparación de un contacto no se conocen) y motor; amarillo / naranja / rojo según la gravedad, y un icono de mapa más gris cuando el barco va a hundirse (en 20 minutos según la tendencia de inundación / casco). Un contacto: fuego, agua, casco y motor solo a la vista directa; por sonar - solo el motor (amarillo: parte perdida, rojo: nada funciona); por radar - una estimación para un barco alcanzado en los últimos 10 minutos, marcada con '?' (amarillo: 10 nudos o menos, rojo: menos de 3); nada por ESM o sin contacto, y nada para un barco hundido. La línea Fires de la pestaña Damage Control usa la misma fuerza total. El Unit Status de un contacto muestra una pestaña Damage State con la misma información en palabras.
