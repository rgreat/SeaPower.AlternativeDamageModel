diagnostics_writes_every_fire_started_by.fce017 = Diagnóstico: escribe en el archivo de traza cada fuego iniciado por un impacto y cada cambio de etapa de un fuego (barco, compartimento, tiempo de misión, gravedad y crecimiento en % del máximo del compartimento, equipos de control de averías allí). Funciona también con el mod desactivado en el menú Mods, para comparar con el juego.
writes_a_line_to_the_trace_file_for_ever.18fd6a = Escribe una línea en el archivo de traza por cada barco que entra en una misión: su integridad de casco en el juego y con el mod.
health_of_a_damage_control_team_a_multip.e4f712 = Salud de un equipo de control de averías, un multiplicador de su máximo, que es de 1..100 puntos según el desplazamiento del barco (100 = tripulación de 1000 o más, unas 100000 t; 1000 t = 10, 10000 t = 32). Se muestra en la pista del equipo como parte del total. Un equipo a 0 está muerto. Los equipos heridos trabajan más despacio (tanto como su salud, no menos del 25%). 0 = los equipos nunca resultan heridos (un impacto aún saca a un equipo de su sección).
concussion_chance.0ef45f = Probabilidad de conmoción
wound_100_always.0d4fec = × herida · 100 = siempre
chance_that_a_wounded_team_is_concussed.cdf858 = Probabilidad de que un equipo herido sufra conmoción (véase HealTime): el promedio entre la herida y toda la salud que el equipo ha perdido hasta ahora (ambas como parte de su salud), multiplicado por este número, como máximo 100%. Para un equipo en plena forma es simplemente la herida: con 2.0, una herida del 20% causa conmoción en el 40% de los casos y del 50% o más, siempre; un equipo que ya estaba herido sufre conmoción con más facilidad. 100 = siempre con conmoción (como en el juego). Un equipo que el juego deja fuera de combate sin el modelo de salud siempre sufre conmoción.
multiplier_of_the_chance_that_a_wounded.d13899 = Multiplicador de la probabilidad de que un equipo herido sufra conmoción (véase HealTime). La probabilidad es la herida más toda la salud que el equipo ha perdido hasta ahora (como parte de su salud), como máximo 100%: con 1.0, un equipo en plena forma herido en un 20% sufre conmoción en el 40% de los casos, con 50% o más siempre, y un equipo que ya estaba herido la sufre con más facilidad. 0 = nunca, 100 = siempre (como en el juego).
multiplier_of_the_chance_that_a_wounded.50992e = Multiplicador de la probabilidad de que un equipo herido sufra conmoción (véase HealTime). La probabilidad es el promedio entre la herida y toda la salud que el equipo ha perdido hasta ahora (como parte de su salud), multiplicado por este número, como máximo 100%. Para un equipo en plena forma es simplemente la herida: con 1.0, una herida del 20% causa conmoción en el 20% de los casos, una del 50% en el 50%; un equipo que ya estaba herido la sufre con más facilidad. 0 = nunca, 100 = siempre (como en el juego).
multiplier_of_the_chance_that_a_wounded.e66163 = Multiplicador de la probabilidad de que un equipo herido sufra conmoción (véase HealTime). La probabilidad es la parte de la salud del equipo que se lleva la herida, multiplicada por este número, como máximo 100%: un equipo en plena forma herido en un 20% sufre conmoción en el 20% de los casos; un equipo con el 40% de salud restante herido en el mismo 20% (la mitad de lo que tenía) en el 50%. 0 = nunca, 100 = siempre (como en el juego).
multiplier_of_the_chance_that_a_wounded.a8a160 = Multiplicador de la probabilidad de que un equipo herido sufra conmoción (véase HealTime). La probabilidad es la mitad de la parte de la salud del equipo que se lleva la herida, multiplicada por este número, como máximo 100%: con 1.0, un equipo en plena forma herido en un 20% sufre conmoción en el 10% de los casos; un equipo con el 40% de salud restante herido en el mismo 20% (la mitad de lo que tenía) en el 25%. 0 = nunca, 1000 = casi siempre (como en el juego).
multiplier_of_the_chance_above_shellfire.df07f6 = Multiplicador de la probabilidad anterior (ShellFireByPower). 1 = como se describe, 0.5 = la mitad.
the_chance_that_a_gun_shell_sets_a_compa.96a25e = La probabilidad de que un proyectil de cañón incendie un compartimento depende de la potencia de su carga. En el juego es un 20 % fijo para el compartimento alcanzado (y 12–18 % para los vecinos, solo si el proyectil atraviesa el blindaje), sea cual sea el proyectil. Con esta opción: 90 % para proyectiles de 100 mm o más, proporcionalmente menos para los menores (37 mm = 17 %, 76 mm = 43 %), la mitad si el blindaje detuvo el proyectil. Los compartimentos vecinos conservan 0.6–0.9 de ella. Los proyectiles incendiarios los gestiona el juego.
shell_fire_chance.c44009 = Probabilidad de incendio por proyectil
shell_fire_chance_by_shell_power.4841c5 = Probabilidad de incendio según la potencia
90_from_100_mm_half_if_stopped_by_armour.c123de = 90 % desde 100 mm, mitad si lo detiene el blindaje
the_chance_by_power.660760 = × probabilidad según potencia
the_chance_that_a_gun_shell_sets_a_compa.18f958 = La probabilidad de que un proyectil de cañón incendie un compartimento depende de la potencia de su carga. En el juego es un 20 % fijo para el compartimento alcanzado (y 12–18 % para los vecinos, solo si el proyectil atraviesa el blindaje), sea cual sea el proyectil. Con esta opción: 90 % para proyectiles de 100 mm o más, proporcionalmente menos para los menores (37 mm = 17 %, 76 mm = 43 %); si el blindaje detuvo el proyectil, la probabilidad se multiplica por la opción «Incendio por impactos detenidos por el blindaje» (BlockedHitFireChance). Los compartimentos vecinos conservan 0.6–0.9 de ella. Los proyectiles incendiarios los gestiona el juego.
90_from_100_mm_less_below.35975c = 90 % desde 100 mm, menos por debajo
