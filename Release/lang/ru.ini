the_hull_armour_classes_of_the_world_war.fbf596 = Классы брони из WW2-мода: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 и SuperHeavy (регистр не важен). Игра знает только none / minor / moderate / heavy и любой другой класс считает за none: тогда все снаряды проходят сквозь броню. Если включить, пять классов работают для корпусов и для модулей (башни, погреба, машины…), каждый стоит между классами самой игры в матрице пробития (от самого крепкого: SuperHeavy, heavy, BattleCruiser2, BattleCruiser, HeavyCruiser, moderate, LightCruiser, minor); броня корпуса есть в строке Hull в журнале. Ещё они получают бонус к прочности корпуса, как броня игры (×1.2 minor, ×1.25 moderate, ×1.3 heavy), равными шагами между ними: SuperHeavy ×1.3125, BattleCruiser2 ×1.2875, BattleCruiser ×1.275, HeavyCruiser ×1.2625, LightCruiser ×1.225. Корпус без ArmorType в [General] берёт его из [TaskForce] (так записаны usn_bb_iowa45 и usn_bb_missouri2 из мода; игра дала бы им minor).
the_hull_armour_classes_of_the_world_war.e2dbf4 = Классы брони из WW2-мода: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 и SuperHeavy (регистр не важен). Игра знает только none / minor / moderate / heavy и любой другой класс считает за none: тогда все снаряды проходят сквозь броню. Если включить, пять классов работают для корпусов и для модулей (башни, погреба, машины…), каждый стоит между классами самой игры в матрице пробития (от самого крепкого: SuperHeavy, heavy, BattleCruiser2, BattleCruiser, HeavyCruiser, moderate, LightCruiser, minor); броня корпуса есть в строке Hull в журнале. Ещё они получают бонус к прочности корпуса, как броня игры (×1.2 minor, ×1.25 moderate, ×1.3 heavy), так: SuperHeavy ×1.3, BattleCruiser2, BattleCruiser и HeavyCruiser ×1.25, LightCruiser ×1.2. Корпус без ArmorType в [General] берёт его из [TaskForce] (так записаны usn_bb_iowa45 и usn_bb_missouri2 из мода; игра дала бы им minor).
