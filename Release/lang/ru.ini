; Alternative Damage Model - texts, language: ru
; key = text   (\n = line break; keep {0} {1} ...)
; Machine translation, not checked by a native speaker: corrections are welcome.

a_burning_section_opens_its_plugged_leak.20b488 = Горящая секция снова открывает заделанные пробоины: % от наибольшей пробоины секции в секунду при пожаре 100% (меньше при меньшем пожаре). 0 = выкл.
a_fire_does_not_spread_into_a_compartmen.6e664b = Пожар не распространяется в отсек, где есть аварийная партия (партия останавливает огонь у двери). Выкл. = как в игре.
a_fire_no_damage_control_team_has_fought.5e3fa0 = Пожар, с которым давно не борется ни одна аварийная партия, разгорается всё быстрее: при каждой проверке пожара (FireCheckTime, 10 с) скорость его роста растёт, как будто секцию снова поразили. Выкл. = как в игре (пожар растёт только от попаданий).
a_fully_flooded_section_water_above_75_i.aaedbd = Полностью затопленная секция (вода выше 75%): её системы приводятся в тяжёлое повреждение, выходят из строя и не могут быть отремонтированы, пока секция затоплена.
a_hit_on_a_compartment_that_is_already_d.364c92 = Попадание в уже уничтоженный отсек не пропадает: половина урона идёт в соседний отсек (того же борта, к середине корабля); если и он уничтожен, четверть идёт в следующий. Излишек попадания, уничтожившего отсек, распределяется так же.
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = Попадание в секцию может ранить её партии при любой прочности. Выкл. = как в игре: только поражённая секция с прочностью ниже 50% может вывести партию из строя, с шансом урон x (1 - прочность), не более 20%. Вкл. = каждое попадание в секцию с партиями получает бросок ранения (см. Wound chance); раненая партия уходит в резерв.
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = Пробоина, вновь открытая огнём, разрастается обратно до этого % от наибольшей пробоины секции.
a_section_under_the_sea_puts_its_fire_ou.3d1565 = Секция под водой тушит свой пожар: пожар теряет столько % от максимума в секунду на каждый метр, на который кромка палубы секции под водой (1 = столько % в секунду, сколько метров). Только когда обе палубные точки секции (левая и правая) под водой; глубина - среднее из двух. Нужны палубные точки корабля (как для затопления через палубу). 0 = выкл.
a_team_cannot_plug_holes_while_the_ship.f5f08f = Партия не может заделывать пробоины, пока скорость корабля выше этой, в узлах. 0 = без ограничения.
a_team_in_a_burning_section_loses_this_m.ecb388 = Партия в горящей секции теряет столько от полного здоровья в секунду при пожаре 100%, если хотя бы одна партия секции не борется с огнём (меньше при меньшем пожаре).
a_team_in_the_reserve_recovers_this_much.2dd530 = Партия в резерве восстанавливает столько от полного здоровья в секунду.
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = Корабли ИИ (не ваши) короче 50 м не замедляются от затопления: срез скорости игрой из-за пробоин и воды для них отключён (они продолжают идти, как камикадзе). Кнопка «Limit Speed» ваших кораблей — отдельно.
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = Шанс сильного пожара (от 50% максимума) перекинуться на соседние секции, в % за проверку пожара: игра проверяет каждые FireCheckTime (10 с) с шансом 0,0133% — почти никогда. 0.0133 = как в игре; 1.0 = 1% за проверку (примерно раз в 17 минут сильного пожара), 0 = никогда.
colours_the_weapon_buttons_of_the_select.a41d7b = Окрашивает кнопки оружия нижней панели выбранного юнита по состоянию их систем: всё работает — цвет игры, часть этого типа неисправна — жёлтый, всё неисправно — красный.
concussion_a_team_wounded_by_a_weapon_a.2d37ab = Контузия: партия, раненная оружием (в поражённой секции или в резерве), остаётся контуженной столько секунд после попадания в резерв; Auto DC не отправляет её обратно на работу, пока контузия не пройдёт. Идёт рядом со здоровьем партии, у которого своё восстановление. 0 = без контузии.
counterflooding_lets_water_into_one_side.8d3f44 = Контрзатопление впускает воду в один борт отсека только до этого % (собственный предел отсека в игре тоже действует).
damage_control_efficiency_while_the_ship.d761c8 = Эффективность борьбы за живучесть, пока двигатель корабля (используемый модуль Engine, не движитель) неисправен: эффективность партий в % (пожары, пробоины, вода, корпус; ремонт систем не затрагивается). Показывается в подсказках партий и в строке Forecast вкладки Damage Control. 100 = выкл.
damage_control_teams_in_a_section_with_a.e2dc23 = Аварийные партии в секции с пожаром, не борющиеся с ним, работают с этой долей своей эффективности, %. 100 = выкл.
damage_control_teams_of_a_civilian_ship.630d69 = Аварийные партии гражданского корабля по водоизмещению: тонны=партии.
damage_control_teams_of_a_submarine_by_d.556a4a = Аварийные партии подводной лодки по водоизмещению: тонны=партии.
damage_control_teams_of_a_surface_warshi.2960b3 = Аварийные партии надводного боевого корабля по водоизмещению: тонны=партии, начиная с этих тонн. NumberOfDCTeams в ini корабля по-прежнему задаёт своё число.
debug_draws_the_selected_ship_s_hull_onl.f6f266 = Отладка: рисует коллайдеры только корпуса (coll_hull*) выбранного корабля как полупрозрачную накладку и яркую сетку их настоящих треугольников — для прямого сравнения с видимой 3D-моделью.
debug_for_the_ship_currently_selected_in.50880e = Отладка: для корабля, выбранного в панели Unit Status, рисует линию от текущей волны до расчётной высоты палубы на оси носа и кормы корпуса и на паре левый/правый борт для каждой секции модели повреждений (её собственная центральная точка по длине) — только коллайдеры корпуса, не башни, мачты и другие подмодели. Зелёный: точка выше волны; красный: волна над ней.
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = Отладка: как рисуется собственная 3D-модель выбранного корабля (с подмоделями), чтобы были видны ShowDeckCorners/ShowHullCollider: Show (как в игре), Translucent (прозрачность 70%) или Hide.
diagnostics_while_a_ship_lists_or_trims.7ab078 = Диагностика: пока корабль заметно кренится или имеет дифферент, каждые 2 секунды пишет в лог BepInEx: крен, дифферент, высоту, плавучесть против веса, погружённый объём, воду в корабле и тонет ли он / перевернулся.
diagnostics_writes_every_fire_started_by.c267ad = Диагностика: пишет в лог BepInEx каждый пожар, начатый попаданием, и каждую смену стадии пожара (корабль, отсек, время миссии, сила и рост в % от максимума отсека, аварийные партии там). Работает и при выключенном моде в меню Mods, для сравнения с игрой.
enables_verbose_logging_and_bepinex_alte.5d311f = Включает подробное журналирование и BepInEx/AlternativeDamageModel.trace.txt.
fire_row_one_arrow_when_the_fire_changes.2c03b0 = Строка пожара: одна стрелка, когда пожар меняется быстрее этого, в % от максимума в секунду.
fire_row_two_arrows_down_when_the_fire_i.cfce19 = Строка пожара: две стрелки вниз, когда пожар гасят быстрее этого, в % от максимума в секунду.
fire_row_two_arrows_up_when_the_fire_gro.8de955 = Строка пожара: две стрелки вверх, когда пожар растёт быстрее этого, в % от максимума в секунду.
fixes_an_error_of_the_game_itself_above.638bbb = Исправляет ошибку самой игры: при сжатии времени выше 10x дифферент корабля растёт вместе со сжатием (катер 25 м на 47 уз: 2,6 градуса до 10x, 9 на 100x) — достаточно, чтобы потопить короткий быстрый целый корабль. Игра двигает корабль на шаг за такт физики, и выше 10x этот шаг растягивается, а момент плавучести берётся относительно центра масс до шага. Вкл.: лишний шаг отбрасывается, и дифферент остаётся таким, как на 10x при любом сжатии; до 10x ничего не меняется. Только надводные корабли. Выкл.: поведение игры.
flooding_row_and_flooding_plan_one_arrow.802936 = Строка затопления и план затопления: одна стрелка, когда уровень воды меняется быстрее этого, в % отсека в секунду.
flooding_row_and_flooding_plan_two_arrow.129e17 = Строка затопления и план затопления: две стрелки, когда уровень воды меняется быстрее этого, в % отсека в секунду.
four_small_icons_under_a_ship_s_icon_on.001776 = Четыре маленьких значка под значком корабля на карте (и вашего): пожар (суммарная сила пожаров), вода, корпус (по классификации панели Damage Control) и двигатель; жёлтый / оранжевый / красный по тяжести; значок корабля на карте сереет, когда корабль пойдёт ко дну (в пределах 20 минут по тренду затопления / корпуса). Контакт: пожар, вода, корпус и двигатель — только при прямой видимости; по гидролокатору — только двигатель (жёлтый: часть потеряна, красный: ничего не работает); по радару — оценка для корабля, поражённого за последние 10 минут, с пометкой «?» (жёлтый: 10 узлов и меньше, красный: меньше 3); ничего по ESM или без контакта, и ничего для потопленного корабля. Строка Fires вкладки Damage Control использует ту же суммарную силу. Unit Status контакта показывает вкладку Damage State с той же информацией словами.
health_of_a_damage_control_team_a_multip.330f74 = Здоровье аварийной партии, множитель её максимума, который составляет 1..100 очков по водоизмещению корабля (100 = экипаж 1000 и больше, около 100000 т; 1000 т = 10, 10000 т = 32). Показывается в подсказке партии как часть от полного. Партия на 0 погибла. Раненые партии работают медленнее (пропорционально здоровью, не ниже 25%). 0 = партии никогда не ранят (попадание всё же выводит партию из секции).
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = Как быстро пожар разъедает корпус своей секции (прочность обоих её отсеков). 1.0 = как в игре. Урон системам секции не меняется.
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = Как быстро партия в резерве избавляется от усталости, % от скорости, с которой она копится на работе. 100 = так же быстро; 50 = отдых вдвое дольше работы.
how_fast_a_team_walks_through_the_ship_m.440ac9 = Как быстро партия идёт по кораблю, метров в минуту (резерв в середине). Переход = MusterTime + дорога, с округлением до 10 с. 0 = без времени в пути; при MusterTime 0 тоже партии перемещаются мгновенно, а Auto DC — игровой.
how_fast_damage_control_teams_pump_water.daadca = Как быстро аварийные партии откачивают воду. 1.0 = как в игре.
how_fast_damage_control_teams_put_fires.5d5eaf = Как быстро аварийные партии тушат пожары. 1.0 = как в игре.
how_fast_fires_grow_by_themselves_betwee.e757ca = Как быстро пожары растут сами по себе, между попаданиями. 1.0 = как в игре, 2.0 = вдвое быстрее, 0.5 = вдвое медленнее.
how_fast_water_comes_in_through_the_hole.cad705 = Как быстро вода поступает через пробоины отсека. 1.0 = как в игре.
how_many_times_stronger_the_hull_of_civi.706453 = Во сколько раз корпус гражданских кораблей (ini-файлы civ_*) прочнее, чем в игре. 1.0 = как в игре.
how_many_times_stronger_the_hull_of_subm.d3d1a9 = Во сколько раз корпус подводных лодок прочнее, чем в игре. 1.0 = как в игре.
how_many_times_stronger_the_hull_of_surf.32130e = Во сколько раз корпус надводных боевых кораблей прочнее, чем в игре. 1.0 = как в игре, 2.0 = вдвое прочнее. Отдельные корабли получают своё значение в разделе [HullIntegrityPerShip], по строке на корабль: имя ini-файла = множитель (например, usn_bb_iowa = 3.0).
how_much_one_team_gets_done_plugging_fir.8ecb35 = Сколько делает одна партия (заделка пробоин, тушение, откачка, ремонт корпуса и систем) по сравнению с игрой. 1.0 = как в игре.
how_strongly_the_list_follows_uneven_flo.541fe4 = Насколько сильно крен следует за неравномерным затоплением. Разница воды между левым и правым бортом секции (она кренит корабль) умножается на это; среднее секции сохраняется, поэтому осадка и дифферент от этого не меняются. 1 = как в игре, 2 = вдвое больший крен от той же разницы.
how_the_ship_s_speed_changes_the_growth.6d2cf6 = Как скорость корабля меняет рост пожаров и поступление воды (через пробоины и через кромку палубы): узлы=множитель затопления/пожара, ломаная линия через точки. Скорость берётся по модулю; ниже первой точки и выше последней действуют крайние множители.
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = Язык текстов мода: en, ru, cn, de, es, fr, ko, ja или vn. Пусто = язык игры. Тексты лежат в папке lang мода (lang/<код>.ini); отсутствующий текст показывается по-английски.
list_degrees_the_full_scale_of_the_list.a220dc = Крен, градусы: полная шкала индикатора LIST. С его красной зоны (75% шкалы) вода идёт через кромку палубы и быстро затапливает все отсеки низкого борта (игра: на 45). Сам по себе корабль не тонет; опрокидывание на 70 градусах топит, как в игре.
metres_the_trim_limit_depends_on_the_shi.be80af = Метры. Предел дифферента зависит от длины корабля: чем длиннее корабль, тем раньше нос или корма уходят под воду при том же угле (tan предела = tan TrimLimit x (TrimReferenceLength / длина)^0.442; при 5.2 на 100: 30 м 8.8, 60 м 6.5, 150 м 4.4, 300 м 3.2 градуса). 0 = TrimLimit для всех кораблей (как в игре).
minutes_of_work_in_a_section_until_a_tea.abe7fb = Минуты работы в секции, пока партия не устанет (первый уровень); её скорость падает по настройкам Speed. Резерв снимает усталость так же быстро, как работа её набирает. Показывается в подсказке партии; значок уставшей партии подсвечен. 0 = без усталости.
minutes_of_work_until_a_team_is_exhauste.461264 = Минуты работы, пока партия не выбьется из сил — второй уровень усталости (максимум: дальше усталость не растёт). Не больше «Tired after» = без второго уровня.
multiplier_of_the_chance_that_a_hit_woun.6766c6 = Множитель шанса, что попадание ранит партию (0.5 = вдвое реже, 2 = вдвое чаще; итог не выше 100%). Шаг 1 (только пока Wounds at any hull integrity выключено) — игра решает, выводит ли попадание партию из секции вообще (только поражённая секция с прочностью ниже 50%: урон x (1 - прочность), не более 20%). Шаг 2 — мод решает о ранении: шанс круто растёт с мощностью боевой части (примерно мощность^1.8) и падает со здоровьем партии (примерно здоровье^1.2) — боевая часть 2.2 против здоровья 2: около 10%, против 100: 0,1%; боевая часть 82 против 100: около 75%; много выше — больше 100%. Он умножается на этот множитель и ограничивается 100% (при выключенном Wounds at any hull integrity не раненная партия всё равно покидает секцию). Более мощная боевая часть повышает шанс. Больший корабль понижает его: партии крепче (больше здоровья), а отсеки больше, так что попадание реже приходится туда, где партия. Даже самое слабое попадание имеет малый шанс. Пример, боевая часть 25: против здоровья 12 около 100%, против 29 около 37%, против 100 около 9%. 0 = никогда не ранят.
multiplier_of_the_strength_of_a_wound_at.119bcb = Множитель силы ранения: не более мощности боевой части боеприпаса (0..196, у половины игровых боеприпасов меньше 25) x это, в очках здоровья партии (1..100 по водоизмещению). Раненая партия уходит в резерв.
random_spread_of_the_concussion_time_sec.c54f69 = Случайный разброс времени контузии, секунд в обе стороны: HealTime 90 при 30 = от 60 до 120 с, как в игре. 0 = всегда HealTime.
resistance_to_the_horizontal_movement_of.dc8036 = Сопротивление ГОРИЗОНТАЛЬНОМУ движению уничтоженного корабля, в долях линейного сопротивления игры (25 почти у каждого корабля): остов быстрее теряет ход. 1 = как в игре. Погружение (вертикальное движение) и поворот (опрокидывание) не замедляются.
seconds_game_time_so_time_compression_co.551b95 = Секунды (игровое время, сжатие времени учитывается), которые палубная точка отсека должна подряд оставаться под водой, прежде чем вода через палубу начнёт поступать (см. DeckFloodingSpeed). Всплывшая точка сбрасывает таймер. По умолчанию 3.
seconds_a_team_needs_to_get_ready_before.3b6e27 = Секунды, нужные партии на сборы перед каждым переходом. Отмена перехода, пока партия ещё собирается, времени не стоит.
settings_profile_in_use_chosen_in_the_ga.331d79 = Используемый профиль настроек, выбирается в игре: Unit Status -> Damage Control -> шестерёнка рядом с (i). В этом файле только общие настройки ([General], [UI]); значения модели повреждений — в файле профиля: встроенные в папке Profiles мода (только чтение), ваши в StreamingAssets/user/AlternativeDamageControl/Profiles. Изменение встроенного профиля в игре сохраняет его как Custom. Правки файла используемого профиля или этого имени подхватываются во время игры.
ships_ini_file_names_comma_separated_edi.c5b815 = Корабли (имена ini-файлов через запятую; правятся в окне настроек, вкладка Flooding), не получающие Deck Points: затопление идёт по старым, более простым правилам, как у корабля без коллайдера корпуса.
team_fatigue_on_working_builds_it_up_the.e170b3 = Усталость партий вкл.: работа её набирает, резерв снимает, уставшая партия работает вдвое медленнее. Выкл. = без усталости; её настройки скрыты.
team_health_on_wounds_from_hits_and_fire.0440b7 = Здоровье партий вкл.: ранения от попаданий и пожаров, восстановление в резерве, раненые партии работают медленнее. Выкл. = правила игры (попадание на время выводит партию из строя, без ранений); остальные настройки здоровья скрыты.
the_detailed_view_of_unit_status_damage.b04888 = Подробный вид Unit Status -> Damage Control (отображение мода): прочность корпуса по бортам рядом с названием каждой секции, значок на каждую аварийную партию (её задача; задачи и перемещения вручную при выключенном Auto DC), вода и огонь в % со стрелками тренда, DC Priority, карточки партий, индикаторы LIST / TRIM / LEVEL с планом затопления, подсказки, легенда (i). Выкл.: собственный вид игры (шестерёнка окна настроек остаётся).
the_mod_s_damage_model_and_damage_contro.b3b07a = Модель повреждений и борьба за живучесть мода: прочность корпуса и систем, побочные эффекты, скорости пожара и затопления, распространение пожара, аварийные партии (число, эффективность, переходы пешком, выбывание, оптимизированный Auto DC, перемещение отдельных партий), пределы крена / дифферента / затопления. DC Priority и задачи, заданные вручную, относятся к подробному виду и остаются. Выкл.: собственные повреждения и борьба за живучесть игры (вид вкладки Damage Control остаётся). Можно переключать в любой момент: корабли в море следуют сразу (прочность корпуса и число партий возвращаются к игровым или модовым; партии в пути прибывают, выбывшие восстанавливаются).
the_teams_rest_in_the_central_compartmen.4ac676 = Партии отдыхают в центральном отсеке: попадание в него может ранить партию, ожидающую в резерве (шанс игровой, как для партии, выбитой в поражённой секции: урон x (1 - прочность), только при прочности ниже 50%). Раненая отдыхающая партия остаётся в резерве.
trim_degrees_for_a_ship_trimreferencelen.8ab413 = Дифферент, градусы, для корабля длиной TrimReferenceLength: полная шкала индикатора TRIM. С его красной зоны (75% шкалы) уходящий вниз конец быстро затопляется: на каждом борту крайний отсек, когда он полон — следующий, и так далее. Корабль не тонет сразу, как в игре (8 градусов с затопленной секцией).
unattended_fire_how_much_the_growth_rate.84fa6e = Неприсмотренный пожар: на сколько растёт скорость роста при каждой проверке пожара, в % от максимальной скорости роста пожара (обычное попадание добавляет 0,1–0,8%).
unattended_fire_its_growth_rate_is_raise.b4969b = Неприсмотренный пожар: скорость его роста повышается только до этого значения, в % от максимума пожара в секунду.
unattended_fire_seconds_without_a_team_f.098d15 = Неприсмотренный пожар: секунды без партии, борющейся с пожаром (с момента его начала или с последней борьбы партии), прежде чем он начнёт расти быстрее.
vulnerability_of_the_hull_to_flooding_th.35677a = Уязвимость корпуса к затоплению через пробоины от попаданий (все типы оружия). 1.0 = каждая пробоина пропускает столько воды, как в игре, а пробоины выше ватерлинии начинают течь после того же урона, что и в игре (более прочный корпус воду не удерживает). 2.0 = вдвое больше воды; 0.5 = вдвое меньше.
vulnerability_of_the_hull_to_gun_shells.c70d65 = Уязвимость корпуса к артиллерийским снарядам (ракеты, торпеды и бомбы не затрагиваются). Снаряды забирают долю предела потопления корабля, зависящую от размера корпуса. 1.0 = каждый снаряд забирает столько, как в игре; более прочный корпус просто переживает больше попаданий. 2.0 = снаряды бьют, как будто корпус вдвое меньше; 0.5 = как будто вдвое больше (средние снаряды могут перестать вредить большим кораблям).
vulnerability_of_the_ship_to_fires_start.50481c = Уязвимость корабля к пожарам от попаданий (все типы оружия). Более прочный корпус так же удерживает пожары в той же пропорции: при Warships = 5.0 попадание начинает пожар в 5 раз слабее (относительно отсека), чем в игре. 1.0 = это обычное поведение мода. 2.0 = пожары вдвое сильнее и растут вдвое быстрее; 0.5 = вдвое слабее. 1.0 при всех множителях корпуса 1.0 = как в игре.
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = Вода в секции ограничивает её пожар: он не может быть сильнее (100 - % воды секции) от максимума. Более сильный пожар падает до этого предела со скоростью этого % от максимума в секунду. 0 = выкл.
water_in_the_whole_ship_the_average_of_i.a5b547 = Вода во всём корабле, % (среднее по его отсекам), с которой он тонет, как в игре (игра: 40; подводные лодки сохраняют игровые 50). Также полная шкала индикатора LEVEL.
water_over_the_deck_edge_a_multiplier_fo.512690 = Вода через кромку палубы, множитель. Для кораблей с известными палубными точками (полный алгоритм коллайдера корпуса): когда палубная точка отсека находилась под водой DeckFloodingDelay секунд подряд (игровое время, сжатие времени учитывается), отсек принимает воду, которую борьба за живучесть остановить не может — 1.0 = 0,1% его объёма в секунду на метр погружения (глубже = быстрее); полный отсек передаёт воду самому низкому неполному соседу и дальше по цепочке. Для остальных кораблей: как быстро принимает воду через кромку палубы уходящий вниз конец (от дифферента сверх предела) или низкий борт (от крена сверх предела) — собственная механика мода, в игре её нет. 2.0 = вдвое быстрее, 0.5 = вдвое медленнее, 0 = выкл.
when_a_ship_starts_to_sink_the_game_puts.562c7b = Когда корабль начинает тонуть, игра ставит его центр масс в начало координат корпуса ((0, 1, 0), если он опрокинулся): центр масс прыгает, а с ним и все моменты на корпус. Вкл. = центр масс остаётся там, где был. Выкл. = как в игре.
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = Пока партия заделывает пробоины отсека (задача Flooding Rate), она одновременно откачивает из него воду: эта доля скорости откачки (0.5 = половина, 0 = выкл.). Партия, получившая приказ о контрзатоплении, откачивает только с того борта, где это не ухудшает крен и дифферент.
work_speed_of_a_rested_team_the_starting.1e64b0 = Скорость работы отдохнувшей партии, % (начало кривой усталости). Скорость падает по прямой отсюда до уровня «устала».
work_speed_of_a_team_that_has_just_becom.425925 = Скорость работы только что уставшей партии, %. Между уровнями «устала» и «выбилась из сил» скорость падает по прямой.
work_speed_of_an_exhausted_team_it_stays.4cfc9a = Скорость работы выбившейся из сил партии, %; она остаётся такой, пока партия продолжает работать.
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = Пишет в лог BepInEx строку для каждого корабля, входящего в миссию: прочность его корпуса в игре и с модом.
