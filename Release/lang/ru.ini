four_small_icons_under_a_ship_s_icon_on.e864ac = Четыре маленьких значка под значком корабля на карте (и вашего): пожар (суммарная сила пожаров), вода, корпус (по классификации панели Damage Control) (на своём корабле не показываются повреждения корпуса, которые уже нельзя заварить, и вода, которую нельзя откачать; планы ремонта контакта неизвестны) и двигатель; жёлтый / оранжевый / красный по тяжести; значок корабля на карте сереет, когда корабль пойдёт ко дну (в пределах 20 минут по тренду затопления / корпуса). Контакт: пожар, вода, корпус и двигатель — только при прямой видимости; по гидролокатору — только двигатель (жёлтый: часть потеряна, красный: ничего не работает); по радару — оценка для корабля, поражённого за последние 10 минут, с пометкой «?» (жёлтый: 10 узлов и меньше, красный: меньше 3); ничего по ESM или без контакта, и ничего для потопленного корабля. Строка Fires вкладки Damage Control использует ту же суммарную силу. Unit Status контакта показывает вкладку Damage State с той же информацией словами.
