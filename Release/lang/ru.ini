the_armour_classes_of_the_world_war_ii_m.e5dd05 = Классы брони из WW2-мода (LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2, SuperHeavy; регистр не важен) для корпусов и модулей. Игра считает их отсутствием брони: все снаряды проходят. С этой опцией каждый класс работает между классами игры (от самого крепкого: SuperHeavy, heavy, BattleCruiser2, BattleCruiser, HeavyCruiser, moderate, LightCruiser, minor) и даёт свой бонус к прочности корпуса. Корпус без ArmorType в [General] берёт его из [TaskForce].
