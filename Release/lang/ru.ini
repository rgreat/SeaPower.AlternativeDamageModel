the_hull_armour_classes_of_the_world_war.c6c4c0 = Классы брони из WW2-мода: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 и SuperHeavy (регистр не важен). Игра знает только none / minor / moderate / heavy и любой другой класс считает за none: тогда все снаряды проходят сквозь броню. Если включить, пять классов работают для корпусов и для модулей (башни, погреба, машины…), у каждого своя таблица пробития из мода (damage.ini); броня корпуса есть в строке Hull в журнале. Корпус без ArmorType в [General] берёт его из [TaskForce] (так записаны usn_bb_iowa45 и usn_bb_missouri2 из мода; игра дала бы им minor).
the_hull_armour_classes_of_the_world_war.0ba238 = Классы брони из WW2-мода: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 и SuperHeavy (регистр не важен). Игра знает только none / minor / moderate / heavy и любой другой класс считает за none: тогда все снаряды проходят сквозь броню. Если включить, пять классов работают для корпусов и для модулей (башни, погреба, машины…), каждый стоит между классами самой игры в матрице пробития (от самого крепкого: SuperHeavy, heavy, BattleCruiser2, BattleCruiser, moderate = HeavyCruiser, LightCruiser, minor); броня корпуса есть в строке Hull в журнале. Корпус без ArmorType в [General] берёт его из [TaskForce] (так записаны usn_bb_iowa45 и usn_bb_missouri2 из мода; игра дала бы им minor).
