the_hull_armour_classes_of_the_world_war.c6a232 = Классы брони корпусов из WW2-мода: LightCruiser, HeavyCruiser, BattleCruiser, BattleCruiser2 и SuperHeavy (регистр не важен). Игра знает только none / minor / moderate / heavy и любой другой класс считает за none: тогда все снаряды проходят сквозь броню. Если включить, пять классов работают, у каждого своя таблица пробития из мода (damage.ini); броня корпуса есть в строке Hull в журнале.
armour_classes_of_the_ww2_mod.96c459 = Классы брони WW2-мода
