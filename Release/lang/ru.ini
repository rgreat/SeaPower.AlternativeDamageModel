fires_from_gun_shells_stopped_by_the_mai.3a8091 = Пожары от снарядов, остановленных главной бронёй. В игре снаряд, не пробивший броню, не вызывает пожар в отсеках рядом с местом попадания. С этой опцией такой снаряд всё же может зажечь там пожар (без урона корпусу и без затопления): шанс игры для пробившего снаряда, умноженный на это число. 0 = выключено (как в игре), 1 = тот же шанс, что у пробившего снаряда, 0.5 = половина от него.
