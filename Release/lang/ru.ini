module_types_modules_ini_with_their_own.4d6409 = Типы модулей (modules.ini) с собственной прочностью (Integrity), заданной явно вместо значения modules.ini (при выборе типа подставляется значение игры); множитель Integrity выше к ним не применяется. Игровые поправки сохраняют свою пропорцию: типы с пометкой «× тоннаж» (янтарные) растут с водоизмещением корабля — наведите на такой тип, чтобы увидеть итоговые значения — и собственное значение системы корабля меняется в той же пропорции.
ships_that_get_no_deck_points_flooding_w.029d22 = Корабли без Deck Points (Flooding): для них не считается вода через кромку палубы, применяются старые простые правила, как для корабля без коллайдера корпуса. Выбираются из кораблей игры или по имени ini-файла.
ships_with_their_own_hull_multiplier_cho.8c5c9c = Корабли с собственным множителем корпуса, выбираются из кораблей игры (или по имени ini-файла): во сколько раз прочнее, чем в игре; заменяет значение класса, не умножается на него.
