fires_from_gun_shells_stopped_by_the_mai.af6650 = Пожары от снарядов, остановленных главной бронёй. В игре снаряд, не пробивший броню, не вызывает пожар в отсеках рядом с местом попадания. С этой опцией такой снаряд всё же может зажечь там пожар (без урона корпусу и без затопления): шанс игры для пробившего снаряда, умноженный на это число. 0 = выключено (как в игре), 1 = тот же шанс, что у пробившего снаряда, 0.4 = 40 % от него.
started_a_fire.21ffbf = начался пожар
fire_from_hits_stopped_by_armour.a54dd1 = Пожар от попаданий, остановленных бронёй
the_chance_of_a_shell_that_gets_through.d13878 = × шанса пробившего снаряда · 0 = выкл.
the_starting_size_of_a_fire_that_a_gun_s.c848c4 = Начальный размер пожара, который зажигает снаряд орудия. В игре пожар от снаряда начинается с нуля и только растёт; бомба или ракета дают огню ещё и начальный размер (половина от урона, делённого на целостность отсека). С этой опцией снаряд тоже даёт огню такой начальный размер, умноженный на это число. 0 = выключено (как в игре), 1 = как у бомб и ракет, 0.5 = половина. Зажигательные снаряды сохраняют свой.
fire_of_a_gun_shell_starting_size.939f3c = Пожар от снаряда: начальный размер
as_for_bombs_and_missiles_0_off.0963f0 = × как у бомб и ракет · 0 = выкл.
fires_from_a_gun_shell_hit.0aa16c = Пожары от попадания снаряда
diagnostics_writes_every_fire_started_by.fce017 = Диагностика: пишет в файл трассы каждый пожар, начатый попаданием, и каждую смену стадии пожара (корабль, отсек, время миссии, сила и рост в % от максимума отсека, аварийные партии там). Работает и при выключенном моде в меню Mods, для сравнения с игрой.
writes_a_line_to_the_trace_file_for_ever.18fd6a = Пишет в файл трассы строку для каждого корабля, входящего в миссию: прочность его корпуса в игре и с модом.
health_of_a_damage_control_team_a_multip.e4f712 = Здоровье аварийной партии, множитель её максимума, который составляет 1..100 очков по водоизмещению корабля (100 = экипаж 1000 и больше, около 100000 т; 1000 т = 10, 10000 т = 32). Показывается в подсказке партии как часть от полного. Партия на 0 погибла. Раненые партии работают медленнее (пропорционально здоровью, не ниже 25%). 0 = партии никогда не ранят (попадание всё же выводит партию из секции).
concussion_chance.0ef45f = Шанс контузии
wound_100_always.0d4fec = × ранение · 100 = всегда
chance_that_a_wounded_team_is_concussed.cdf858 = Шанс, что раненая команда будет контужена (см. HealTime): среднее из ранения и всего здоровья, которое команда уже потеряла (обе величины в долях её здоровья), умноженное на это число, не более 100%. Для свежей команды это просто ранение: при 2.0 ранение в 20% контузит в 40% случаев, в 50% и больше — всегда; уже раненая раньше команда контузится легче. 100 = контузия всегда (как в игре). Команда, которую игра выводит из строя без модели здоровья, контужена всегда.
multiplier_of_the_chance_that_a_wounded.d13899 = Множитель шанса, что раненая команда будет контужена (см. HealTime). Шанс равен ранению плюс всё здоровье, которое команда уже потеряла (в долях её здоровья), не более 100%: при 1.0 свежая команда с ранением в 20% контужена в 40% случаев, при 50% и больше — всегда, а уже раненая раньше контузится легче. 0 = никогда, 100 = всегда (как в игре).
multiplier_of_the_chance_that_a_wounded.50992e = Множитель шанса, что раненая команда будет контужена (см. HealTime). Шанс — среднее из ранения и всего здоровья, которое команда уже потеряла (в долях её здоровья), умноженное на это число, не более 100%. Для свежей команды это просто ранение: при 1.0 ранение в 20% контузит в 20% случаев, в 50% — в 50%; уже раненая раньше команда контузится легче. 0 = никогда, 100 = всегда (как в игре).
multiplier_of_the_chance_that_a_wounded.e66163 = Множитель шанса, что раненая команда будет контужена (см. HealTime). Шанс — доля текущего здоровья команды, которую забирает ранение, умноженная на это число, не более 100%: свежая команда с ранением в 20% контужена в 20% случаев; команда с оставшимися 40% здоровья при том же ранении в 20% (половина того, что у неё было) — в 50%. 0 = никогда, 100 = всегда (как в игре).
multiplier_of_the_chance_that_a_wounded.a8a160 = Множитель шанса, что раненая команда будет контужена (см. HealTime). Шанс — половина доли текущего здоровья команды, которую забирает ранение, умноженная на это число, не более 100%: при 1.0 свежая команда с ранением в 20% контужена в 10% случаев; команда с оставшимися 40% здоровья при том же ранении в 20% (половина того, что у неё было) — в 25%. 0 = никогда, 1000 = практически всегда (как в игре).
multiplier_of_the_chance_above_shellfire.df07f6 = Множитель шанса выше (ShellFireByPower). 1 = как описано, 0.5 = половина.
the_chance_that_a_gun_shell_sets_a_compa.96a25e = Шанс, что снаряд орудия подожжёт отсек, зависит от мощности его боевой части. В игре это ровно 20 % для отсека, в который попали (и 12–18 % для соседних, только если снаряд пробил броню), каким бы ни был снаряд. С этой опцией: 90 % для снарядов от 100 мм, для меньших пропорционально меньше (37 мм = 17 %, 76 мм = 43 %), вдвое меньше, если броня остановила снаряд. Соседние отсеки получают 0.6–0.9 от этого шанса. Зажигательные снаряды остаются на усмотрение игры.
shell_fire_chance.c44009 = Шанс пожара от снаряда
shell_fire_chance_by_shell_power.4841c5 = Шанс пожара по мощности снаряда
90_from_100_mm_half_if_stopped_by_armour.c123de = 90 % от 100 мм, вдвое меньше при остановке бронёй
the_chance_by_power.660760 = × шанс по мощности
the_chance_that_a_gun_shell_sets_a_compa.18f958 = Шанс, что снаряд орудия подожжёт отсек, зависит от мощности его боевой части. В игре это ровно 20 % для отсека, в который попали (и 12–18 % для соседних, только если снаряд пробил броню), каким бы ни был снаряд. С этой опцией: 90 % для снарядов от 100 мм, для меньших пропорционально меньше (37 мм = 17 %, 76 мм = 43 %); если броня остановила снаряд, шанс умножается на «Пожар от попаданий, остановленных бронёй» (BlockedHitFireChance). Соседние отсеки получают 0.6–0.9 от этого шанса. Зажигательные снаряды остаются на усмотрение игры.
