contacts_between_ships_at_a_relative_spe.3749a0 = Контакты кораблей с относительной скоростью ниже этой, в узлах, повреждений не наносят (корабли, касающиеся друг друга в ордере, швартовка).
damage_to_the_hull_from_a_collision_with.efa04c = Повреждение корпуса при столкновении с другим кораблём (в игре его нет: корабли лишь отталкиваются друг от друга). Столкновение — не один удар: таранящий нос может залезть на другой корабль и проползти по нему. Урон берётся из энергии, которую физика гасит, пока корабли остаются в контакте, шаг за шагом (удар, давление, скрежет; корабль, просто лежащий на другом, ничего не теряет). Каждый корабль получает долю, зависящую от масс: квадрат скорости, умноженный на (m_other / (m_self + m_other))^2, на тонну собственного водоизмещения. 1.0 = два одинаковых корабля, сошедшиеся на 19 узлах, теряют примерно по 1,25 отсека; малая лодка, таранящая большой корабль, разбивается, корабль получает царапины. Урон получают отсеки, в которых корабли касаются в этот момент (место и борт точек контакта), и открываются протечки, как от попадания, растущие с полученным уроном (контакт над ватерлинией течёт только из наполовину разрушенного отсека). 0 = выкл.
