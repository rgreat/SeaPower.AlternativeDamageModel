four_small_icons_under_a_ship_s_icon_on.e864ac = Quatre petites icônes sous l'icône d'un navire sur la carte (le vôtre aussi) : feu (force totale des feux), eau, coque (classée comme dans le panneau Damage Control) (sur votre propre navire, les dégâts de coque qui ne peuvent plus être soudés et l'eau qui ne peut pas être pompée ne sont pas affichés ; les plans de réparation d'un contact ne sont pas connus) et moteur ; jaune / orange / rouge selon la gravité, et une icône de carte plus grise quand le navire va couler (sous 20 minutes selon la tendance d'envahissement / coque). Un contact : feu, eau, coque et moteur seulement en vue directe ; au sonar - le moteur seul (jaune : une partie perdue, rouge : rien ne marche) ; au radar - une estimation pour un navire touché ces 10 dernières minutes, marquée « ? » (jaune : 10 nœuds ou moins, rouge : moins de 3) ; rien par ESM ou sans contact, et rien pour un navire coulé. La ligne Fires de l'onglet Damage Control utilise la même force totale. L'Unit Status d'un contact montre un onglet Damage State avec la même information en mots.
