ships_that_collide_are_damaged_hull_loss.6567ee = Les navires qui se heurtent subissent des dégâts : perte de coque et voies d'eau là où les coques se touchent. Désactivé : pas de dégâts de collision (le freinage des navires se règle à part).
the_water_holds_a_ship_that_is_shoved_si.81f347 = L'eau retient un navire poussé de côté ou tourné (l'eau entraînée avec lui, la traînée) : en travers de sa coque un navire compte plusieurs fois plus lourd que son déplacement, dans l'axe à peine plus. Ainsi un éperonnage dans le flanc est plus freiné et déplace moins sa cible. 1.0 = environ cinq fois le déplacement en travers, 0 = le déplacement seul.
water_resistance.dd4b95 = Résistance de l'eau
hull_damage_from_a_collision_of_ships_th.72d875 = Dégâts à la coque lors d'une collision de navires (le jeu n'en a pas). Les dégâts sont l'énergie perdue tant que les navires restent en contact (choc, poussée, frottement), par tonne de son propre déplacement ; le navire le plus léger souffre le plus. 1.0 = deux navires égaux qui se heurtent à 19 nœuds ruinent chacun environ un compartiment et quart. Ils touchent les compartiments au point de contact et ouvrent des voies d'eau. 0 = désactivé.
multiplier_of_the_flooding_that_a_collis.b248fb = Multiplicateur de l'envahissement qu'ouvre une collision (les voies d'eau des compartiments endommagés). 1.0 = comme calculé, 0 = les collisions n'ouvrent pas de voies d'eau.
ships_that_collide_lose_speed_the_relati.e3d249 = Les navires qui se heurtent perdent de la vitesse : la vitesse relative perpendiculaire au contact est presque entièrement perdue (le navire léger en perd le plus, le lourd à peine), le long du contact une partie seulement (voir « Perte de vitesse par pression »). La physique du jeu ne freine pas les navires, c'est le mod qui le fait. 1.0 = la perte de vitesse complète qu'un tel choc donne, 0.5 = la moitié, 0 = les navires gardent leur vitesse. Le navire reprend ensuite de la vitesse avec ses machines.
the_share_of_the_sliding_along_the_conta.d54692 = La part de la vitesse de glissement (le long du contact) qu'un choc retire, proportionnelle à la pression des navires l'un sur l'autre (un éperonnage dans le flanc retire presque toute la vitesse de glissement, le contact de coques parallèles rien).
