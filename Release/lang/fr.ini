how_many_times_less_damage_per_ton_the_b.8ff5be = Combien de fois moins de dégâts par tonne subit l'étrave (avec sa cloison de collision) que le flanc d'un navire, lors d'un choc dans l'axe du navire. 1.0 = partout pareil.
ships_in_contact_are_slowly_moved_apart.81b360 = Les navires en contact sont lentement écartés (environ un demi-mètre par seconde), pour qu'un navire qui a éperonné ne reste pas à l'intérieur de l'autre. Le jeu ne sépare pas les navires qui se chevauchent.
the_share_of_the_sliding_along_the_conta.ed336c = La part de la vitesse de glissement (le long du contact) qu'un choc retire par frottement et écrasement des coques ; des navires côte à côte égalisent leurs vitesses d'autant plus qu'elle est élevée.
