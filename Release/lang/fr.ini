diagnostics_every_10_seconds_writes_to_t.f68e49 = Diagnostic : toutes les 10 secondes, écrit dans la trace (Debug) le temps pris par les hooks du mod : par hook les appels, le temps en ms et en % du temps réel – pour trouver ce qui ralentit le jeu (en forte accélération du temps, les hooks de physique tournent plusieurs fois par image).
