; Alternative Damage Model - texts, language: fr
; key = text   (\n = line break; keep {0} {1} ...)
; Machine translation, not checked by a native speaker: corrections are welcome.

a_burning_section_opens_its_plugged_leak.20b488 = Une section en feu rouvre ses voies d'eau colmatées : % de la plus grande voie d'eau de la section par seconde à feu 100% (moins pour un feu plus petit). 0 = désactivé.
a_fire_does_not_spread_into_a_compartmen.6e664b = Un feu ne se propage pas dans un compartiment où se trouve une équipe de lutte contre les avaries (elle l'arrête à la porte). Désactivé = comme dans le jeu.
a_fire_no_damage_control_team_has_fought.5e3fa0 = Un feu qu'aucune équipe de lutte contre les avaries ne combat pendant un moment grandit de plus en plus vite : à chaque contrôle de feu (FireCheckTime, 10 s) son taux de croissance augmente comme si la section était de nouveau touchée. Désactivé = comme dans le jeu (un feu ne grandit que par les coups au but).
a_fully_flooded_section_water_above_75_i.aaedbd = Une section entièrement inondée (eau au-dessus de 75%) : ses systèmes sont gravement endommagés, rendus inopérants et ne peuvent être réparés tant qu'elle reste inondée.
a_hit_on_a_compartment_that_is_already_d.364c92 = Un coup sur un compartiment déjà détruit n'est pas perdu : la moitié des dégâts va au compartiment voisin (du même bord, vers le milieu du navire) ; s'il est détruit aussi, un quart va au suivant. L'excédent d'un coup qui détruit un compartiment se répartit de la même façon.
a_hit_on_a_section_can_wound_its_teams_a.ebfa16 = Un coup sur une section peut blesser ses équipes à toute intégrité. Désactivé = comme dans le jeu : seule une section touchée d'intégrité inférieure à 50% peut mettre une équipe hors de combat, avec la chance dégâts x (1 - intégrité), au plus 20%. Activé = chaque coup sur une section avec équipes obtient le jet de blessure (voir Wound chance) ; une équipe blessée va en réserve.
a_leak_reopened_by_fire_grows_back_up_to.ccd570 = Une voie d'eau rouverte par le feu regrandit jusqu'à ce % de la plus grande voie d'eau qu'ait eue la section.
a_section_under_the_sea_puts_its_fire_ou.3d1565 = Une section sous la mer éteint son feu : le feu perd ce % de son maximum par seconde pour chaque mètre dont le bord de pont de la section est sous l'eau (1 = autant de % par seconde que de mètres). Seulement lorsque les deux points de pont de la section (bâbord et tribord) sont sous l'eau ; la profondeur est la moyenne des deux. Nécessite les points de pont du navire (comme l'envahissement par le pont). 0 = désactivé.
a_team_cannot_plug_holes_while_the_ship.f5f08f = Une équipe ne peut pas colmater les brèches tant que le navire va plus vite que cela, en nœuds. 0 = pas de limite.
a_team_in_a_burning_section_loses_this_m.ecb388 = Une équipe dans une section en feu perd cette part de sa santé complète par seconde à feu 100%, sauf si au moins une équipe de la section combat le feu (moins pour un feu plus faible).
a_team_in_the_reserve_recovers_this_much.2dd530 = Une équipe en réserve récupère cette part de sa santé complète par seconde.
ai_ships_not_the_player_s_own_shorter_th.37c7d6 = Les navires de l'IA (pas les vôtres) de moins de 50 m ne sont pas ralentis par l'envahissement : la réduction de vitesse du jeu due aux brèches et à l'eau est désactivée pour eux (ils continuent, comme des kamikazes). Le bouton « Limit Speed » de vos navires est distinct.
chance_of_a_severe_fire_from_50_of_its_m.c967a4 = Chance qu'un feu violent (à partir de 50% de son maximum) se propage aux sections voisines, en % par contrôle de feu : le jeu contrôle toutes les FireCheckTime (10 s) avec une chance de 0,0133% - presque jamais. 0.0133 = comme dans le jeu ; 1.0 = 1% par contrôle (environ une fois par 17 minutes de feu violent), 0 = jamais.
colours_the_weapon_buttons_of_the_select.a41d7b = Colore les boutons d'armes du panneau du bas de l'unité sélectionnée selon l'état de ses systèmes d'armes : tout fonctionne - couleur du jeu, une partie de ce type hors service - jaune, tout hors service - rouge.
concussion_a_team_wounded_by_a_weapon_a.2d37ab = Commotion : une équipe blessée par une arme (dans une section touchée ou en réserve) reste commotionnée ce nombre de secondes après son entrée en réserve ; Auto DC ne la renvoie pas au travail avant la fin de la commotion. Elle court en parallèle de la santé de l'équipe, qui a sa propre récupération. 0 = pas de commotion.
counterflooding_lets_water_into_one_side.8d3f44 = Le contre-envahissement n'admet de l'eau d'un côté d'un compartiment que jusqu'à ce % (la limite propre du compartiment dans le jeu s'applique aussi).
damage_control_efficiency_while_the_ship.d761c8 = Efficacité de la lutte contre les avaries tant que le moteur du navire (le module Engine utilisé, pas la propulsion) est hors service : efficacité des équipes en % (feux, brèches, eau, coque ; la réparation des systèmes n'est pas touchée). Affichée dans les infobulles des équipes et dans la ligne Forecast de l'onglet Damage Control. 100 = désactivé.
damage_control_teams_in_a_section_with_a.e2dc23 = Les équipes de lutte contre les avaries dans une section en feu qui ne le combattent pas travaillent à ce % de leur efficacité. 100 = désactivé.
damage_control_teams_of_a_civilian_ship.630d69 = Équipes de lutte contre les avaries d'un navire civil selon le déplacement : tonnes=équipes.
damage_control_teams_of_a_submarine_by_d.556a4a = Équipes de lutte contre les avaries d'un sous-marin selon le déplacement : tonnes=équipes.
damage_control_teams_of_a_surface_warshi.2960b3 = Équipes de lutte contre les avaries d'un navire de guerre de surface selon le déplacement : tonnes=équipes, à partir de ce nombre de tonnes. NumberOfDCTeams dans l'ini d'un navire fixe toujours son propre nombre.
debug_draws_the_selected_ship_s_hull_onl.f6f266 = Débogage : dessine les colliders de coque seule (coll_hull*) du navire sélectionné en surimpression translucide avec un fil de fer lumineux de leurs vrais triangles, pour comparer directement avec le modèle 3D visible.
debug_for_the_ship_currently_selected_in.50880e = Débogage : pour le navire sélectionné dans le panneau Unit Status, dessine une ligne de la vague actuelle à la hauteur de pont estimée sur l'axe de la proue et de la poupe de la coque, et sur une paire bâbord/tribord par section du modèle de dégâts (son propre point central en longueur) - colliders de coque seulement, pas les tourelles, mâts ni autres sous-modèles. Vert : le point passe au-dessus de la vague ; rouge : la vague est par-dessus.
debug_how_the_selected_ship_s_own_3d_mod.2876b5 = Débogage : comment le modèle 3D du navire sélectionné (sous-modèles compris) est dessiné, pour voir ShowDeckCorners/ShowHullCollider : Show (comme dans le jeu), Translucent (transparent à 70%) ou Hide.
diagnostics_while_a_ship_lists_or_trims.7ab078 = Diagnostic : tant qu'un navire gîte ou assiette sensiblement, écrit toutes les 2 secondes dans le journal BepInEx : gîte, assiette, hauteur, flottabilité contre poids, volume immergé, eau dans le navire et s'il coule / a chaviré.
diagnostics_writes_every_fire_started_by.c267ad = Diagnostic : écrit dans le journal BepInEx chaque feu déclenché par un coup et chaque changement de stade d'un feu (navire, compartiment, temps de mission, gravité et croissance en % du maximum du compartiment, équipes de lutte contre les avaries présentes). Fonctionne aussi mod désactivé dans le menu Mods, pour comparer avec le jeu.
enables_verbose_logging_and_bepinex_alte.5d311f = Active la journalisation détaillée et BepInEx/AlternativeDamageModel.trace.txt.
fire_row_one_arrow_when_the_fire_changes.2c03b0 = Ligne de feu : une flèche quand le feu change plus vite que cela, en % de son maximum par seconde.
fire_row_two_arrows_down_when_the_fire_i.cfce19 = Ligne de feu : deux flèches vers le bas quand le feu est éteint plus vite que cela, en % de son maximum par seconde.
fire_row_two_arrows_up_when_the_fire_gro.8de955 = Ligne de feu : deux flèches vers le haut quand le feu grandit plus vite que cela, en % de son maximum par seconde.
fixes_an_error_of_the_game_itself_above.638bbb = Corrige une erreur du jeu lui-même : au-dessus de 10x de compression du temps, l'assiette d'un navire croît avec la compression (une vedette de 25 m à 47 nœuds : 2,6 degrés jusqu'à 10x, 9 à 100x) - de quoi couler un navire court, rapide et indemne. Le jeu déplace un navire d'un pas par tick de physique, et au-dessus de 10x ce pas est étiré alors que le couple de flottabilité est pris autour du centre de masse d'avant le pas. Activé : ce pas supplémentaire est omis, l'assiette reste celle de 10x à toute compression ; jusqu'à 10x rien ne change. Navires de surface seulement. Désactivé : le comportement du jeu.
flooding_row_and_flooding_plan_one_arrow.802936 = Ligne d'envahissement et plan d'envahissement : une flèche quand le niveau d'eau change plus vite que cela, en % du compartiment par seconde.
flooding_row_and_flooding_plan_two_arrow.129e17 = Ligne d'envahissement et plan d'envahissement : deux flèches quand le niveau d'eau change plus vite que cela, en % du compartiment par seconde.
four_small_icons_under_a_ship_s_icon_on.001776 = Quatre petites icônes sous l'icône d'un navire sur la carte (le vôtre aussi) : feu (force totale des feux), eau, coque (classée comme dans le panneau Damage Control) et moteur ; jaune / orange / rouge selon la gravité, et une icône de carte plus grise quand le navire va couler (sous 20 minutes selon la tendance d'envahissement / coque). Un contact : feu, eau, coque et moteur seulement en vue directe ; au sonar - le moteur seul (jaune : une partie perdue, rouge : rien ne marche) ; au radar - une estimation pour un navire touché ces 10 dernières minutes, marquée « ? » (jaune : 10 nœuds ou moins, rouge : moins de 3) ; rien par ESM ou sans contact, et rien pour un navire coulé. La ligne Fires de l'onglet Damage Control utilise la même force totale. L'Unit Status d'un contact montre un onglet Damage State avec la même information en mots.
health_of_a_damage_control_team_a_multip.330f74 = Santé d'une équipe de lutte contre les avaries, un multiplicateur de son maximum, qui est de 1..100 points selon le déplacement du navire (100 = équipage de 1000 et plus, environ 30000 t ; 1000 t = 24, 10000 t = 101). Affichée dans l'infobulle de l'équipe comme part du total. Une équipe à 0 est morte. Les équipes blessées travaillent plus lentement (autant que leur santé, pas moins de 25%). 0 = les équipes ne sont jamais blessées (un coup sort tout de même une équipe de sa section).
how_fast_a_fire_eats_the_hull_of_its_sec.e66317 = Vitesse à laquelle un feu ronge la coque de sa section (intégrité de ses deux compartiments). 1.0 = comme dans le jeu. Les dégâts aux systèmes de la section ne changent pas.
how_fast_a_team_in_the_reserve_gets_rid.f8c330 = Vitesse à laquelle une équipe en réserve se débarrasse de la fatigue, % de la vitesse à laquelle elle s'accumule en travaillant. 100 = aussi vite ; 50 = le repos dure deux fois plus que le travail.
how_fast_a_team_walks_through_the_ship_m.440ac9 = Vitesse de marche d'une équipe à travers le navire, mètres par minute (la réserve est au milieu). Un transfert = MusterTime + le trajet, arrondi à 10 s. 0 = pas de temps de marche ; avec MusterTime aussi à 0, les équipes se déplacent aussitôt et Auto DC est celui du jeu.
how_fast_damage_control_teams_pump_water.daadca = Vitesse à laquelle les équipes de lutte contre les avaries épuisent l'eau. 1.0 = comme dans le jeu.
how_fast_damage_control_teams_put_fires.5d5eaf = Vitesse à laquelle les équipes de lutte contre les avaries éteignent les feux. 1.0 = comme dans le jeu.
how_fast_fires_grow_by_themselves_betwee.e757ca = Vitesse à laquelle les feux grandissent d'eux-mêmes, entre les coups. 1.0 = comme dans le jeu, 2.0 = deux fois plus vite, 0.5 = moitié moins vite.
how_fast_water_comes_in_through_the_hole.cad705 = Vitesse à laquelle l'eau entre par les brèches d'un compartiment. 1.0 = comme dans le jeu.
how_many_times_stronger_the_hull_of_civi.706453 = Combien de fois la coque des navires civils (fichiers ini civ_*) est plus solide que dans le jeu. 1.0 = comme dans le jeu.
how_many_times_stronger_the_hull_of_subm.d3d1a9 = Combien de fois la coque des sous-marins est plus solide que dans le jeu. 1.0 = comme dans le jeu.
how_many_times_stronger_the_hull_of_surf.32130e = Combien de fois la coque des navires de guerre de surface est plus solide que dans le jeu. 1.0 = comme dans le jeu, 2.0 = deux fois plus solide. Les navires individuels reçoivent leur propre valeur dans la section [HullIntegrityPerShip], une ligne par navire : nom du fichier ini = multiplicateur (p. ex. usn_bb_iowa = 3.0).
how_much_one_team_gets_done_plugging_fir.8ecb35 = Ce qu'accomplit une équipe (colmatage, lutte contre le feu, épuisement, réparations de coque et de systèmes) par rapport au jeu. 1.0 = comme dans le jeu.
how_strongly_the_list_follows_uneven_flo.541fe4 = Dans quelle mesure la gîte suit l'envahissement inégal. La différence d'eau entre bâbord et tribord d'une section (qui fait gîter le navire) est multipliée par cela ; la moyenne de la section est conservée, donc le tirant d'eau et l'assiette n'en changent pas. 1 = comme dans le jeu, 2 = deux fois la gîte pour la même différence.
how_the_ship_s_speed_changes_the_growth.6d2cf6 = Comment la vitesse du navire modifie la croissance des feux et l'eau qui entre (par les brèches et par le bord de pont) : nœuds=multiplicateur d'envahissement/de feu, une ligne brisée par les points. La vitesse est prise en valeur absolue ; en dessous du premier point et au-dessus du dernier valent les multiplicateurs extrêmes.
language_of_the_mod_s_texts_en_ru_cn_de.ce16f7 = Langue des textes du mod : en, ru, cn, de, es, fr, ko, ja ou vn. Vide = la langue du jeu. Les textes sont dans le dossier lang du mod (lang/<code>.ini) ; un texte manquant s'affiche en anglais.
list_degrees_the_full_scale_of_the_list.a220dc = Gîte, degrés : l'échelle complète de l'indicateur LIST. À partir de sa zone rouge (75%) l'eau passe par le bord de pont et inonde vite tous les compartiments du bord bas (jeu : à 45). Elle ne coule pas le navire à elle seule ; le chavirement à 70 degrés si, comme dans le jeu.
metres_the_trim_limit_depends_on_the_shi.be80af = Mètres. La limite d'assiette dépend de la longueur du navire : plus le navire est long, plus tôt son avant ou son arrière plonge au même angle (tan limite = tan TrimLimit x (TrimReferenceLength / longueur)^0.442 ; avec 5.2 à 100 : 30 m 8.8, 60 m 6.5, 150 m 4.4, 300 m 3.2 degrés). 0 = TrimLimit pour tous les navires (comme dans le jeu).
minutes_of_work_in_a_section_until_a_tea.abe7fb = Minutes de travail dans une section jusqu'à ce qu'une équipe soit fatiguée (premier niveau) ; sa vitesse baisse selon les réglages Speed. La réserve ôte la fatigue aussi vite que le travail la construit. Affichée dans l'infobulle de l'équipe ; l'icône d'une équipe fatiguée est mise en évidence. 0 = pas de fatigue.
minutes_of_work_until_a_team_is_exhauste.461264 = Minutes de travail jusqu'à ce qu'une équipe soit épuisée, le second niveau de fatigue (au plus : la fatigue cesse de croître là). Pas au-dessus de « Tired after » = pas de second niveau.
multiplier_of_the_chance_that_a_hit_woun.6766c6 = Multiplicateur de la chance qu'un coup blesse une équipe (0.5 = moitié moins probable, 2 = deux fois ; le résultat est au plus 100%). Étape 1 (seulement tant que Wounds at any hull integrity est désactivé) - le jeu décide si un coup sort une équipe de sa section (seule une section touchée d'intégrité inférieure à 50% : dégâts x (1 - intégrité), au plus 20%). Étape 2 - le mod décide de la blessure : la chance croît fortement avec la puissance de l'ogive (environ puissance^1.8) et baisse avec la santé de l'équipe (environ santé^1.2) - ogive 2.2 contre santé 2 : environ 10%, contre 100 : 0,1% ; ogive 82 contre 100 : environ 75% ; bien au-dessus, plus de 100%. Elle est multipliée par ce multiplicateur puis limitée à 100% (avec Wounds at any hull integrity désactivé, une équipe non blessée quitte quand même la section). Une ogive plus puissante augmente la chance. Un navire plus grand la réduit : ses équipes sont plus robustes (plus de santé) et ses compartiments plus grands, un coup tombe moins probablement là où est l'équipe. Même le coup le plus faible a une petite chance. Exemple, ogive 25 : contre santé 12 environ 100%, contre 29 environ 37%, contre 100 environ 9%. 0 = jamais blessées.
multiplier_of_the_strength_of_a_wound_at.119bcb = Multiplicateur de la force d'une blessure : au plus la puissance de l'ogive de la munition (0..196, la moitié des munitions du jeu sous 25) x cela, en points de santé de l'équipe (1..100 selon le déplacement). Une équipe blessée va en réserve.
random_spread_of_the_concussion_time_sec.c54f69 = Dispersion aléatoire du temps de commotion, secondes dans chaque sens : HealTime 90 avec 30 = 60 à 120 s, comme dans le jeu. 0 = toujours HealTime.
resistance_to_the_horizontal_movement_of.dc8036 = Résistance au mouvement HORIZONTAL d'un navire détruit, en multiple de la traînée linéaire du jeu (25 pour presque tous les navires) : l'épave perd plus tôt son erre. 1 = comme dans le jeu. L'enfoncement (mouvement vertical) et la rotation (chavirement) ne sont pas ralentis.
seconds_game_time_so_time_compression_co.551b95 = Secondes (temps de jeu, la compression compte) pendant lesquelles le point de pont d'un compartiment doit rester d'affilée sous la mer avant que l'eau commence à entrer par le pont (voir DeckFloodingSpeed). Un point qui refait surface remet le minuteur à zéro. Par défaut 3.
seconds_a_team_needs_to_get_ready_before.3b6e27 = Secondes dont une équipe a besoin pour se préparer avant chaque transfert. Annuler un transfert pendant qu'elle se prépare ne coûte aucun temps.
settings_profile_in_use_chosen_in_the_ga.331d79 = Profil de réglages utilisé, choisi dans le jeu : Unit Status -> Damage Control -> l'engrenage à côté de (i). Ce fichier ne contient que les réglages généraux ([General], [UI]) ; les valeurs du modèle de dégâts sont dans le fichier du profil : les profils intégrés dans le dossier Profiles du mod (lecture seule), les vôtres dans StreamingAssets/user/AlternativeDamageControl/Profiles. Modifier un profil intégré dans le jeu l'enregistre comme Custom. Les modifications du fichier du profil utilisé, ou de ce nom, sont prises en compte pendant que le jeu tourne.
ships_ini_file_names_comma_separated_edi.c5b815 = Navires (noms de fichiers ini, séparés par des virgules ; modifiés dans la fenêtre de réglages, onglet Flooding) qui ne reçoivent pas de Deck Points : ils sont inondés selon les anciennes règles plus simples, comme un navire sans collider de coque.
team_fatigue_on_working_builds_it_up_the.e170b3 = Fatigue des équipes activée : le travail la construit, la réserve l'ôte, une équipe fatiguée travaille à demi-vitesse. Désactivé = pas de fatigue ; ses réglages sont masqués.
team_health_on_wounds_from_hits_and_fire.0440b7 = Santé des équipes activée : blessures par les coups et les feux, récupération en réserve, les équipes blessées travaillent plus lentement. Désactivé = règles du jeu (un coup met une équipe hors de combat un moment, pas de blessures) ; les autres réglages de santé sont masqués.
the_detailed_view_of_unit_status_damage.b04888 = La vue détaillée de Unit Status -> Damage Control (l'affichage du mod) : intégrité de la coque par bord à côté du nom de chaque section, une icône par équipe de lutte contre les avaries (sa tâche ; tâches et déplacements à la main avec Auto DC désactivé), eau et feu en % avec flèches de tendance, DC Priority, les cartes d'équipe, les indicateurs LIST / TRIM / LEVEL avec le plan d'envahissement, infobulles, la légende (i). Désactivé : la vue propre du jeu (l'engrenage de la fenêtre de réglages reste).
the_mod_s_damage_model_and_damage_contro.b3b07a = Le modèle de dégâts et la lutte contre les avaries du mod : solidité de la coque et des systèmes, effets secondaires, vitesses de feu et d'envahissement, propagation du feu, équipes de lutte contre les avaries (nombres, efficacité, transferts à pied, mises hors de combat, l'Auto DC optimisé, déplacement d'équipes isolées), limites de gîte / assiette / naufrage. DC Priority et les tâches données à la main relèvent de la vue détaillée et restent. Désactivé : les dégâts et la lutte contre les avaries propres au jeu (la vue de l'onglet Damage Control reste). Peut être basculé à tout moment : les navires en mer suivent aussitôt (solidité de la coque et nombre d'équipes reviennent à ceux du jeu ou du mod ; les équipes en mouvement arrivent, celles hors de combat se rétablissent).
the_teams_rest_in_the_central_compartmen.4ac676 = Les équipes se reposent dans le compartiment central : un coup dessus peut blesser une équipe qui attend en réserve (la chance est celle du jeu pour une équipe mise hors de combat dans une section touchée : dégâts x (1 - intégrité), seulement sous 50% d'intégrité). Une équipe au repos blessée reste en réserve.
trim_degrees_for_a_ship_trimreferencelen.8ab413 = Assiette, degrés, pour un navire long de TrimReferenceLength : l'échelle complète de l'indicateur TRIM. À partir de sa zone rouge (75%) l'extrémité qui s'enfonce est vite inondée : de chaque bord son compartiment le plus extérieur, quand il est plein le suivant, et ainsi de suite. Le navire ne coule pas aussitôt, contrairement au jeu (8 degrés avec une section inondée).
unattended_fire_how_much_the_growth_rate.84fa6e = Feu sans surveillance : de combien le taux de croissance augmente à chaque contrôle de feu, en % du taux de croissance maximal du feu (un coup ordinaire ajoute 0,1-0,8%).
unattended_fire_its_growth_rate_is_raise.b4969b = Feu sans surveillance : son taux de croissance n'est relevé que jusqu'à cette valeur, en % du maximum du feu par seconde.
unattended_fire_seconds_without_a_team_f.098d15 = Feu sans surveillance : secondes sans équipe combattant le feu (depuis son début, ou la dernière fois qu'une équipe l'a combattu) avant qu'il ne grandisse plus vite.
vulnerability_of_the_hull_to_flooding_th.35677a = Vulnérabilité de la coque à l'envahissement par les brèches ouvertes par les coups (tous types d'armes). 1.0 = chaque brèche laisse entrer autant d'eau que dans le jeu, et les brèches au-dessus de la flottaison commencent à fuir après les mêmes dégâts que dans le jeu (la coque plus solide ne retient pas l'eau). 2.0 = deux fois plus d'eau ; 0.5 = moitié moins.
vulnerability_of_the_hull_to_gun_shells.c70d65 = Vulnérabilité de la coque aux obus de canon (missiles, torpilles et bombes ne sont pas concernés). Les obus de canon prennent une part de la limite de naufrage d'un navire qui dépend de la taille de la coque. 1.0 = chaque obus prend autant que dans le jeu ; la coque plus solide survit simplement à plus de coups. 2.0 = les obus frappent comme si la coque était deux fois plus petite ; 0.5 = comme si elle était deux fois plus grande (les obus moyens peuvent cesser de blesser les grands navires).
vulnerability_of_the_ship_to_fires_start.50481c = Vulnérabilité du navire aux feux déclenchés par les coups (tous types d'armes). La coque plus solide retient aussi les feux dans la même proportion : avec Warships = 5.0 un coup déclenche un feu 5 fois plus faible (relativement au compartiment) que dans le jeu. 1.0 = ce comportement normal du mod. 2.0 = feux deux fois plus forts qui grandissent deux fois plus vite ; 0.5 = moitié moins forts. 1.0 avec tous les multiplicateurs de coque à 1.0 = comme dans le jeu.
water_in_a_section_limits_its_fire_it_ca.4e7ab1 = L'eau dans une section limite son feu : il ne peut pas être plus fort que (100 - % d'eau de la section) du maximum. Un feu plus fort retombe à cette limite à ce % du maximum par seconde. 0 = désactivé.
water_in_the_whole_ship_the_average_of_i.a5b547 = Eau dans tout le navire, % (moyenne de ses compartiments), à partir de laquelle il coule, comme dans le jeu (jeu : 40 ; les sous-marins gardent les 50 du jeu). Aussi l'échelle complète de l'indicateur LEVEL.
water_over_the_deck_edge_a_multiplier_fo.512690 = Eau par le bord de pont, un multiplicateur. Pour les navires dont les points de pont sont connus (l'algorithme complet de collider de coque) : quand le point de pont d'un compartiment est resté DeckFloodingDelay secondes d'affilée sous la mer (temps de jeu, la compression compte), le compartiment prend de l'eau que la lutte contre les avaries ne peut arrêter - 1.0 = 0,1% de son volume par seconde par mètre d'immersion (plus profond = plus vite) ; un compartiment plein passe l'eau au voisin non plein le plus bas, et ainsi de suite le long de la chaîne. Pour les autres navires : vitesse à laquelle l'extrémité qui s'enfonce (assiette au-delà de sa limite) ou le bord bas (gîte au-delà de sa limite) prend l'eau par le bord de pont - mécanique propre au mod, pas dans le jeu. 2.0 = deux fois plus vite, 0.5 = moitié moins, 0 = désactivé.
when_a_ship_starts_to_sink_the_game_puts.562c7b = Quand un navire commence à couler, le jeu place son centre de masse à l'origine de la coque ((0, 1, 0) s'il a chaviré) : le centre de masse saute, et avec lui chaque couple sur la coque. Activé = le centre de masse reste où il était. Désactivé = comme dans le jeu.
while_a_team_plugs_the_holes_of_a_compar.45b8d7 = Pendant qu'une équipe colmate les brèches d'un compartiment (la tâche Flooding Rate), elle en épuise l'eau en même temps : cette part de la vitesse d'épuisement (0.5 = moitié, 0 = désactivé). Une équipe à qui l'on ordonne un contre-envahissement n'épuise que du côté où cela n'aggrave ni la gîte ni l'assiette.
work_speed_of_a_rested_team_the_starting.1e64b0 = Vitesse de travail d'une équipe reposée, % (point de départ de la courbe de fatigue). La vitesse baisse en ligne droite d'ici jusqu'au niveau fatigué.
work_speed_of_a_team_that_has_just_becom.425925 = Vitesse de travail d'une équipe qui vient de se fatiguer, %. Entre les niveaux fatigué et épuisé la vitesse baisse en ligne droite.
work_speed_of_an_exhausted_team_it_stays.4cfc9a = Vitesse de travail d'une équipe épuisée, % ; elle y reste tant que l'équipe continue de travailler.
writes_a_line_to_the_bepinex_log_for_eve.b5d6a8 = Écrit une ligne dans le journal BepInEx pour chaque navire qui entre dans une mission : son intégrité de coque dans le jeu et avec le mod.
