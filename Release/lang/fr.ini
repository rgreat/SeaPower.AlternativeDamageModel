collisions_affect_the_ships_of_the_ai_to.f0324c = Les collisions touchent aussi les navires de l'IA (coque et vitesse). Désactivé : seul le navire que vous commandez est touché.
ships_that_collide_are_damaged_and_slowe.8a2df6 = Les navires qui se heurtent subissent des dégâts et sont freinés. Désactivé : une collision entre navires ne fait rien, comme dans le jeu.
ships_that_collide_lose_speed_the_relati.034c35 = Les navires qui se heurtent perdent de la vitesse : la vitesse relative perpendiculaire au contact est presque entièrement perdue (le navire léger en perd le plus, le lourd à peine), le long du contact une partie seulement (voir « Perte de vitesse par frottement » et « Perte de vitesse par pression »). La physique du jeu ne freine pas les navires, c'est le mod qui le fait. 1.0 = la perte de vitesse complète qu'un tel choc donne, 0.5 = la moitié, 0 = les navires gardent leur vitesse. Le navire reprend ensuite de la vitesse avec ses machines.
