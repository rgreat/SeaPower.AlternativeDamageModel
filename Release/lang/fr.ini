small_ships_burn_and_flood_faster_the_gr.a5be2b = Les petits navires brûlent et se remplissent plus vite : la croissance des incendies et l'eau qui entre augmentent progressivement (selon le logarithme du déplacement) de 1 à 1000 tonnes jusqu'à ce multiplicateur à 50 tonnes, et restent ainsi en dessous. Les navires de 1000 tonnes et plus ne changent pas. 1 = désactivé.
