auto_dc_counterfloods_while_holes_still.741337 = Auto DC contre-inonde : tant que des brèches laissent encore entrer l'eau et que la gîte ou l'assiette atteint la zone rouge de son indicateur (jusqu'à redescendre à sa moitié), une équipe va dans la section où laisser entrer l'eau d'un bord retire le plus de bande, et travaille comme une équipe à qui l'on a ordonné la contre-inondation (voir Contre-inondation). Désactivé = Auto DC ne contre-inonde pas.
contacts_between_ships_at_a_relative_spe.3749a0 = Les contacts entre navires à une vitesse relative inférieure à celle-ci, en nœuds, ne causent aucun dégât (navires qui se touchent en formation, amarrage).
damage_to_the_hull_from_a_collision_with.efa04c = Dégâts à la coque lors d'une collision avec un autre navire (le jeu n'en a pas : les navires ne font que se repousser). Une collision n'est pas un seul choc : une étrave qui éperonne peut grimper sur l'autre navire et glisser par-dessus. Les dégâts sont l'énergie que la physique dissipe, pas à pas, tant que les navires restent en contact (le choc, la poussée, le raclage ; un navire qui repose simplement sur un autre ne perd rien). Chaque navire prend la part qui dépend des masses : le carré de la vitesse multiplié par (m_other / (m_self + m_other))^2 par tonne de son propre déplacement. 1.0 = deux navires identiques qui se heurtent à 19 nœuds détruisent chacun environ 1,25 compartiment ; une petite embarcation qui éperonne un grand navire est détruite, le navire seulement éraflé. Les dégâts touchent les compartiments où les navires se touchent à ce moment (l'endroit et le bord des points de contact) et ouvrent des voies d'eau comme un coup au but, qui grandissent avec les dégâts subis (un contact au-dessus de la ligne de flottaison ne fuit que d'un compartiment à moitié détruit). 0 = désactivé.
