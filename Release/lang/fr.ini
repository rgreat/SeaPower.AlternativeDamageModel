ships_that_collide_lose_speed_the_relati.a08a6f = Les navires qui se heurtent perdent de la vitesse : la vitesse relative perpendiculaire au contact est presque entièrement perdue (le navire léger en perd le plus, le lourd à peine), le long du contact une partie seulement (voir « Freinage par frottement » et « Freinage par pression »). La physique du jeu ne freine pas les navires, c'est le mod qui le fait. Le navire reprend ensuite de la vitesse avec ses machines. 0 = les navires gardent leur vitesse.
